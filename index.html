<style>
  :root {
    --teal: #0E4749;
    --teal-dark: #082F31;
    --coral: #FF6B4A;
    --coral-dark: #E85535;
    --gold: #F2A65A;
    --bg: #FFF9F1;
    --card: #FFFFFF;
    --sand: #F5EBDC;
    --border: #EDE1D1;
    --text: #20302F;
    --text-muted: #6B5D4F;
    --green: #1A6B49;
    --green-bg: #E4F5EC;
    --red: #B8352B;
    --red-bg: #FDECEA;
    --amber: #946017;
    --amber-bg: #FBF0DE;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  body {
    margin: 0;
    font-family: "Poppins", ui-rounded, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  #app { max-width: 720px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(120deg, var(--teal) 0%, var(--teal) 65%, var(--coral-dark) 130%);
    color: #fff; padding: 16px 18px; margin: -16px -16px 16px;
    border-radius: 0 0 20px 20px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 6px 16px rgba(14, 71, 73, 0.18);
  }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .topbar .sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 1px; }

  }
  .topbar button {
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer;
    transition: background 0.15s ease;
  }
  .topbar button:hover { background: rgba(255,255,255,0.24); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px; margin-bottom: 14px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(32, 48, 47, 0.04);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 700; }
  .mode-banner {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;
    padding: 10px 14px; border-radius: 12px; margin-bottom: 16px;
  }
  .mode-banner .mode-label { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; }
  .mode-banner .mode-meta { font-size: 12px; opacity: 0.85; }
  .mode-banner.mode-self { background: var(--green-bg); color: var(--green); }
  .mode-banner.mode-leader { background: var(--amber-bg); color: var(--amber); }
  .mode-banner.mode-hr { background: #E8E3F5; color: #6C4FB6; }
  label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 11px 14px; font-size: 15px; border: 1.5px solid var(--border);
    border-radius: 12px; background: #fff; color: var(--text); margin-bottom: 14px;
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus { outline: none; border-color: var(--coral); }
  button.primary {
    width: 100%; padding: 13px; font-size: 14px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--coral), var(--gold)); border: none; border-radius: 14px;
    cursor: pointer; transition: transform 0.1s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 12px rgba(255, 107, 74, 0.28);
  }
  button.primary:hover { box-shadow: 0 6px 16px rgba(255, 107, 74, 0.36); }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.5; box-shadow: none; }
  button.secondary {
    padding: 9px 16px; font-size: 13px; border: 1.5px solid var(--border); font-weight: 600;
    background: #fff; border-radius: 12px; cursor: pointer; color: var(--text);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  button.secondary:hover { border-color: var(--coral); }
  button.secondary:active { transform: scale(0.97); }
  button.ghost { background: transparent; border: none; color: var(--teal); font-weight: 600; font-size: 13px; cursor: pointer; }

  .staff-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 14px; margin-bottom: 8px; cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
    background: #fff;
  }
  .staff-row:hover { border-color: var(--coral); background: #FFFCF8; }
  .clickable-card { transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease; }
  .clickable-card:hover { background: #FFFCF8; box-shadow: 0 3px 12px rgba(32,48,47,0.10); }
  .clickable-card:active { transform: scale(0.99); }
  .staff-row:active { transform: scale(0.99); }
  .staff-row .name { font-size: 14px; font-weight: 600; }
  .staff-row .dept { font-size: 12px; color: var(--text-muted); }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
  .badge.done { background: var(--green-bg); color: var(--green); }
  .badge.pending { background: var(--sand); color: var(--text-muted); }
  .badge.performer { background: var(--green-bg); color: var(--green); }
  .badge.underperform { background: var(--red-bg); color: var(--red); }

  .criterion-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .criterion-row:last-child { border-bottom: none; }
  .criterion-row .name { font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  .criterion-row .desc { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .score-select { display: flex; gap: 6px; }
  .score-opt {
    flex: 1; text-align: center; padding: 9px 0; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; user-select: none; color: var(--text-muted);
    transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .score-opt:hover { border-color: var(--coral); }
  .score-opt.selected {
    background: linear-gradient(135deg, var(--coral), var(--gold)); color: #fff; border-color: transparent;
    transform: scale(1.08);
  }

  .section-title {
    font-size: 12px; font-weight: 800; color: #fff; margin: 26px -18px 16px; padding: 11px 18px;
    text-transform: uppercase; letter-spacing: 0.06em;
    background: linear-gradient(90deg, var(--teal), var(--teal-dark));
  }
  .section-title:first-of-type { margin-top: 4px; }

<script>
// =================================================================
// CONFIG — set this to your Apps Script Web App URL
// =================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbwbSrk4qrekr8P7p9jTA1SCGqZG-p2HK7fur4yyCvNsgzecI_hEHsbQrvOy_QhRrV82/exec";

// =================================================================
// API helpers
// =================================================================
async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, ...params }).toString();
  try {
    const res = await fetch(`${API_URL}?${qs}`);
    return await res.json();
  } catch (err) {
    console.error("apiGet failed:", action, err);
    return { error: "Gagal terhubung ke server (cek koneksi / setting deployment Apps Script)." };
  }
}

/** Wraps apiGet with automatic retries for the login flow specifically — Apps Script /
 *  Google Sheets can occasionally hiccup transiently (cold start, brief API blip), which
 *  looks like "NIK tidak ditemukan" even for a NIK that definitely exists. Instead of
 *  making the person notice and manually retry, this quietly retries a couple times first. */
async function apiGetWithRetry(action, params = {}, maxRetries = 2, shouldRetry) {
  shouldRetry = shouldRetry || ((res) => !!res.error || res.found === false);
  let lastRes = null;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    lastRes = await apiGet(action, params);
    if (!shouldRetry(lastRes)) return lastRes;
    if (attempt < maxRetries) {
      const errEl = document.getElementById("login-error");
      if (errEl) errEl.textContent = `Menghubungkan... (coba lagi ${attempt + 1}/${maxRetries})`;
      await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
    }
  }
  return lastRes;
}
async function apiPost(action, payload) {
  // NOTE: no explicit Content-Type header — keeps this a "simple request"
  // so the browser skips the CORS preflight, which Apps Script can't answer.
  const fullPayload = {
    ...payload,
    sessionToken: state.user ? state.user.sessionToken : null,
    sessionStaffId: state.user ? state.user.staffId : null,
  };
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, payload: fullPayload }) });
    const json = await res.json();
    if (json.error === "session_expired") {
      showToast("Sesi kamu udah habis, login ulang ya.", "error");
      setTimeout(() => { state.user = null; renderLogin(); }, 1500);
    }
    return json;
  } catch (err) {
    console.error("apiPost failed:", action, err);
    return { error: "Gagal terhubung ke server (cek koneksi / setting deployment Apps Script)." };
  }
}
function currentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function monthLabelID(monthKey) {
  const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  const [y, m] = String(monthKey).split("-");
  const idx = Number(m) - 1;
  return months[idx] ? `${months[idx]} ${y}` : monthKey;
}

function fullDateLabelID(dateInput) {
  const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
  if (isNaN(d.getTime())) return "-";
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function statusLabelID(status) {
  const map = { "Submitted": "Sudah Diisi", "Not started": "Belum Diisi", "Approved": "Disetujui", "Pending": "Menunggu" };
  return map[status] || status;
}

function findLabel(options, value) {
  const match = (options || []).find(o => o.value === value);
  return match ? match.label : (value || "-");
}

function friendlyError(code) {
  const map = {
    decision_required: "Decision belum dipilih.",
    one_on_one_status_required: "1-on-1 Status belum dipilih.",
    notes_required: "Catatan belum diisi.",
    outside_approval_window: "Belum waktunya approval (tanggal 28 - 4 bulan depan).",
    not_authorized: "Anda tidak punya akses untuk ini.",
    evaluator_or_target_not_found: "Data tidak ditemukan, coba refresh halaman.",
    appraisal_not_found: "Appraisal untuk staff ini belum lengkap.",
    access_denied: "Akses ditolak.",
    max_attempts_reached: "Sudah pernah diisi, tidak bisa diisi ulang.",
    session_expired: "Sesi kamu udah habis, login ulang ya.",
  };
  if (map[code]) return map[code];
  if (code && /lock/i.test(code)) return "Server lagi sibuk (banyak orang submit bersamaan) — tunggu beberapa detik lalu coba lagi.";
  return code || "Terjadi kendala tidak dikenal";
}

function showToast(message, type = "success") {
  const existing = document.getElementById("toast");
  if (existing) existing.remove();
  const el = document.createElement("div");
  el.id = "toast";
  el.className = `toast ${type}`;
  el.textContent = message;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 300);
  }, 2400);
}

  if (!nik) return;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "Menghubungkan...";
  try {
    const res = await apiGetWithRetry("checkNikExists", { nik });
    if (!res.found) {
      errEl.textContent = "NIK tidak ditemukan.";
      return;
    }
    if (!res.hasPin) {
      // No PIN set yet for this person — proceed straight through, same as before PIN existed.
      await completeLogin(nik, "");
      return;
    }
    state._pendingNik = nik;
    showPinPrompt();
  } catch (err) {
    console.error(err);
    errEl.textContent = "Gagal terhubung ke server. Cek koneksi, atau setting deployment Apps Script (Who has access = Anyone).";
  }
}

async function completeLogin(nik, pin) {
  const errEl = document.getElementById("login-error");
  if (errEl) errEl.textContent = "Menghubungkan...";
  try {
    const res = await apiGetWithRetry("login", { nik, pin }, 2, (r) => r.error !== "invalid_pin" && (!!r.error || r.found === false));
    if (!res.found) {
      if (errEl) errEl.textContent = res.error === "invalid_pin" ? "PIN salah. Coba lagi." : "NIK tidak ditemukan.";
      return;
    }
    state.user = res;
    await refreshUnreadCount();
    goToRoleMenu();
  } catch (err) {
    console.error(err);
    if (errEl) errEl.textContent = "Gagal terhubung ke server. Cek koneksi, atau setting deployment Apps Script (Who has access = Anyone).";
  }
}

// A person can have several capabilities at once (e.g. a Floor Supervisor is
// both a Staff who gets self-appraised AND a Leader who appraises their team).
// If only one screen applies, skip straight to it; otherwise show a picker.
function availableScreensGrouped(user) {
  const groups = [];

  if (["Staff", "Leader", "Management"].indexOf(user.tier) !== -1) {
    groups.push({ name: "MyAppraisal", items: [
      { key: "self", label: "Appraise Yourself" },
      { key: "history", label: "Track Your Progress" },
    ]});
  }

  const teamItems = [];
  if (user.isLeader || user.isManagement || user.isExecutive) {
    teamItems.push({ key: "myEvaluations", label: user.appraiseLabel || "Team Appraisal" });
  }
  if (user.isLeader || user.isManagement) {
    teamItems.push({ key: "review", label: "Review Your Team" });
  }
  if (user.isManagement) {
    teamItems.push({ key: "company", label: "Compare Departments" });
  }
  if (user.isExecutive) {
    teamItems.push({ key: "gm", label: "Approve Final Decisions" });
  }
  if (teamItems.length) groups.push({ name: "MyTeams", items: teamItems });

  if (user.isExecutive) {
    groups.push({ name: "MyReport", items: [
      { key: "progress", label: "Track Team Compliance" },
      { key: "company", label: "Compare Departments" },
      { key: "feedback", label: "Read Staff Feedback" },
    ]});
  }

  if (user.isHR) {
    groups.push({ name: "MyHR", items: [
      { key: "myEvaluations", label: user.appraiseLabel || "Appraise All Staff" },
      { key: "review", label: "Review Everyone's Records" },
      { key: "sc", label: "Calculate Service Charge" },
      { key: "hrTodos", label: "Track Pending Follow-Ups" },
      { key: "feedback", label: "Read Staff Feedback" },
    ]});
  }

  if (user.isAdminOperational) {
    groups.push({ name: "MyOperational", items: [
      { key: "historical", label: "Input Data Historis" },
      { key: "review", label: "Review Everyone's Records" },
      { key: "progress", label: "Track Team Compliance" },
      { key: "company", label: "Compare Departments" },
      { key: "feedback", label: "Read Staff Feedback" },
    ]});
  }

  return groups;
}

function availableScreens(user) {
  const groups = availableScreensGrouped(user);
  const flat = [];
  const seen = new Set();
  groups.forEach(g => g.items.forEach(item => {
    if (!seen.has(item.key)) { seen.add(item.key); flat.push(item); }
  }));
  return flat;
}

function goToRoleMenu() {
  const options = availableScreens(state.user);
  if (options.length === 0) {
    app.innerHTML = topbar("Akses belum diatur") + `
      <div class="card">
        <div class="hint" style="font-size:14px;">
          NIK <strong>${state.user.staffId}</strong> (${state.user.name}) berhasil login, tapi belum ada akses
          apapun yang diaktifkan. Cek Job Title untuk NIK ini di HR Sheet — pastikan ada di Config_PositionMap
          dengan Tier yang sesuai.
        </div>
        <button class="secondary" onclick="logout()" style="margin-top:12px;">Kembali ke login</button>
      </div>`;
    return;
  }
  // Always land on the hub (chart if self-eligible, plus grouped menu) — never auto-skip
  // straight into a single screen, so people can always see everything they have access to.
  state.screen = "dashboard";
  render();
}

function menuItemHtml(o) {
  const ACTION_KEYS = ["self", "myEvaluations", "gm", "sc", "hrTodos", "historical"];
  const isAction = ACTION_KEYS.indexOf(o.key) !== -1;
  const color = isAction ? "var(--coral)" : "var(--teal)";
  const tag = isAction ? "AKSI" : "LIHAT";
  const bg = isAction ? "var(--red-bg)" : "var(--green-bg)";
  return `
    <div class="staff-row" style="border-left: 4px solid ${color};" onclick="goToScreen('${o.key}')">
      <div class="name">${o.label}</div>
      <span class="badge" style="background:${bg}; color:${color};">${tag}</span>
    </div>`;
}

function renderRoleMenu() {
  const options = availableScreens(state.user);
  app.innerHTML = topbar("Pilih menu") + `
    <div class="card">
      <div class="hint">${state.user.name} punya lebih dari satu akses:</div>
      ${options.map(menuItemHtml).join("")}
    </div>`;
}

async function renderDashboard() {
  app.innerHTML = topbar("Dashboard Saya") + `<div class="loading">Memuat...</div>`;
  const hasSelfCapability = ["Staff", "Leader", "Management"].indexOf(state.user.tier) !== -1;
  const groups = availableScreensGrouped(state.user);

  let chartBlock = "";
  let selfDoneThisMonth = false;

  if (hasSelfCapability) {
    const [historyRes, statusRes] = await Promise.all([
      apiGet("getMyAppraisalHistory", { staffId: state.user.staffId }),
      apiGet("getMyAppraisalStatus", { staffId: state.user.staffId }),
    ]);
    const history = historyRes.history || [];
    selfDoneThisMonth = !!statusRes.selfDone;

    if (history.length > 1) {
      const latest = history[history.length - 1];
      chartBlock = `
        <div class="card" style="background:linear-gradient(135deg, var(--teal), var(--teal-dark)); border:none;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px;">
            <div style="color:rgba(255,255,255,0.75); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Skor Appraisal Saya</div>
            <div style="color:#fff; font-size:28px; font-weight:800;">${Number(latest.finalScore || 0).toFixed(1)}</div>
          </div>
          <div style="background:rgba(255,255,255,0.94); border-radius:12px; padding:10px 6px 2px; margin-top:10px;">
            ${buildScoreChartSvg(history)}
          </div>
        </div>`;
    } else if (history.length === 1) {
      chartBlock = `
        <div class="card" style="background:linear-gradient(135deg, var(--teal), var(--teal-dark)); border:none; text-align:center;">
          <div style="color:rgba(255,255,255,0.75); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Skor Bulan ${history[0].month}</div>
          <div style="color:#fff; font-size:36px; font-weight:800; margin-top:4px;">${Number(history[0].finalScore || 0).toFixed(1)}</div>
          <div style="color:rgba(255,255,255,0.7); font-size:12px; margin-top:6px;">Grafik akan muncul begitu ada 2 bulan data atau lebih.</div>
        </div>`;
    } else {
      chartBlock = `<div class="card"><div class="hint">Belum ada riwayat skor — grafik akan muncul begitu appraisal pertamamu selesai diproses.</div></div>`;
    }
  }

  const groupColors = {
    MyAppraisal: { accent: "var(--teal)", light: "#E4F0EF" },
    MyTeams: { accent: "var(--coral)", light: "#FFE9E3" },
    MyReport: { accent: "#B36B00", light: "#FBF0DE" },
    MyHR: { accent: "#6C4FB6", light: "#EEE8F7" },
  };

  app.innerHTML = topbar("Dashboard Saya") + chartBlock +
    groups.map((g, gi) => {
      const color = groupColors[g.name] || groupColors.MyAppraisal;
      const groupId = `group-${gi}`;
      const soleGroup = groups.length === 1;
      const itemsHtml = g.items.map(item => {
        if (item.key === "self" && selfDoneThisMonth) {
          return `
            <div class="staff-row" style="opacity:0.55; cursor:not-allowed; border-left: 4px solid var(--border);">
              <div class="name">${item.label}</div>
              <span class="badge pending">Sudah Diisi</span>
            </div>`;
        }
        return menuItemHtml(item);
      }).join("");

      if (soleGroup) {
        // Only one group total — no point hiding it behind a click, just show it plainly.
        return `
        <div class="card" style="padding:0; overflow:hidden;">
          <div style="padding:16px 18px; background:${color.light};">
            <div style="font-weight:800; color:${color.accent}; font-size:13px; text-transform:uppercase; letter-spacing:0.05em;">${g.name}</div>
          </div>
          <div style="padding:14px;">${itemsHtml}</div>
        </div>`;
      }

      return `
      <div class="card" style="padding:0; overflow:hidden;">
        <div onclick="toggleGroup('${groupId}')" style="cursor:pointer; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; background:${color.light};">
          <div style="font-weight:800; color:${color.accent}; font-size:13px; text-transform:uppercase; letter-spacing:0.05em;">${g.name}</div>
          <span id="${groupId}-chevron" style="color:${color.accent}; font-size:16px; display:inline-block; transition:transform 0.2s ease;">▾</span>
        </div>
        <div id="${groupId}" style="display:none; padding:14px;">${itemsHtml}</div>
      </div>`;
    }).join("");
}

function toggleGroup(id) {
  const el = document.getElementById(id);
  const chevron = document.getElementById(id + "-chevron");
  if (!el) return;
  const isOpen = el.style.display === "block";
  el.style.display = isOpen ? "none" : "block";
  if (chevron) chevron.style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
}

function goToScreen(key) {
  state.screen = key;
  render();
}

function logout() {
  state = { screen: "login", user: null, month: currentMonth(), targetStaff: null, kpiConfig: null, scores: {} };
  render();
}

// =================================================================
// My Evaluations — unified todo list for Leader / Management / Executive / HR.
// Each target already comes back from the backend with the correct `slot`
// (leader/hr) for THIS viewer, so the frontend doesn't need to know the
// tier rules itself.
// =================================================================
async function renderMyEvaluations() {
  app.innerHTML = topbar(state.user.appraiseLabel || "Team Appraisal") + `<div class="loading">Memuat daftar...</div>`;
  const res = await apiGet("getEvaluationTargets", { evaluatorId: state.user.staffId });
  if (res.error) {
    app.innerHTML = topbar(state.user.appraiseLabel || "Team Appraisal") + `<div class="card"><div class="error">${friendlyError(res.error)}</div></div>`;
    return;
  }
  const list = res.targets || [];
  list.sort((a, b) => {
    if (a.status === b.status) return a.name.localeCompare(b.name);
    return a.status === "Not started" ? -1 : 1;
  });
  const showMenuLink = availableScreens(state.user).length > 1;
  app.innerHTML = topbar(state.user.appraiseLabel || "Team Appraisal") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToRoleMenu()">&larr; Kembali ke menu</button>' : ""}
    <input type="text" placeholder="Cari nama..." oninput="updateMyEvalFilter('search', this.value)" style="margin-bottom:10px;" />
    <div class="row-flex" style="margin-bottom:10px;">
      <select onchange="sortMyEvalList(this.value)">
        <option value="">Urutkan...</option>
        <option value="name-asc">Nama (A-Z)</option>
        <option value="name-desc">Nama (Z-A)</option>
      </select>
      <select onchange="updateMyEvalFilter('department', this.value)">
        <option value="">Semua Department</option>
        ${[...new Set(list.map(s => s.department !== "-" ? s.department : s.tier))].sort().map(d => `<option value="${escapeAttr(d)}">${d}</option>`).join("")}
      </select>
    </div>
    <button class="secondary" id="myeval-notdone-btn" onclick="toggleMyEvalFilterBtn('notDoneOnly', 'myeval-notdone-btn')" style="margin-bottom:10px;">Belum Diisi Saja</button>
    <div class="hint">${list.length} orang — klik untuk isi appraisal</div>
    <div id="myeval-list-container">
    ${list.map(s => `
      <div class="staff-row" data-search="${escapeAttr(s.name.toLowerCase())}" data-department="${escapeAttr(s.department !== "-" ? s.department : s.tier)}" data-mystatus="${s.status}" data-name="${escapeAttr(s.name)}" onclick="openForm('${s.slot}', '${s.staffId}', '${escapeAttr(s.name)}', '${s.department}', '${s.tier}')">
        <div>
          <div class="name">${s.name} <span style="font-weight:700; font-size:11px; color:var(--coral); text-transform:uppercase;">· ${s.slot === "hr" ? "HR" : "Leader/Mgmt"}</span></div>
          <div class="dept">${s.department !== "-" ? s.department : s.tier} · ${s.tier}</div>
          <div class="dept" style="margin-top:4px; display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
            <span>${s.selfDone ? "✅" : "❌"} Self</span>
            <span style="color:var(--border);">|</span>
            <span>${s.leaderDone ? "✅" : "❌"} Leader/Mgmt</span>
            <span style="color:var(--border);">|</span>
            <span>${s.hrDone ? "✅" : "❌"} HR</span>
            <span style="color:var(--border);">|</span>
            <span>${s.executiveDone ? "✅" : "❌"} Executive</span>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="badge ${s.status === 'Submitted' ? 'done' : 'pending'}">${statusLabelID(s.status)}</span>
          ${s.slot === "hr" && s.leaderDone && s.status !== "Submitted" ? `
            <button class="secondary" style="font-size:11px; padding:6px 10px; white-space:nowrap;" onclick="event.stopPropagation(); copyLeaderToHr('${s.staffId}', '${escapeAttr(s.name)}')">Samakan dgn Leader/Mgmt</button>
          ` : ""}
        </div>
      </div>`).join("")}
    </div>
    ${!list.length ? '<div class="hint">Tidak ada yang perlu di-appraisal saat ini.</div>' : ""}
  `;
  state._myEvalFilters = { search: "", department: "", notDoneOnly: false };
}

function toggleMyEvalFilterBtn(filterKey, btnId) {
  const btn = document.getElementById(btnId);
  const isActive = btn.dataset.active === "true";
  btn.dataset.active = isActive ? "false" : "true";
  btn.style.background = isActive ? "" : "var(--coral)";
  btn.style.color = isActive ? "" : "#fff";
  btn.style.borderColor = isActive ? "" : "var(--coral)";
  updateMyEvalFilter(filterKey, !isActive);
}

function updateMyEvalFilter(key, value) {
  state._myEvalFilters = state._myEvalFilters || {};
  state._myEvalFilters[key] = value;
  const f = state._myEvalFilters;
  document.querySelectorAll("#myeval-list-container [data-search]").forEach(el => {
    let show = true;
    if (f.search && !el.dataset.search.includes(f.search.toLowerCase())) show = false;
    if (f.department && el.dataset.department !== f.department) show = false;
    if (f.notDoneOnly && el.dataset.mystatus === "Submitted") show = false;
    el.style.display = show ? "" : "none";
  });
}

function sortMyEvalList(criteria) {
  if (!criteria) return;
  const container = document.getElementById("myeval-list-container");
  if (!container) return;
  const cards = Array.from(container.children);
  cards.sort((a, b) => {
    if (criteria === "name-asc") return a.dataset.name.localeCompare(b.dataset.name);
    if (criteria === "name-desc") return b.dataset.name.localeCompare(a.dataset.name);
    return 0;
  });
  cards.forEach(c => container.appendChild(c));
}


function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

async function renderCompanySummary() {

  }
  const showMenuLink = availableScreens(state.user).length > 1;
  const statBox = (label, value, color) => `
    <div style="flex:1; min-width:120px; background:var(--sand); border-radius:12px; padding:12px; text-align:center;">
      <div style="font-size:22px; font-weight:800; color:${color || "var(--teal)"};">${value}</div>
      <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${label}</div>
    </div>`;

  app.innerHTML = topbar("Compare Departments") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToRoleMenu()">&larr; Kembali ke menu</button>' : ""}
    <div class="card">
      <label>Bulan</label>
      <input type="month" id="month-picker" value="${state.month}" onchange="changeCompanyMonth(this.value)" />
    </div>
    <div class="card">
      <div class="row-flex" style="flex-wrap:wrap; gap:8px;">
        ${statBox("Total Appraisal", res.total)}
        ${statBox("Rata-rata Skor", res.avgScore.toFixed(1))}
        ${statBox("Performer", res.performerCount, "var(--green)")}
        ${statBox("Underperform", res.underperformCount, "var(--red)")}
        ${statBox("Sudah Di-approve", `${res.approvedCount}/${res.total}`, "var(--gold)")}
      </div>
    </div>
    <div class="card">
      <h2>Rata-rata Skor per Department/Tier</h2>
      ${res.departmentBreakdown.map(d => `
        <div class="staff-row" style="cursor:default; display:block;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="name">${d.department} <span style="font-weight:400; color:var(--text-muted);">(${d.count} orang)</span></div>
            <span class="badge ${d.avgScore >= 60 ? "performer" : "underperform"}">${d.avgScore.toFixed(1)}</span>
          </div>
          ${d.underperformCount > 0 ? `<div class="dept" style="margin-top:4px; color:var(--red);">${d.underperformCount} underperform</div>` : ""}
        </div>`).join("")}
      ${!res.departmentBreakdown.length ? '<div class="hint">Belum ada data untuk bulan ini.</div>' : ""}
    </div>`;
}

function changeCompanyMonth(value) {
  if (!value) return;
  state.month = value;
  renderCompanySummary();
}

async function renderHistoricalInput() {
  app.innerHTML = topbar("Input Data Historis") + `<div class="loading">Memuat data...</div>`;
  if (!state._historicalMonth) state._historicalMonth = "2026-06"; // default starting point: June
  await loadHistoricalStaffList(state._historicalMonth);
}

async function loadHistoricalStaffList(month) {
  state._historicalMonth = month;
  const res = await apiGet("getHistoricalCompletionStatus", { month });
  const staffList = res.staff || [];
  const doneCount = staffList.filter(s => s.hasData).length;
  const showMenuLink = availableScreens(state.user).length > 1;

  app.innerHTML = topbar("Input Data Historis") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToRoleMenu()">&larr; Kembali ke menu</button>' : ""}
    <div class="card">
      <div class="hint" style="margin-bottom:8px;">Buat data appraisal SEBELUM sistem ini ada — cuma skor Leader yang tersedia (Self & HR appraisal tidak ada untuk periode ini). Dipakai murni sebagai bahan tracking performa historis, bukan untuk perhitungan Service Charge.</div>
      <label>Bulan historis</label>
      <input type="month" id="historical-month-picker" value="${month}" onchange="loadHistoricalStaffList(this.value)" />
    </div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
        <h2 style="margin:0;">Progress ${monthLabelID(month)}</h2>
        <div class="hint" style="font-weight:700; color:${doneCount === staffList.length ? "var(--green)" : "var(--coral)"};">${doneCount} dari ${staffList.length} sudah diisi</div>
      </div>
      <label>Cari nama staff</label>
      <input type="text" id="historical-search" placeholder="Ketik nama..." oninput="filterHistoricalStaffList(this.value)" />
      <div id="historical-staff-list" style="max-height:340px; overflow-y:auto; margin-top:8px;">
        ${staffList.map(s => `
          <div class="staff-row" data-search="${escapeAttr(s.name.toLowerCase())}" onclick="selectHistoricalStaff('${s.staffId}', '${escapeAttr(s.name)}')">
            <div class="name">${s.name} <span style="font-weight:400; color:var(--text-muted);">(${s.department})</span></div>
            <span class="badge ${s.hasData ? "done" : "pending"}">${s.hasData ? "✅ Sudah Diisi" : "⭕ Belum Diisi"}</span>
          </div>`).join("")}
      </div>
    </div>
    <div id="historical-form-container"></div>
  `;
}

function filterHistoricalStaffList(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll("#historical-staff-list [data-search]").forEach(el => {

    el.style.display = el.dataset.search.includes(q) ? "" : "none";
  });
}

async function selectHistoricalStaff(staffId, name) {
  state._historicalStaffId = staffId;
  state._historicalStaffName = name;
  const container = document.getElementById("historical-form-container");
  container.innerHTML = `<div class="card"><h2>${name} — ${monthLabelID(state._historicalMonth)}</h2><div id="historical-existing-note" class="hint"></div></div><div id="historical-detail-form"></div>`;
  await loadHistoricalForm();
}

async function loadHistoricalForm() {
  const month = state._historicalMonth;
  if (!month || !state._historicalStaffId) return;

  const detailContainer = document.getElementById("historical-detail-form");
  detailContainer.innerHTML = `<div class="loading">Memuat kriteria...</div>`;

  const [existing, cfg] = await Promise.all([
    apiGet("getHistoricalAppraisal", { staffId: state._historicalStaffId, month }),
    apiGet("getKpiConfigForTarget", { targetStaffId: state._historicalStaffId }),
  ]);
  state._historicalCfg = cfg;

  const noteEl = document.getElementById("historical-existing-note");
  noteEl.textContent = !existing.found ? "" : (existing.selfTotal || existing.hrTotal)
    ? "⚠️ Bulan ini sudah punya data Self/HR (siklus normal) — hati-hati kalau ditimpa."
    : `Sudah ada data historis bulan ini (Final Score: ${Number(existing.finalScore).toFixed(1)}) — isi ulang semua kriteria di bawah untuk menimpanya, kriteria detail sebelumnya tidak tersimpan per-item.`;

  const scoreRow = (label, desc, id) => `
    <div class="criterion-row">
      <div class="name">${label}</div>
      ${desc ? `<div class="desc">${desc}</div>` : ""}
      <div class="score-select" data-crit-id="${id}">
        ${[1,2,3,4,5].map(n => `<div class="score-opt" onclick="pickHistoricalScore(this, '${id}', ${n})">${n}</div>`).join("")}
      </div>
    </div>`;

  detailContainer.innerHTML = `
    <div class="card">
      <div class="section-title">Section A — Attitude</div>
      ${cfg.attitude.map((c, i) => scoreRow(c.name, c.description, "A" + i)).join("")}
      <div class="section-title">Section B — Discipline</div>
      ${cfg.discipline.map((c, i) => scoreRow(c.name, `${c.dataSource} — Target: ${c.target}`, "B" + i)).join("")}
      ${cfg.placeholder ? `<div class="hint">${cfg.placeholderNote}</div>` : `
        <div class="section-title">Section C — Performance KPI</div>
        ${cfg.kpi.map((c, i) => scoreRow(c.name, `${c.howToMeasure} — Target: ${c.target}`, "C" + i)).join("")}
      `}

async function saveHistoricalAppraisal() {
  const month = state._historicalMonth;
  if (!month) { showToast("Pilih bulan dulu.", "error"); return; }
  const cfg = state._historicalCfg;

  const collectScores = (list, prefix) => {
    const scores = {};
    for (let i = 0; i < list.length; i++) {
      const row = document.querySelector(`.score-select[data-crit-id="${prefix}${i}"]`);
      if (!row || !row.dataset.value) return null;
      scores[list[i].name] = Number(row.dataset.value);
    }
    return scores;
  };

  const attitudeScores = collectScores(cfg.attitude, "A");
  if (!attitudeScores) { showToast("Isi semua kriteria Section A dulu.", "error"); return; }
  const disciplineScores = collectScores(cfg.discipline, "B");
  if (!disciplineScores) { showToast("Isi semua kriteria Section B dulu.", "error"); return; }
  let kpiScores = {};
  if (!cfg.placeholder) {
    kpiScores = collectScores(cfg.kpi, "C");
    if (!kpiScores) { showToast("Isi semua kriteria Section C dulu.", "error"); return; }
  }
  const bonusEntries = cfg.bonus.map((b, i) => ({
    item: b.item, count: Number(document.getElementById(`historical-bonus-${i}`).value || 0),
  })).filter(e => e.count > 0);

  const res = await apiPost("submitHistoricalAppraisal", {
    enteredById: state.user.staffId, staffId: state._historicalStaffId, month,
    attitudeScores, disciplineScores, kpiScores, bonusEntries,
  });
  if (res.error || res.success === false) { showToast("Gagal simpan: " + friendlyError(res.error), "error"); return; }
  showToast(`Data historis ${state._historicalStaffName} bulan ${monthLabelID(month)} tersimpan! Final Score: ${res.finalScore.toFixed(1)}`);
  loadHistoricalStaffList(month); // refresh list so the ✅ indicator updates immediately
}

function toggleReviewFilterBtn(filterKey, btnId) {
  const btn = document.getElementById(btnId);
  const isActive = btn.dataset.active === "true";
  btn.dataset.active = isActive ? "false" : "true";
  btn.style.background = isActive ? "" : "var(--coral)";
  btn.style.color = isActive ? "" : "#fff";
  btn.style.borderColor = isActive ? "" : "var(--coral)";
  updateReviewFilter(filterKey, !isActive);
}

function updateReviewFilter(key, value) {
  state._reviewFilters = state._reviewFilters || {};
  state._reviewFilters[key] = value;
  const f = state._reviewFilters;
  document.querySelectorAll("#review-list-container [data-search]").forEach(el => {
    let show = true;
    if (f.search && !el.dataset.search.includes(f.search.toLowerCase())) show = false;
    if (f.department && el.dataset.department !== f.department) show = false;
    if (f.underperformOnly && el.dataset.status !== "Underperform") show = false;
    el.style.display = show ? "" : "none";
  });
}

function sortReviewList(criteria) {
  if (!criteria) return;
  const container = document.getElementById("review-list-container");
  if (!container) return;
  const cards = Array.from(container.children);
  cards.sort((a, b) => {
    if (criteria === "name-asc") return a.dataset.name.localeCompare(b.dataset.name);
    if (criteria === "name-desc") return b.dataset.name.localeCompare(a.dataset.name);
    if (criteria === "score-desc") return Number(b.dataset.score) - Number(a.dataset.score);
    if (criteria === "score-asc") return Number(a.dataset.score) - Number(b.dataset.score);
    return 0;
  });
  cards.forEach(c => container.appendChild(c));

}

function monthShortLabelID(monthKey) {
  const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
  const idx = Number(String(monthKey).split("-")[1]) - 1;
  return months[idx] || monthKey;
}

function buildScoreChartSvg(history) {
  const width = 600, height = 220, padTop = 24, padBottom = 30, padSide = 30;
  const innerH = height - padTop - padBottom;
  const stepX = history.length > 1 ? (width - padSide * 2) / (history.length - 1) : 0;

  // Dynamic Y-axis — zooms into the actual score range instead of always showing the full
  // 0-100 scale, so small-but-real differences (e.g. 60 -> 69) don't look flat and invisible.
  // Threshold 60 is always included in the range so the dashed line stays meaningful.
  const scores = history.map(h => Number(h.finalScore) || 0);
  const allValues = scores.concat([60]);
  const rawMin = Math.min.apply(null, allValues);
  const rawMax = Math.max.apply(null, allValues);
  const span = Math.max(rawMax - rawMin, 10); // avoid a degenerate near-zero range
  const padding = span * 0.2;
  const yMin = Math.max(0, rawMin - padding);
  const yMax = Math.min(100, rawMax + padding);
  const yRange = (yMax - yMin) || 1;

  const yFor = (score) => padTop + innerH - ((Math.max(0, Math.min(100, Number(score) || 0)) - yMin) / yRange) * innerH;
  const points = history.map((h, i) => ({ x: padSide + i * stepX, y: yFor(h.finalScore), month: h.month, score: Number(h.finalScore || 0) }));
  const pathD = points.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const thresholdY = yFor(60);

  return `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">
      <text x="${padSide - 6}" y="${padTop + 4}" text-anchor="end" font-size="9" fill="#6B5D4F">${yMax.toFixed(0)}</text>
      <text x="${padSide - 6}" y="${padTop + innerH}" text-anchor="end" font-size="9" fill="#6B5D4F">${yMin.toFixed(0)}</text>
      <line x1="${padSide}" y1="${thresholdY.toFixed(1)}" x2="${width - padSide}" y2="${thresholdY.toFixed(1)}" stroke="#946017" stroke-dasharray="4 4" stroke-width="1.2" />
      <text x="${width - padSide}" y="${(thresholdY - 6).toFixed(1)}" text-anchor="end" font-size="10" fill="#946017">Threshold 60</text>
      <path d="${pathD}" fill="none" stroke="#0E4749" stroke-width="2.5" />
      ${points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="${p.score >= 60 ? "#1A6B49" : "#B8352B"}" />`).join("")}
      ${points.map(p => `<text x="${p.x.toFixed(1)}" y="${(p.y - 12).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#20302F">${p.score.toFixed(1)}</text>`).join("")}
      ${points.map(p => `<text x="${p.x.toFixed(1)}" y="${height - 8}" text-anchor="middle" font-size="10" fill="#6B5D4F">${monthShortLabelID(p.month)}</text>`).join("")}
    </svg>`;
}

async function renderAppraisalForm({ evaluatorType, target }) {
  state.targetStaff = target; // always keep this in sync so submitForm can read it reliably
  const subtitle = `${target.department && target.department !== "-" ? target.department : ""}${target.tier ? (target.department && target.department !== "-" ? " · " : "") + target.tier + " tier" : ""}`;
  app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div><div class="loading">Memeriksa akses...</div>`;

  const access = await apiGet("checkAccess", { staffId: target.staffId, evaluatorType });
  if (access.error) {
    app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div>
      <div class="card"><div class="error">${friendlyError(access.error)}</div>
      <button class="secondary" onclick="goBack()">Kembali</button></div>`;
    return;
  }
  if (!access.allowed) {
    if (evaluatorType === "self" && access.reason === "max_attempts_reached") {
      renderMyAppraisalStatus(target);
      return;
    }
    if (evaluatorType === "self" && access.reason === "too_late") {
      // "too_late" alone is ambiguous — could mean "already submitted, now just waiting
      // on others" OR "never submitted at all, window quietly closed". Check which one
      // this actually is before deciding what to tell them.
      const statusCheck = await apiGet("getMyAppraisalStatus", { staffId: target.staffId });
      if (statusCheck.found && statusCheck.selfDone) {
        renderMyAppraisalStatus(target);
      } else {
        app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div>
          <div class="card">
            <div class="hint" style="font-size:14px;">Waktu buat Appraise Yourself bulan ini sudah lewat, dan kamu belum sempat mengisinya. Bagian Self kamu akan dihitung 0 untuk bulan ini. Hubungi HR kalau ada alasan khusus.</div>
            <button class="secondary" onclick="goBack()" style="margin-top:12px;">Kembali</button>
          </div>`;
      }
      return;
    }
    let msg;
    if (access.reason === "too_early") {
      msg = `Belum waktunya. Coba lagi mulai <strong>${access.retryDateLabel}</strong>.`;
    } else if (access.reason === "too_late") {
      msg = "Waktu untuk mengisi appraisal ini sudah lewat.";
    } else if (access.reason === "max_attempts_reached") {
      msg = `Appraisal ini sudah diisi ${access.submissionCount}× (maksimal ${access.submissionCount}×). Tidak bisa diisi ulang lagi. Hubungi HR kalau butuh koreksi.`;
    } else if (access.reason === "deferred_to_previous_cycle") {
      msg = "Kontrak staff ini berakhir terlalu awal bulan ini untuk siklus appraisal baru — keputusan appraisal bulan lalu yang berlaku untuk periode ini.";
    } else {
      msg = "Data kontrak untuk staff ini tidak ditemukan. Hubungi HR.";
    }
    app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div>
      <div class="card">
        <div class="hint" style="font-size:14px;">${msg}</div>
        <button class="secondary" onclick="goBack()" style="margin-top:12px;">Kembali</button>
      </div>`;
    return;
  }

  app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div><div class="loading">Memuat form...</div>`;
  const cfg = await apiGet("getKpiConfigForTarget", { targetStaffId: target.staffId });
  if (cfg.error) {
    app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div>
      <div class="card"><div class="error">${friendlyError(cfg.error)}</div>
      <button class="secondary" onclick="goBack()">Kembali</button></div>`;
    return;
  }
  state.kpiConfig = cfg;
  if (!state._preserveScores) state.scores = {};
  state._preserveScores = false;

  // For anyone evaluating someone ELSE (not self), pull that person's own Self
  // scores as reference context, if they've already submitted it.
  state.selfReference = null;
  state.leaderReference = null;
  if (evaluatorType !== "self") {
    const selfRes = await apiGet("getSelfScoresForTarget", { staffId: target.staffId });
    if (selfRes.found) state.selfReference = selfRes.scores;
  }
  // HR appraises LAST (day 18-27) — by then Self AND Leader/Mgmt should both already be
  // submitted, so HR gets both as reference instead of just Self.
  if (evaluatorType === "hr") {
    const leaderRes = await apiGet("getLeaderScoresForTarget", { staffId: target.staffId });
    if (leaderRes.found) state.leaderReference = leaderRes.scores;
  }

  renderFormBody(evaluatorType, target, cfg);
}

function renderFormBody(evaluatorType, target, cfg) {
  state._totalCriteria = cfg.attitude.length + cfg.discipline.length + (cfg.placeholder ? 0 : cfg.kpi.length);

  const scoreRow = (criterion, desc) => `
    <div class="criterion-row" data-criterion="${escapeAttr(criterion)}">
      <div class="name">${criterion}${state.selfReference && state.selfReference[criterion] !== undefined ? ` <span style="font-weight:600; font-size:11px; color:var(--coral);">· Self: ${state.selfReference[criterion]}</span>` : ""}${state.leaderReference && state.leaderReference[criterion] !== undefined ? ` <span style="font-weight:600; font-size:11px; color:var(--teal);">· Leader/Mgmt: ${state.leaderReference[criterion]}</span>` : ""}</div>
      ${desc ? `<div class="desc">${desc}</div>` : ""}
      <div class="score-select">
        ${[1,2,3,4,5].map(v => `<div class="score-opt" onclick="selectScore(this, '${escapeAttr(criterion)}', ${v})">${v}</div>`).join("")}
      </div>
    </div>`;

  const bonusRow = (item, points, idx, inputType) => `
    <div class="criterion-row">
      <div class="name">${item} <span style="font-weight:600; color:${points > 0 ? "var(--green)" : "var(--red)"};">${points > 0 ? "+" : ""}${points} pts</span></div>
      <div class="row-flex" style="align-items:center;">
        ${inputType === "checkbox"
          ? `<label style="display:flex; align-items:center; gap:8px; flex:0 0 80px; margin-bottom:0; cursor:pointer;">
               <input type="checkbox" class="bonus-count" data-idx="${idx}" style="width:20px; height:20px; margin:0;" />
               <span style="font-size:13px; color:var(--text-muted);">Terjadi</span>
             </label>`
          : `<input type="number" min="0" class="bonus-count" data-idx="${idx}" value="0" style="margin-bottom:0; flex:0 0 80px;" />`}
        <input type="text" class="bonus-notes" data-idx="${idx}" placeholder="Evidence / notes (opsional)" style="margin-bottom:0;" />
      </div>
    </div>`;

  const isSelf = evaluatorType === "self";

  app.innerHTML = topbar("Appraisal — " + target.name) + `
    <div class="card">
      <div class="mode-banner mode-${evaluatorType}">
        <span class="mode-label">${evaluatorType === "self" ? "Appraise Yourself" : evaluatorType === "hr" ? "HR Appraisal" : "Leader / Management Appraisal"}</span>
        <span class="mode-meta">${target.department !== "-" ? target.department : target.tier} · ${state.month}</span>
      </div>

      <div class="hint" style="background:var(--sand); padding:9px 12px; border-radius:10px; margin-bottom:8px;">
        Skor: <strong>1</strong> Sangat Kurang · <strong>2</strong> Kurang · <strong>3</strong> Cukup · <strong>4</strong> Baik · <strong>5</strong> Sangat Baik
      </div>
      ${evaluatorType !== "self" ? (state.selfReference
        ? `<div class="hint" style="background:var(--green-bg); color:var(--green); padding:9px 12px; border-radius:10px; margin-bottom:8px; font-weight:600;">✅ ${target.name} sudah Appraise Yourself — skornya ditampilkan sebagai referensi di tiap kriteria (label "Self: X").${state.leaderReference ? ` Skor Leader/Mgmt juga ditampilkan (label "Leader/Mgmt: X").` : ""}</div>`
        : `<div class="hint" style="background:var(--amber-bg); color:var(--amber); padding:9px 12px; border-radius:10px; margin-bottom:8px; font-weight:600;">⚠️ ${target.name} belum Appraise Yourself — kamu menilai tanpa referensi dari dia.</div>`
      ) : ""}
      <div class="hint" id="progress-counter" style="text-align:right; font-weight:700; color:var(--teal); margin-bottom:14px;"></div>

      <div class="section-title">Section A — Attitude</div>
      ${cfg.attitude.map(c => scoreRow(c.name, c.description)).join("")}

      <div class="section-title">Section B — Discipline</div>
      ${cfg.discipline.map(c => scoreRow(c.name, `Target: ${c.target}`)).join("")}

      <div class="section-title">Section C — Performance KPI</div>
      ${cfg.placeholder
        ? `<div class="hint" style="background:var(--sand); padding:12px; border-radius:8px;">${cfg.placeholderNote}</div>`
        : cfg.kpi.map(c => scoreRow(c.name, `Target: ${c.target}`)).join("")}

      ${isSelf ? "" : `
        <div class="section-title">Section D — Bonus &amp; Deduction</div>
        <div class="hint">Isi jumlah kejadian bulan ini. Biarkan 0 kalau tidak ada.</div>
        ${cfg.bonus.map((b, i) => bonusRow(b.item, b.points, i, b.inputType)).join("")}
      `}

      ${isSelf ? `
        <div class="section-title">Feedback to Management</div>
        <div class="hint" style="background:var(--sand); padding:10px 12px; border-radius:10px; margin-bottom:10px; font-style:italic;">
          🔒 Kotak ini dibaca terbatas oleh level manajemen & HR yang berwenang — gak akan bocor ke Leader/Manager langsungmu. Ngomong aja apa yang perlu disampaikan.
        </div>
        <textarea id="management-feedback" rows="4" placeholder="Opsional — tulis kalau ada yang mau disampaikan ke Executive secara langsung..." style="width:100%; padding:10px; border:1.5px solid var(--border); border-radius:10px; font-family:inherit; font-size:14px;"></textarea>
      ` : ""}

      <div class="error" id="form-error"></div>
      <button class="primary" onclick="reviewBeforeSubmit('${evaluatorType}')" style="margin-top: 14px;">Submit Appraisal</button>
      <div class="center" style="margin-top: 10px;">
        <button class="ghost" onclick="cancelForm()">Batal</button>
      </div>
    </div>`;

  // Re-apply previously selected pills + bonus values (used when returning from the review screen).
  Object.keys(state.scores).forEach(criterion => {
    const row = app.querySelector(`.criterion-row[data-criterion="${CSS.escape(criterion)}"]`);
    if (!row) return;
    const val = state.scores[criterion];
    row.querySelectorAll(".score-opt").forEach(opt => {
      if (Number(opt.textContent) === val) opt.classList.add("selected");
    });
  });
  if (state._pendingBonusEntries) {
    state._pendingBonusEntries.forEach((b, i) => {
      const idx = cfg.bonus.findIndex(bc => bc.item === b.item);
      if (idx === -1) return;
      const countEl = document.querySelector(`.bonus-count[data-idx="${idx}"]`);
      const notesEl = document.querySelector(`.bonus-notes[data-idx="${idx}"]`);
      if (countEl) {
        if (countEl.type === "checkbox") countEl.checked = b.count > 0;
        else countEl.value = b.count;
      }
      if (notesEl) notesEl.value = b.notes || "";
    });
  }
  if (state._pendingFeedback) {
    const feedbackEl = document.getElementById("management-feedback");
    if (feedbackEl) feedbackEl.value = state._pendingFeedback;
  }
  updateProgressCounter();
}

function updateProgressCounter() {
  const el = document.getElementById("progress-counter");
  if (el) el.textContent = `${Object.keys(state.scores).length} dari ${state._totalCriteria} kriteria terisi`;
}

function selectScore(el, criterion, value) {
  const row = el.closest(".criterion-row");
  row.querySelectorAll(".score-opt").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  state.scores[criterion] = value;
  updateProgressCounter();
}

  app.innerHTML = topbar("Selesai") + `
    <div class="card" style="text-align:center;">
      <div style="font-size:40px; margin-bottom:8px;">✅</div>
      <h2>Appraisal tersimpan!</h2>
      <div class="hint" style="font-size:14px;">Jawaban Anda sudah tercatat dan akan diproses ke tahap berikutnya secara otomatis. Anda akan dapat notifikasi (🔔) kalau ada keputusan appraisal yang keluar. Tidak ada lagi yang perlu diisi bulan ini — terima kasih!</div>
      <button class="secondary" onclick="logout()" style="margin-top:16px;">Keluar</button>
    </div>`;
}

function goBack() {
  // Reuse the exact same routing logic as right after login — it already handles
  // 0 / 1 / multi available screens correctly for every role combination.
  goToRoleMenu();
}

function cancelForm() {
  if (Object.keys(state.scores).length > 0) {
    const ok = confirm("Jawaban yang sudah diisi akan hilang kalau keluar sekarang. Yakin mau keluar?");
    if (!ok) return;
  }
  state.scores = {};
  state._pendingBonusEntries = null;
  state._pendingFeedback = null;
  goBack();
}

function reviewBeforeSubmit(evaluatorType) {
  const cfg = state.kpiConfig;
  const kpiCriteria = cfg.placeholder ? [] : cfg.kpi.map(c => c.name);
  const allCriteria = [...cfg.attitude.map(c => c.name), ...cfg.discipline.map(c => c.name), ...kpiCriteria];
  const missing = allCriteria.filter(c => !(c in state.scores));
  if (missing.length) {
    document.getElementById("form-error").textContent = `Masih ada ${missing.length} kriteria yang belum diisi.`;
    return;
  }

  if (evaluatorType === "self") {
    const feedbackEl = document.getElementById("management-feedback");
    state._pendingFeedback = feedbackEl ? feedbackEl.value : "";
  }

  const bonusEntries = [];
  if (evaluatorType !== "self") {
    cfg.bonus.forEach((b, i) => {
      const countInput = document.querySelector(`.bonus-count[data-idx="${i}"]`);
      let count = 0;
      if (countInput) {
        count = countInput.type === "checkbox" ? (countInput.checked ? 1 : 0) : (Number(countInput.value) || 0);
      }
      if (count > 0) {
        const notesInput = document.querySelector(`.bonus-notes[data-idx="${i}"]`);
        bonusEntries.push({ item: b.item, count, notes: notesInput ? notesInput.value : "" });
      }
    });
  }
  state._pendingBonusEntries = bonusEntries;

  const target = state.targetStaff;
  const sectionTable = (rows) => `<table class="mini">${rows.map(r => `<tr><td>${r.label}</td><td>${r.score}</td></tr>`).join("")}</table>`;

  app.innerHTML = topbar("Cek Jawaban — " + target.name) + `
    <div class="card">
      <div class="hint" style="font-size:14px; margin-bottom:14px;">Cek lagi jawaban di bawah sebelum kirim final. Appraisal ini <strong>cuma bisa dikirim 1 kali</strong> dan tidak bisa diubah lagi setelah terkirim.</div>

      <div class="section-title" style="margin-top:8px;">Section A — Attitude</div>
      ${sectionTable(cfg.attitude.map(c => ({ label: c.name, score: state.scores[c.name] })))}

      <div class="section-title">Section B — Discipline</div>
      ${sectionTable(cfg.discipline.map(c => ({ label: c.name, score: state.scores[c.name] })))}

      <div class="section-title">Section C — Performance KPI</div>
      ${cfg.placeholder
        ? `<div class="hint" style="background:var(--sand); padding:12px; border-radius:8px;">${cfg.placeholderNote}</div>`
        : sectionTable(kpiCriteria.map(c => ({ label: c, score: state.scores[c] })))}

      ${bonusEntries.length ? `
        <div class="section-title">Section D — Bonus &amp; Deduction</div>
        <table class="mini">${bonusEntries.map(b => `<tr><td>${b.item}</td><td>${b.count}×</td></tr>`).join("")}</table>
      ` : ""}

      <div class="row-flex" style="margin-top:16px;">
        <button class="secondary" onclick="backToEditForm('${evaluatorType}')">&larr; Kembali, Cek Lagi</button>
        <button class="primary" onclick="confirmAndSubmit('${evaluatorType}')">Ya, Kirim Sekarang</button>
      </div>
    </div>`;
}

function backToEditForm(evaluatorType) {
  state._preserveScores = true;
  renderFormBody(evaluatorType, state.targetStaff, state.kpiConfig);
}

async function confirmAndSubmit(evaluatorType) {
  try {
    const cfg = state.kpiConfig;
    const kpiCriteria = cfg.placeholder ? [] : cfg.kpi.map(c => c.name);
    const target = state.targetStaff;
    if (!target || !target.staffId) {
      showToast("Error internal: target appraisal tidak ditemukan. Coba kembali dan buka ulang form ini.", "error");
      return;
    }
    const payload = {
      staffId: target.staffId,
      evaluatorId: state.user.staffId,
      slot: evaluatorType,
      attitudeScores: cfg.attitude.map(c => ({ criterion: c.name, score: state.scores[c.name] })),
      disciplineScores: cfg.discipline.map(c => ({ criterion: c.name, score: state.scores[c.name] })),
      kpiScores: kpiCriteria.map(c => ({ criterion: c, score: state.scores[c] })),
      bonusEntries: state._pendingBonusEntries || [],
    };
    showToast("Menyimpan...");
    const res = await apiPost("submitAppraisal", payload);
    if (res.computeError) {
      console.error("computeEvaluatorTotal error:", res.computeError);
      showToast("Gagal hitung skor: " + res.computeError.slice(0, 150) + " — silakan coba submit lagi (kuota submit belum kepakai).", "error");
      return;
    }
    if (res.success) {
      showToast(res.wasResubmission ? "Tersimpan! (menimpa submission sebelumnya)" : "Appraisal tersimpan!");
      state.scores = {};
      state._pendingBonusEntries = null;
      if (evaluatorType === "self") {
        if (state._pendingFeedback && state._pendingFeedback.trim()) {
          await apiPost("submitManagementFeedback", { staffId: target.staffId, feedback: state._pendingFeedback.trim() });
        }
        state._pendingFeedback = null;
      }
      if (evaluatorType !== "self") {
        // Came from "Tugas Appraisal Saya" — land back there directly so the person
        // can keep appraising the next staff quickly, instead of bouncing to the menu.
        renderMyEvaluations();
      } else {
        const options = availableScreens(state.user);
        if (options.length <= 1) {
          renderDoneScreen();
        } else {
          goBack();
        }
      }
    } else {
      showToast("Gagal menyimpan: " + friendlyError(res.error || res.reason), "error");
    }
  } catch (err) {
    console.error("confirmAndSubmit crashed:", err);
    showToast("Terjadi error tak terduga: " + err.message, "error");
  }
}

async function loadStaffPhotos(staffIds) {
  if (!staffIds.length) return;
  const res = await apiGet("getStaffPhotosBatch", { staffIds: staffIds.join(",") });
  const photos = res.photos || {};
  staffIds.forEach(id => {
    const r = photos[id];
    if (!r || !r.found) return;
    const img = document.getElementById(`photo-${id}`);
    if (!img) return;
    img.src = r.dataUri || r.url;
    img.style.display = "block";
    const fallback = document.getElementById(`photo-fallback-${id}`);
    if (fallback) fallback.style.display = "none";
  });
}

function toggleGmFilterBtn(filterKey, btnId) {
  const btn = document.getElementById(btnId);
  const isActive = btn.dataset.active === "true";
  btn.dataset.active = isActive ? "false" : "true";
  btn.style.background = isActive ? "" : "var(--coral)";
  btn.style.color = isActive ? "" : "#fff";
  btn.style.borderColor = isActive ? "" : "var(--coral)";
  updateGmFilter(filterKey, !isActive);
}

function updateGmFilter(key, value) {
  state._gmFilters = state._gmFilters || {};
  state._gmFilters[key] = value;
  const f = state._gmFilters;
  document.querySelectorAll("#gm-list-container [data-search]").forEach(el => {
    let show = true;
    if (f.search && !el.dataset.search.includes(f.search.toLowerCase())) show = false;
    if (f.department && el.dataset.department !== f.department) show = false;
    if (f.underperformOnly && el.dataset.status !== "Underperform") show = false;
    if (f.notApprovedOnly && el.dataset.approved !== "false") show = false;
    el.style.display = show ? "" : "none";
  });
}

function sortGmList(criteria) {
  if (!criteria) return;
  const container = document.getElementById("gm-list-container");
  if (!container) return;
  const cards = Array.from(container.children);
  cards.sort((a, b) => {
    if (criteria === "name-asc") return a.dataset.name.localeCompare(b.dataset.name);
    if (criteria === "name-desc") return b.dataset.name.localeCompare(a.dataset.name);
    if (criteria === "score-desc") return Number(b.dataset.score) - Number(a.dataset.score);
    if (criteria === "score-asc") return Number(a.dataset.score) - Number(b.dataset.score);
    return 0;
  });
  cards.forEach(c => container.appendChild(c));
}

async function showComparisonModal(staffId, name) {
  // Show an instant loading placeholder — the fetch below can take a moment, and without
  // this the click feels unresponsive (nothing visibly happens until data arrives).
  const loadingOverlay = document.createElement("div");
  loadingOverlay.id = "comparison-modal";
  loadingOverlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px;";
  loadingOverlay.onclick = (e) => { if (e.target === loadingOverlay) loadingOverlay.remove(); };
  loadingOverlay.innerHTML = `<div class="card" style="background:#fff; padding:24px 32px;">Memuat...</div>`;
  document.body.appendChild(loadingOverlay);

  const s = (state._currentGmList || []).find(x => String(x.staffId) === String(staffId)) || {};
  const [res, critRes] = await Promise.all([
    apiGet("getMyAppraisalHistory", { staffId }),
    apiGet("getCriterionHistoryComparison", { staffId, evaluatorType: "leader" }),
  ]);
  const history = res.history || [];
  const existing = document.getElementById("comparison-modal");
  if (existing) existing.remove();

  const last3 = history.slice(-3);
  let trendBlock;
  if (last3.length >= 2) {
    trendBlock = `<div class="row-flex" style="margin-bottom:6px;">
      ${last3.map((m, i) => `
        <div style="flex:1; text-align:center;">
          <div class="hint">${monthLabelID(m.month)}</div>
          <div style="font-size:${last3.length === 3 ? 22 : 26}px; font-weight:800; color:${i === 0 ? "var(--text)" : (Number(m.finalScore) >= Number(last3[i-1].finalScore) ? "var(--green)" : "var(--red)")};">${Number(m.finalScore).toFixed(1)}</div>
        </div>`).join("")}
    </div>`;
    const prev = last3[last3.length - 2], curr = last3[last3.length - 1];
    const diff = Number(curr.finalScore) - Number(prev.finalScore);
    const pct = Number(prev.finalScore) !== 0 ? (diff / Number(prev.finalScore) * 100) : 0;
    trendBlock += `<div class="hint" style="text-align:center; margin-bottom:12px; font-weight:700; color:${diff >= 0 ? "var(--green)" : "var(--red)"};">${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff).toFixed(1)} poin (${Math.abs(pct).toFixed(1)}%) dari bulan lalu</div>`;
  } else if (last3.length === 1) {
    trendBlock = `<div class="hint" style="text-align:center; margin-bottom:12px;">Skor bulan ${monthLabelID(last3[0].month)}: <strong style="font-size:20px;">${Number(last3[0].finalScore).toFixed(1)}</strong><br/>Belum ada data bulan sebelumnya buat dibandingin.</div>`;
  } else {
    trendBlock = `<div class="hint" style="text-align:center; margin-bottom:12px;">Belum ada riwayat appraisal yang di-approve.</div>`;
  }
  if (history.length > 1) trendBlock += buildScoreChartSvg(history);

  // Per-criterion comparison — highlights whether a specific weak spot (e.g. Communication)
  // is still a problem this month vs last month, not just the blended Section totals.
  let criterionBlock = "";
  if (critRes.found && critRes.rows.length) {
    const stillWeak = critRes.rows.filter(r => r.current !== null && r.current <= 3);
    criterionBlock = `
      <div class="section-title" style="margin:16px -18px 8px;">Detail per Kriteria (Leader/Mgmt)</div>
      <table class="mini">
        <tr><th>Kriteria</th><th>${monthLabelID(critRes.prevMonth)}</th><th>${monthLabelID(critRes.currentMonth)}</th></tr>
        ${critRes.rows.map(r => {
          const isStillWeak = r.current !== null && r.current <= 3;
          const improved = r.previous !== null && r.current !== null && r.current > r.previous;
          const worsened = r.previous !== null && r.current !== null && r.current < r.previous;
          return `<tr style="${isStillWeak ? "background:var(--red-bg);" : ""}">
            <td>${r.criterion}</td>
            <td>${r.previous !== null ? r.previous : "-"}</td>
            <td style="font-weight:700; color:${improved ? "var(--green)" : worsened ? "var(--red)" : "var(--text)"};">${r.current !== null ? r.current : "-"}${improved ? " ▲" : worsened ? " ▼" : ""}</td>
          </tr>`;
        }).join("")}
      </table>
      ${stillWeak.length ? `<div class="hint" style="color:var(--red); font-weight:600; margin-top:6px;">⚠️ ${stillWeak.length} kriteria masih rendah (≤3) bulan ini: ${stillWeak.map(r => r.criterion).join(", ")}.</div>` : ""}
    `;
  }

  const decisionBlock = (s.approvalStatus === 'Approved' && s.decision) ? `
    <div class="section-title" style="margin:16px -18px 8px;">Decision</div>
    <div style="font-size:14px; color:var(--text);"><strong>${findLabel((state.decisionOptionsByTier || {})[s.tier], s.decision)}</strong></div>
    ${s.mutationToPosition ? `<div style="font-size:13px; color:var(--text); margin-top:8px;">Mutasi: ${s.mutationFromPosition} → ${s.mutationToPosition}</div>` : ""}
    ${s.extensionDuration ? `<div style="font-size:13px; color:var(--text); margin-top:8px;">Perpanjangan: ${s.extensionDuration}</div>` : ""}
    <div style="font-size:13px; color:var(--text); margin-top:8px;">1-on-1: <strong>${findLabel(state.oneOnOneOptions, s.oneOnOneStatus)}</strong></div>
    ${s.decisionNotes ? `<div style="font-size:13px; color:var(--text); margin-top:8px;">Catatan:<br/>"${s.decisionNotes}"</div>` : ""}
  ` : "";

  const overlay = document.createElement("div");
  overlay.id = "comparison-modal";
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto;";
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="card" style="max-width:420px; width:100%; background:#fff; max-height:85vh; overflow-y:auto;" onclick="event.stopPropagation();">
      <div style="text-align:center; margin-bottom:14px;">
        ${document.getElementById(`photo-${staffId}`) && document.getElementById(`photo-${staffId}`).style.display !== "none"
          ? `<img src="${document.getElementById(`photo-${staffId}`).src}" style="width:110px; height:110px; border-radius:16px; object-fit:cover; background:var(--sand); margin:0 auto 10px; display:block; cursor:pointer;" onclick="event.stopPropagation(); showPhotoModal('${document.getElementById(`photo-${staffId}`).src}', '${escapeAttr(name)}')" />`
          : `<div style="width:110px; height:110px; border-radius:16px; background:var(--sand); margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--teal); font-size:42px;">${name.charAt(0)}</div>`}
        <h2 style="margin:0;">${name}</h2>
        <div class="hint" style="font-size:12px; margin-top:2px;">${s.department !== "-" ? s.department : s.tier} · Kontrak berakhir: ${s.contractEndDate ? fullDateLabelID(s.contractEndDate) : "-"}</div>
      </div>
      ${trendBlock}
      ${criterionBlock}
      ${decisionBlock}
      <button class="secondary" style="width:100%; margin-top:12px;" onclick="document.getElementById('comparison-modal').remove()">Tutup</button>
    </div>`;
  document.body.appendChild(overlay);
}

function showPhotoModal(src, name) {
  const existing = document.getElementById("photo-modal");
  if (existing) existing.remove();
  const overlay = document.createElement("div");
  overlay.id = "photo-modal";
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:300; display:flex; align-items:center; justify-content:center; padding:24px;";
  overlay.onclick = () => overlay.remove();
  overlay.innerHTML = `
    <div style="max-width:90%; max-height:90%; text-align:center;">
      <img src="${src}" alt="${name}" style="max-width:100%; max-height:80vh; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.5);" />
      <div style="color:#fff; margin-top:12px; font-weight:700;">${name}</div>

function toggleDecisionForm(staffId) {
  const el = document.getElementById(`decision-form-${staffId}`);
  if (el) el.style.display = el.style.display === "none" ? "block" : "none";
}

function toggleDecisionExtras(staffId) {
  const decision = document.getElementById(`decision-select-${staffId}`).value;
  const extendEl = document.getElementById(`extend-fields-${staffId}`);
  const mutationEl = document.getElementById(`mutation-fields-${staffId}`);
  if (extendEl) extendEl.style.display = decision === "extend_probation" ? "block" : "none";
  if (mutationEl) mutationEl.style.display = decision === "demotion_mutation" ? "block" : "none";
}

async function submitDecision(staffId) {
  const decision = document.getElementById(`decision-select-${staffId}`).value;
  const oneOnOneStatus = document.getElementById(`oneonone-select-${staffId}`).value;
  const notes = document.getElementById(`decision-notes-${staffId}`).value;
  if (!decision) { showToast("Decision wajib dipilih dulu.", "error"); return; }
  if (!oneOnOneStatus) { showToast("1-on-1 Status wajib dipilih dulu.", "error"); return; }
  if (!notes || !notes.trim()) { showToast("Catatan wajib diisi.", "error"); return; }

  const payload = { month: state.month, staffId, approvedBy: state.user.name, decision, oneOnOneStatus, notes };

  if (decision === "extend_probation") {
    const extensionValue = document.getElementById(`extension-value-${staffId}`).value;
    const extensionUnit = document.getElementById(`extension-unit-${staffId}`).value;
    if (!extensionValue || Number(extensionValue) <= 0) { showToast("Durasi extend wajib diisi (angka lebih dari 0).", "error"); return; }
    payload.extensionValue = extensionValue;
    payload.extensionUnit = extensionUnit;
  }
  if (decision === "demotion_mutation") {
    const mutationToPosition = document.getElementById(`mutation-to-${staffId}`).value;
    if (!mutationToPosition) { showToast("Posisi tujuan mutasi wajib dipilih.", "error"); return; }
    payload.mutationToPosition = mutationToPosition;
  }

  const res = await apiPost("approveStaff", payload);
  if (res.error || res.success === false) { showToast("Gagal approve: " + friendlyError(res.error), "error"); return; }
  showToast("Approved! Notifikasi terkirim ke staff, leader, management, dan HR terkait.");
  renderGm();
}
