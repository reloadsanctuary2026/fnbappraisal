  const showMenuLink = availableScreens(state.user).length > 1;

  app.innerHTML = topbar("Track Pending Follow-Ups") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToRoleMenu()">&larr; Kembali ke menu</button>' : ""}
    <div class="hint" style="margin-top:8px;">${todos.length} follow-up sudah jatuh tempo dan perlu ditindaklanjuti.</div>
    ${todos.map(t => `
      <div class="staff-row" style="cursor:default; border-color:var(--amber); display:block;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
          <div>
            <div class="name">${t.name} <span style="font-weight:400; color:var(--text-muted);">(${t.department})</span></div>
            <div class="dept">Extend: ${t.extensionDuration} — jatuh tempo ${fullDateLabelID(t.extensionExpiryDate)}</div>
            ${t.decisionNotes ? `<div class="dept" style="margin-top:2px;">Catatan waktu itu: "${t.decisionNotes}"</div>` : ""}
            <div class="dept" style="margin-top:2px; font-size:11px;">Disetujui oleh ${t.approvedBy}</div>
          </div>
          <button class="secondary" style="white-space:nowrap;" onclick="resolveFollowUp('${t.month}', '${t.staffId}')">Sudah Ditindaklanjuti</button>
        </div>
      </div>`).join("")}
    ${!todos.length ? '<div class="card"><div class="hint">Gak ada follow-up yang jatuh tempo saat ini. 👍</div></div>' : ""}
  `;
}

async function resolveFollowUp(month, staffId) {
  const ok = confirm("Tandai follow-up ini sudah ditindaklanjuti? Ini akan hilang dari list To-Do.");
  if (!ok) return;
  const res = await apiPost("markFollowUpResolved", { month, staffId });
  if (res.error || res.success === false) { showToast("Gagal: " + friendlyError(res.error), "error"); return; }
  showToast("Ditandai selesai!");
  renderHrFollowUpTodos();
}

async function renderScInput() {
  app.innerHTML = topbar("Calculate Service Charge") + `<div class="loading">Memuat data...</div>`;
  const pool = await apiGet("getScPool", { month: state.month });
  if (pool.error) {
    app.innerHTML = topbar("Calculate Service Charge") + `<div class="card"><div class="error">${friendlyError(pool.error)}</div></div>`;
    return;
  }
  const idr = n => "Rp " + Math.round(Number(n || 0)).toLocaleString("id-ID");
  const showMenuLink = availableScreens(state.user).length > 1;

  const quota = pool.roleBonusQuota || { Service: 2, Cashier: 1, Hostess: 1, Runner: 2, Bar: 2, Kitchen: 2 };
  const selections = pool.roleBonusSelections || [];
  state._roleBonusStaffOptions = state._roleBonusStaffOptions || {};

  // Load staff options for each department (once, cached in state).
  for (const dept of Object.keys(quota)) {
    if (!state._roleBonusStaffOptions[dept]) {
      const res = await apiGet("getStaffByDepartment", { department: dept });
      state._roleBonusStaffOptions[dept] = res.staff || [];
    }
  }

  const roleBonusRows = (dept, qty) => {
    const picked = selections.filter(s => s.department === dept).map(s => s.staffId);
    const options = state._roleBonusStaffOptions[dept] || [];
    let rows = "";
    for (let i = 0; i < qty; i++) {
      const currentPick = picked[i] || "";
      rows += `
        <select class="role-bonus-select" data-dept="${dept}" style="margin-bottom:6px;">
          <option value="">— kosongkan —</option>
          ${options.map(o => `<option value="${o.staffId}" ${o.staffId === currentPick ? "selected" : ""}>${o.name}</option>`).join("")}
        </select>`;
    }
    return rows;
  };

  app.innerHTML = topbar("Calculate Service Charge") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToRoleMenu()">&larr; Kembali ke menu</button>' : ""}
    <div class="card">
      <label>Bulan</label>
      <input type="month" id="month-picker" value="${state.month}" onchange="changeGmMonth(this.value)" />
    </div>
    <div class="card">
      <h2>Total Service Charge — ${monthLabelID(state.month)}</h2>
      <label>Total SC bulan ini (Rp, sebelum potongan apapun)</label>
      <input type="number" id="sc-input" value="${pool.found ? pool.totalSC : ""}" placeholder="150000000" />
      <button class="secondary" onclick="saveTotalSC()">Simpan Total SC</button>
      ${pool.found ? `
        <table class="mini" style="margin-top:12px;">
          <tr><td>Total SC (Net)</td><td>${idr(pool.totalSC)}</td></tr>
          <tr><td>Staff Bonus Pool (tetap)</td><td>− ${idr(pool.staffBonusPoolAmount)}</td></tr>
          <tr><td><strong>Distributable Amount</strong></td><td><strong>${idr(pool.distributableAmount)}</strong></td></tr>
          <tr><td>Base Share / staff</td><td>${idr(pool.baseShare)}</td></tr>
          <tr><td>Deduction Pool (dari Underperform)</td><td>${idr(pool.poolTotal)}</td></tr>
          <tr><td># Performer</td><td>${pool.performerCount}</td></tr>
          <tr><td>Pool Share / performer</td><td>${idr(pool.poolShare)}</td></tr>
        </table>
        <button class="secondary" style="margin-top:10px;" onclick="doExportSc()">📊 Export ke Excel (buat Finance)</button>
        <div class="hint" id="sc-export-note" style="margin-top:6px;"></div>` : ""}
    </div>
    <div class="card">
      <h2>Monthly Role-Based Bonus — ${idr(pool.roleBonusPerPerson || 300000)}/orang</h2>
      <div class="hint" style="margin-bottom:10px;">Pilih staff yang dapat bonus tambahan bulan ini, sesuai kuota tiap role (Memo 122/HR-IM/VIII/2026). Dikonsolidasikan dari usulan Leader/Department Head masing-masing.</div>
      ${Object.entries(quota).map(([dept, qty]) => `
        <div style="margin-bottom:14px;">
          <label style="font-weight:700;">${dept} (${qty} orang)</label>
          ${roleBonusRows(dept, qty)}
        </div>`).join("")}
      <button class="primary" onclick="saveRoleBonusSelections()">Simpan Role-Based Bonus</button>
    </div>`;
}

function changeGmMonth(value) {
  if (!value) return;
  state.month = value;
  renderGm();
}

async function doExportSc() {
  const noteEl = document.getElementById("sc-export-note");
  noteEl.textContent = "Membuat sheet export...";
  const res = await apiPost("exportScBreakdown", { month: state.month });
  if (res.error || res.success === false) {
    noteEl.textContent = "Gagal export: " + friendlyError(res.error);
    return;
  }
  noteEl.innerHTML = `Sheet siap! <a href="${res.sheetUrl}" target="_blank" style="color:var(--teal); font-weight:700;">Buka di Google Sheets</a> — lalu File → Download → Microsoft Excel (.xlsx).`;
}

async function saveTotalSC() {
  const val = document.getElementById("sc-input").value;
  if (!val) return;
  const res = await apiPost("setTotalSC", { month: state.month, totalSC: Number(val), inputBy: state.user.name });
  if (res.error) { showToast("Gagal simpan Total SC: " + friendlyError(res.error), "error"); return; }
  showToast("Total SC tersimpan!");
  renderScInput();
}

async function saveRoleBonusSelections() {
  const selects = document.querySelectorAll(".role-bonus-select");
  const selections = [];
  const seen = {};
  for (const el of selects) {
    const dept = el.dataset.dept;
    const staffId = el.value;
    if (!staffId) continue;
    const key = dept + "|" + staffId;
    if (seen[key]) { showToast(`${staffId} dipilih dobel untuk ${dept} — cek lagi.`, "error"); return; }
    seen[key] = true;
    selections.push({ department: dept, staffId });
  }
  const res = await apiPost("setRoleBonusSelections", { month: state.month, selections });
  if (res.error || res.success === false) {
    showToast(`Gagal simpan: kuota ${res.department || ""} kelebihan.`, "error");
    return;
  }
  showToast("Role-Based Bonus tersimpan!");
  renderScInput();
}

async function approveAll() {
  const res = await apiPost("approveAll", { month: state.month, approvedBy: state.user.name });
  if (res.error) { showToast("Gagal approve semua: " + friendlyError(res.error), "error"); return; }
  showToast(`${res.approvedCount || 0} appraisal ter-approve! Notifikasi terkirim.`);
  renderGm();
}

// =================================================================
render();
</script>
</body>
</html>
