<style>
  :root {
    --teal: #0E4749;
    --teal-dark: #082F31;
    --coral: #FF6B4A;
    --coral-dark: #E85535;
    --gold: #F2A65A;
    --bg: #FFF9F1;
    --card: #FFFFFF;
    --sand: #F5EBDC;
    --border: #EDE1D1;
    --text: #20302F;
    --text-muted: #8A7B6C;
    --green: #2F9E6E;
    --green-bg: #E4F5EC;
    --red: #E2574C;
    --red-bg: #FDECEA;
    --amber: #D98A2B;
    --amber-bg: #FBF0DE;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  body {
    margin: 0;

  }
  #app { max-width: 720px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
  .topbar {

  .topbar button {
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer;
    transition: background 0.15s ease;
  }
  .topbar button:hover { background: rgba(255,255,255,0.24); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px; margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(32, 48, 47, 0.04);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 700; }
  label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 11px 14px; font-size: 15px; border: 1.5px solid var(--border);
    border-radius: 12px; background: #fff; color: var(--text); margin-bottom: 14px;
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus { outline: none; border-color: var(--coral); }
  button.primary {
    width: 100%; padding: 13px; font-size: 14px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--coral), var(--gold)); border: none; border-radius: 14px;
    cursor: pointer; transition: transform 0.1s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 12px rgba(255, 107, 74, 0.28);
  }
  button.primary:hover { box-shadow: 0 6px 16px rgba(255, 107, 74, 0.36); }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.5; box-shadow: none; }
  button.secondary {
    padding: 9px 16px; font-size: 13px; border: 1.5px solid var(--border); font-weight: 600;
    background: #fff; border-radius: 12px; cursor: pointer; color: var(--text);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  button.secondary:hover { border-color: var(--coral); }
  button.secondary:active { transform: scale(0.97); }
  button.ghost { background: transparent; border: none; color: var(--teal); font-weight: 600; font-size: 13px; cursor: pointer; }

  .staff-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 14px; margin-bottom: 8px; cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
    background: #fff;
  }
  .staff-row:hover { border-color: var(--coral); background: #FFFCF8; }
  .staff-row:active { transform: scale(0.99); }
  .staff-row .name { font-size: 14px; font-weight: 600; }
  .staff-row .dept { font-size: 12px; color: var(--text-muted); }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
  .badge.done { background: var(--green-bg); color: var(--green); }
  .badge.pending { background: var(--sand); color: var(--text-muted); }
  .badge.performer { background: var(--green-bg); color: var(--green); }
  .badge.underperform { background: var(--red-bg); color: var(--red); }
  .badge.flag { background: var(--amber-bg); color: var(--amber); }

  .criterion-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .criterion-row:last-child { border-bottom: none; }
  .criterion-row .name { font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  .criterion-row .desc { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .score-select { display: flex; gap: 6px; }
  .score-opt {
    flex: 1; text-align: center; padding: 9px 0; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; user-select: none; color: var(--text-muted);
    transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .score-opt:hover { border-color: var(--coral); }
  .score-opt.selected {
    background: linear-gradient(135deg, var(--coral), var(--gold)); color: #fff; border-color: transparent;
    transform: scale(1.08);
  }

  .section-title {
    font-size: 12px; font-weight: 800; color: var(--teal); margin: 20px 0 8px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .error { color: var(--red); font-size: 13px; margin-bottom: 10px; font-weight: 600; }
  .center { text-align: center; }
  .row-flex { display: flex; gap: 8px; }
  .row-flex > * { flex: 1; }
  table.mini { width: 100%; font-size: 13px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.mini td { padding: 6px 0; border-bottom: 1px solid var(--border); }
  table.mini td:last-child { text-align: right; font-weight: 600; }
  .loading { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 13px; }
</style>

// API helpers
// =================================================================
async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, ...params }).toString();
  try {
    const res = await fetch(`${API_URL}?${qs}`);
    return await res.json();
  } catch (err) {
    console.error("apiGet failed:", action, err);
    return { error: "Gagal terhubung ke server (cek koneksi / setting deployment Apps Script)." };
  }
}
async function apiPost(action, payload) {
  // NOTE: no explicit Content-Type header — keeps this a "simple request"
  // so the browser skips the CORS preflight, which Apps Script can't answer.
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, payload }) });
    return await res.json();
  } catch (err) {
    console.error("apiPost failed:", action, err);
    return { error: "Gagal terhubung ke server (cek koneksi / setting deployment Apps Script)." };
  }
}
function currentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

// =================================================================
// App state
// =================================================================
let state = {
  screen: "login",       // login | roleMenu | self | myEvaluations | form | gm
  user: null,            // {staffId, name, department, tier, oversees, reportsTo, isLeader, isManagement, isExecutive, isHR}
  month: currentMonth(),
  targetStaff: null,     // person being appraised (for non-self forms)
  kpiConfig: null,
  scores: {},            // criterion -> score
};

const app = document.getElementById("app");

function render() {
  if (state.screen === "login") return renderLogin();
  if (state.screen === "roleMenu") return renderRoleMenu();
  if (state.screen === "self") return renderAppraisalForm({ evaluatorType: "self", target: state.user });
  if (state.screen === "myEvaluations") return renderMyEvaluations();
  if (state.screen === "review") return renderReview();
  if (state.screen === "form") return renderAppraisalForm({ evaluatorType: state.evaluatorType, target: state.targetStaff });
  if (state.screen === "gm") return renderGm();
}

function topbar(title) {
  return `
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="logo-mark"></div>
        <div>
          <h1>${title}</h1>
          <div class="sub">${state.user ? state.user.name + " · " + state.month : ""}</div>
        </div>
      </div>
      ${state.user ? '<button onclick="logout()">Keluar</button>' : ""}
    </div>`;
}

// =================================================================
// Login
// =================================================================
function renderLogin() {
  app.innerHTML = `
    <div class="topbar"><div style="display:flex; align-items:center; gap:10px;"><div class="logo-mark"></div><h1>Reload F&amp;B Appraisal</h1></div></div>
    <div class="card">
      <h2>Masuk dengan NIK</h2>
      <label>NIK (Nomor Induk Karyawan)</label>
      <input type="text" id="pin-input" inputmode="numeric" placeholder="Contoh: 1096" maxlength="10" />
      <div class="error" id="login-error"></div>
      <button class="primary" onclick="doLogin()">Masuk</button>
    </div>`;
  document.getElementById("pin-input").focus();
  document.getElementById("pin-input").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
}

async function doLogin() {
  const nik = document.getElementById("pin-input").value.trim();
  if (!nik) return;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "Menghubungkan...";
  try {
    const res = await apiGet("login", { nik });
    if (res.error) {
      errEl.textContent = "Server error: " + res.error;
      return;
    }
    if (!res.found) {
      errEl.textContent = "NIK tidak ditemukan.";
      return;
    }
    state.user = res;
    goToRoleMenu();
  } catch (err) {
    console.error(err);
    errEl.textContent = "Gagal terhubung ke server. Cek koneksi, atau setting deployment Apps Script (Who has access = Anyone).";
  }
}

// A person can have several capabilities at once (e.g. a Floor Supervisor is
// both a Staff who gets self-appraised AND a Leader who appraises their team).
// If only one screen applies, skip straight to it; otherwise show a picker.
function availableScreens(user) {
  const options = [];
  if (user.department && user.department !== "-") options.push({ key: "self", label: "Appraisal saya sendiri" });
  if (user.isLeader) options.push({ key: "myEvaluations", label: "Appraisal staff di tim saya" });
  if (user.isManagement) options.push({ key: "myEvaluations", label: "Appraisal staff/leader di area saya" });
  if (user.isExecutive) options.push({ key: "myEvaluations", label: "Appraisal management" });
  if (user.isHR) options.push({ key: "myEvaluations", label: "Appraisal & review (HR)" });
  if (user.isManagement) options.push({ key: "review", label: "Review appraisal di area saya" });
  if (user.isHR) options.push({ key: "review", label: "Review semua appraisal" });
  if (user.isExecutive) options.push({ key: "gm", label: "Executive — approval & Service Charge" });
  // De-dupe (someone could have more than one flag pointing at the same key).
  const seen = new Set();
  return options.filter(o => {
    if (seen.has(o.key)) return false;
    seen.add(o.key);
    return true;
  });
}

function goToRoleMenu() {
  const options = availableScreens(state.user);
  if (options.length === 0) {
    app.innerHTML = topbar("Akses belum diatur") + `
      <div class="card">
        <div class="hint" style="font-size:14px;">
          NIK <strong>${state.user.staffId}</strong> (${state.user.name}) berhasil login, tapi belum ada akses
          apapun yang diaktifkan. Cek Job Title untuk NIK ini di HR Sheet — pastikan ada di Config_PositionMap
          dengan Tier yang sesuai.
        </div>
        <button class="secondary" onclick="logout()" style="margin-top:12px;">Kembali ke login</button>
      </div>`;
    return;
  }
  if (options.length === 1) {
    state.screen = options[0].key;
    render();
    return;
  }
  state.screen = "roleMenu";
  render();
}

function renderRoleMenu() {
  const options = availableScreens(state.user);
  app.innerHTML = topbar("Pilih menu") + `
    <div class="card">
      <div class="hint">${state.user.name} punya lebih dari satu akses:</div>
      ${options.map(o => `<div class="staff-row" onclick="goToScreen('${o.key}')"><div class="name">${o.label}</div></div>`).join("")}
    </div>`;
}

function goToScreen(key) {
  state.screen = key;
  render();
}

function logout() {
  state = { screen: "login", user: null, month: currentMonth(), targetStaff: null, kpiConfig: null, scores: {} };
  render();
}

// =================================================================
// My Evaluations — unified todo list for Leader / Management / Executive / HR.
// Each target already comes back from the backend with the correct `slot`
// (leader/hr) for THIS viewer, so the frontend doesn't need to know the
// tier rules itself.
// =================================================================
async function renderMyEvaluations() {
  app.innerHTML = topbar("Appraisal Saya") + `<div class="loading">Memuat daftar...</div>`;
  const res = await apiGet("getEvaluationTargets", { evaluatorId: state.user.staffId });
  const list = res.targets || [];
  const showMenuLink = availableScreens(state.user).length > 1;
  app.innerHTML = topbar("Appraisal Saya") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToScreen(\'roleMenu\')">&larr; Kembali ke menu</button>' : ""}
    <div class="hint">${list.length} orang — klik untuk isi appraisal</div>
    ${list.map(s => `
      <div class="staff-row" onclick="openForm('${s.slot}', '${s.staffId}', '${escapeAttr(s.name)}', '${s.department}', '${s.tier}')">
        <div>
          <div class="name">${s.name}</div>
          <div class="dept">${s.department !== "-" ? s.department : s.tier} · ${s.tier}</div>
        </div>
        <span class="badge ${s.status === 'Submitted' ? 'done' : 'pending'}">${s.status}</span>
      </div>`).join("")}
    ${!list.length ? '<div class="hint">Tidak ada yang perlu di-appraisal saat ini.</div>' : ""}
  `;
}

function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

// =================================================================
// Review — read-only, scoped by Tier/Oversees (Management sees their
// area, HR & Executive see everyone). No approve buttons here; approval
// stays on the Executive-only GM dashboard.
// =================================================================
async function renderReview() {
  app.innerHTML = topbar("Review Appraisal") + `<div class="loading">Memuat data...</div>`;
  const res = await apiGet("getReviewData", { reviewerId: state.user.staffId });
  const rows = res.rows || [];
  const showMenuLink = availableScreens(state.user).length > 1;
  const idr = n => "Rp " + Math.round(Number(n || 0)).toLocaleString("id-ID");

  app.innerHTML = topbar("Review Appraisal") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToScreen(\'roleMenu\')">&larr; Kembali ke menu</button>' : ""}
    <div class="hint">${rows.length} appraisal record — read only</div>
    ${rows.map(r => `
      <div class="staff-row" style="cursor:default;">
        <div>
          <div class="name">${r.name} <span style="font-weight:400; color:var(--text-muted);">(${r.department !== "-" ? r.department : r.tier})</span></div>
          <div class="dept">${r.month} · Self ${Number(r.selfTotal||0).toFixed(1)} · Leader ${Number(r.leaderTotal||0).toFixed(1)} · HR ${Number(r.hrTotal||0).toFixed(1)} · Final ${Number(r.finalScore||0).toFixed(1)}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
          <span class="badge ${r.status === 'Performer' ? 'performer' : 'underperform'}">${r.status}</span>
          <span class="badge ${r.approvalStatus === 'Approved' ? 'done' : 'pending'}">${r.approvalStatus || 'Pending'}</span>
        </div>
      </div>`).join("")}
    ${!rows.length ? '<div class="hint">Belum ada data appraisal di scope kamu.</div>' : ""}
  `;
}

function openForm(evaluatorType, staffId, name, department, tier) {
  state.evaluatorType = evaluatorType;
  state.targetStaff = { staffId, name, department, tier };
  state.screen = "form";
  render();
}

// =================================================================
// Appraisal form (shared by Self / Leader / Management / Executive / HR)
// =================================================================
async function renderAppraisalForm({ evaluatorType, target }) {
  const subtitle = `${target.department && target.department !== "-" ? target.department : ""}${target.tier ? (target.department && target.department !== "-" ? " · " : "") + target.tier + " tier" : ""}`;
  app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div><div class="loading">Memeriksa akses...</div>`;

  const access = await apiGet("checkAccess", { staffId: target.staffId, evaluatorType });
  if (access.error) {
    app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div>
      <div class="card"><div class="error">Server error: ${access.error}</div>
      <button class="secondary" onclick="goBack()">Kembali</button></div>`;
    return;
  }
  if (!access.allowed) {
    let msg;
    if (access.reason === "too_early") {
      msg = `Belum waktunya. Coba lagi mulai <strong>${access.retryDateLabel}</strong>.`;
    } else if (access.reason === "too_late") {
      msg = "Waktu untuk mengisi appraisal ini sudah lewat.";
    } else {
      msg = "Data kontrak untuk staff ini tidak ditemukan. Hubungi HR.";
    }
    app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div>
      <div class="card">
        <div class="hint" style="font-size:14px;">${msg}</div>
        <button class="secondary" onclick="goBack()" style="margin-top:12px;">Kembali</button>
      </div>`;
    return;
  }

  app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div><div class="loading">Memuat form...</div>`;
  const cfg = await apiGet("getKpiConfigForTarget", { targetStaffId: target.staffId });
  if (cfg.error) {
    app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div>
      <div class="card"><div class="error">Server error: ${cfg.error}</div>
      <button class="secondary" onclick="goBack()">Kembali</button></div>`;
    return;
  }
  state.kpiConfig = cfg;
  state.scores = {};

  const scoreRow = (criterion, desc) => `
    <div class="criterion-row" data-criterion="${escapeAttr(criterion)}">
      <div class="name">${criterion}</div>
      ${desc ? `<div class="desc">${desc}</div>` : ""}
      <div class="score-select">
        ${[1,2,3,4,5].map(v => `<div class="score-opt" onclick="selectScore(this, '${escapeAttr(criterion)}', ${v})">${v}</div>`).join("")}
      </div>
    </div>`;

  const bonusRow = (item, points, idx) => `
    <div class="criterion-row">
      <div class="name">${item} <span style="font-weight:600; color:${points > 0 ? "var(--green)" : "var(--red)"};">${points > 0 ? "+" : ""}${points} pts</span></div>
      <div class="row-flex" style="align-items:center;">
        <input type="number" min="0" class="bonus-count" data-idx="${idx}" value="0" style="margin-bottom:0; flex:0 0 80px;" />
        <input type="text" class="bonus-notes" data-idx="${idx}" placeholder="Evidence / notes (opsional)" style="margin-bottom:0;" />
      </div>
    </div>`;

  const isSelf = evaluatorType === "self";

  app.innerHTML = topbar("Appraisal — " + target.name) + `
    <div class="card">
      <div class="hint">${target.department !== "-" ? target.department : target.tier} · ${evaluatorType.toUpperCase()} appraisal · ${state.month}</div>

      <div class="section-title">Section A — Attitude</div>
      ${cfg.attitude.map(c => scoreRow(c.name, c.description)).join("")}

      <div class="section-title">Section B — Discipline</div>
      ${cfg.discipline.map(c => scoreRow(c.name, `Target: ${c.target}`)).join("")}

      <div class="section-title">Section C — Performance KPI</div>
      ${cfg.placeholder
        ? `<div class="hint" style="background:var(--surface-2); padding:12px; border-radius:8px;">${cfg.placeholderNote}</div>`
        : cfg.kpi.map(c => scoreRow(c.name, `Target: ${c.target}`)).join("")}

      ${isSelf ? "" : `
        <div class="section-title">Section D — Bonus &amp; Deduction</div>
        <div class="hint">Isi jumlah kejadian bulan ini. Biarkan 0 kalau tidak ada.</div>
        ${cfg.bonus.map((b, i) => bonusRow(b.item, b.points, i)).join("")}
      `}

      <div class="error" id="form-error"></div>
      <button class="primary" onclick="submitForm('${evaluatorType}')" style="margin-top: 14px;">Submit Appraisal</button>
      <div class="center" style="margin-top: 10px;">
        <button class="ghost" onclick="goBack()">Batal</button>
      </div>
    </div>`;
}

function selectScore(el, criterion, value) {
  const row = el.closest(".criterion-row");
  row.querySelectorAll(".score-opt").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  state.scores[criterion] = value;
}

function goBack() {
  const options = availableScreens(state.user);
  if (options.length > 1) state.screen = "roleMenu";
  else if (state.user.isLeader || state.user.isManagement || state.user.isExecutive || state.user.isHR) state.screen = "myEvaluations";
  else state.screen = "login";
  render();
}

async function submitForm(evaluatorType) {
  const cfg = state.kpiConfig;
  const kpiCriteria = cfg.placeholder ? [] : cfg.kpi.map(c => c.name);
  const allCriteria = [...cfg.attitude.map(c => c.name), ...cfg.discipline.map(c => c.name), ...kpiCriteria];
  const missing = allCriteria.filter(c => !(c in state.scores));
  if (missing.length) {
    document.getElementById("form-error").textContent = `Masih ada ${missing.length} kriteria yang belum diisi.`;
    return;
  }
  const bonusEntries = [];
  if (evaluatorType !== "self") {
    cfg.bonus.forEach((b, i) => {
      const countInput = document.querySelector(`.bonus-count[data-idx="${i}"]`);
      const count = Number(countInput ? countInput.value : 0) || 0;
      if (count > 0) {
        const notesInput = document.querySelector(`.bonus-notes[data-idx="${i}"]`);
        bonusEntries.push({ item: b.item, count, notes: notesInput ? notesInput.value : "" });
      }
    });
  }

  const target = state.targetStaff;
  const payload = {
    staffId: target.staffId,
    evaluatorId: state.user.staffId,
    attitudeScores: cfg.attitude.map(c => ({ criterion: c.name, score: state.scores[c.name] })),
    disciplineScores: cfg.discipline.map(c => ({ criterion: c.name, score: state.scores[c.name] })),
    kpiScores: kpiCriteria.map(c => ({ criterion: c, score: state.scores[c] })),
    bonusEntries,
  };
  document.getElementById("form-error").textContent = "Menyimpan...";
  const res = await apiPost("submitAppraisal", payload);
  if (res.success) {
    goBack();
  } else {
    document.getElementById("form-error").textContent = "Gagal menyimpan: " + (res.error || res.reason || "unknown error");
  }
}

// =================================================================
// GM Approval dashboard
// =================================================================
async function renderGm() {
  app.innerHTML = topbar("GM Approval") + `<div class="loading">Memuat data...</div>`;
  const pool = await apiGet("getScPool", { month: state.month });
  const final = await apiGet("getFinalAppraisal", { month: state.month });
  const list = final.staff || [];
  const flagged = list.filter(s => s.status === "Underperform" && s.approvalStatus !== "Approved");
  const idr = n => "Rp " + Math.round(Number(n || 0)).toLocaleString("id-ID");
  const showMenuLink = availableScreens(state.user).length > 1;

  app.innerHTML = topbar("GM Approval") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToScreen(\'roleMenu\')">&larr; Kembali ke menu</button>' : ""}
    <div class="card">
      <h2>Total Service Charge — ${state.month}</h2>
      <label>Total SC bulan ini (Rp)</label>
      <input type="number" id="sc-input" value="${pool.found ? pool.totalSC : ""}" placeholder="150000000" />
      <button class="secondary" onclick="saveTotalSC()">Simpan Total SC</button>
      ${pool.found ? `
        <table class="mini" style="margin-top:12px;">
          <tr><td>Base share / staff</td><td>${idr(pool.baseShare)}</td></tr>
          <tr><td>Pool total</td><td>${idr(pool.poolTotal)}</td></tr>
          <tr><td># Performer</td><td>${pool.performerCount}</td></tr>
          <tr><td>Pool share / performer</td><td>${idr(pool.poolShare)}</td></tr>
        </table>` : ""}
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 style="margin:0;">Appraisal — ${list.length} staff</h2>
        <button class="secondary" onclick="approveAll()">Approve semua (kecuali flagged)</button>
      </div>
      ${list.map(s => `
        <div class="staff-row" style="cursor:default; ${s.status === 'Underperform' ? 'border-color:var(--amber);' : ''}">
          <div>
            <div class="name">${s.name} <span style="font-weight:400; color:var(--text-muted);">(${s.department})</span></div>
            <div class="dept">Score ${Number(s.finalScore || 0).toFixed(1)} · Final SC ${idr(s.finalSC)}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="badge ${s.status === 'Performer' ? 'performer' : 'underperform'}">${s.status}</span>
            ${s.approvalStatus === 'Approved'
              ? `<span class="badge done">Approved</span>`
              : `<button class="secondary" onclick="approveOne('${s.staffId}')">Approve</button>`}
          </div>
        </div>`).join("")}
      ${!list.length ? '<div class="hint">Belum ada appraisal masuk untuk bulan ini.</div>' : ""}
    </div>`;
}

async function saveTotalSC() {
  const val = document.getElementById("sc-input").value;
  if (!val) return;
  await apiPost("setTotalSC", { month: state.month, totalSC: Number(val), inputBy: state.user.name });
  renderGm();
}
async function approveOne(staffId) {
  await apiPost("approveStaff", { month: state.month, staffId, approvedBy: state.user.name });
  renderGm();
}
async function approveAll() {
  await apiPost("approveAll", { month: state.month, approvedBy: state.user.name });
  renderGm();
}

// =================================================================
render();
</script>
</body>
