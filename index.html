<style>
  :root {
    --teal: #0E4749;
    --teal-dark: #082F31;
    --coral: #FF6B4A;
    --coral-dark: #E85535;
    --gold: #F2A65A;
    --bg: #FFF9F1;
    --card: #FFFFFF;
    --sand: #F5EBDC;
    --border: #EDE1D1;
    --text: #20302F;
    --text-muted: #8A7B6C;
    --green: #2F9E6E;
    --green-bg: #E4F5EC;
    --red: #E2574C;
    --red-bg: #FDECEA;
    --amber: #D98A2B;
    --amber-bg: #FBF0DE;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  body {
    margin: 0;
    font-family: "Poppins", ui-rounded, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  #app { max-width: 720px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(120deg, var(--teal) 0%, var(--teal) 65%, var(--coral-dark) 130%);
    color: #fff; padding: 16px 18px; margin: -16px -16px 16px;
    border-radius: 0 0 20px 20px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 6px 16px rgba(14, 71, 73, 0.18);
  }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .topbar .sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 1px; }

  .topbar button {
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer;
    transition: background 0.15s ease;
  }
  .topbar button:hover { background: rgba(255,255,255,0.24); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px; margin-bottom: 14px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(32, 48, 47, 0.04);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 700; }
  .mode-banner {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;
    padding: 10px 14px; border-radius: 12px; margin-bottom: 16px;
  }
  .mode-banner .mode-label { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; }
  .mode-banner .mode-meta { font-size: 12px; opacity: 0.85; }
  .mode-banner.mode-self { background: var(--green-bg); color: var(--green); }
  .mode-banner.mode-leader { background: var(--amber-bg); color: var(--amber); }
  .mode-banner.mode-hr { background: #E8E3F5; color: #6C4FB6; }
  label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 11px 14px; font-size: 15px; border: 1.5px solid var(--border);
    border-radius: 12px; background: #fff; color: var(--text); margin-bottom: 14px;
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus { outline: none; border-color: var(--coral); }
  button.primary {
    width: 100%; padding: 13px; font-size: 14px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--coral), var(--gold)); border: none; border-radius: 14px;
    cursor: pointer; transition: transform 0.1s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 12px rgba(255, 107, 74, 0.28);
  }
  button.primary:hover { box-shadow: 0 6px 16px rgba(255, 107, 74, 0.36); }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.5; box-shadow: none; }
  button.secondary {
    padding: 9px 16px; font-size: 13px; border: 1.5px solid var(--border); font-weight: 600;
    background: #fff; border-radius: 12px; cursor: pointer; color: var(--text);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  button.secondary:hover { border-color: var(--coral); }
  button.secondary:active { transform: scale(0.97); }
  button.ghost { background: transparent; border: none; color: var(--teal); font-weight: 600; font-size: 13px; cursor: pointer; }

  .staff-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 14px; margin-bottom: 8px; cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
    background: #fff;
  }
  .staff-row:hover { border-color: var(--coral); background: #FFFCF8; }
  .staff-row:active { transform: scale(0.99); }
  .staff-row .name { font-size: 14px; font-weight: 600; }
  .staff-row .dept { font-size: 12px; color: var(--text-muted); }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
  .badge.done { background: var(--green-bg); color: var(--green); }
  .badge.pending { background: var(--sand); color: var(--text-muted); }
  .badge.performer { background: var(--green-bg); color: var(--green); }
  .badge.underperform { background: var(--red-bg); color: var(--red); }
  .badge.flag { background: var(--amber-bg); color: var(--amber); }

  .criterion-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .criterion-row:last-child { border-bottom: none; }
  .criterion-row .name { font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  .criterion-row .desc { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .score-select { display: flex; gap: 6px; }
  .score-opt {
    flex: 1; text-align: center; padding: 9px 0; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; user-select: none; color: var(--text-muted);
    transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .score-opt:hover { border-color: var(--coral); }
  .score-opt.selected {
    background: linear-gradient(135deg, var(--coral), var(--gold)); color: #fff; border-color: transparent;
    transform: scale(1.08);
  }

  .section-title {
    font-size: 12px; font-weight: 800; color: #fff; margin: 26px -18px 16px; padding: 11px 18px;
    text-transform: uppercase; letter-spacing: 0.06em;
    background: linear-gradient(90deg, var(--teal), var(--teal-dark));
  }
  .section-title:first-of-type { margin-top: 4px; }
  .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .error { color: var(--red); font-size: 13px; margin-bottom: 10px; font-weight: 600; }
  .center { text-align: center; }
  .row-flex { display: flex; gap: 8px; }
  .row-flex > * { flex: 1; }
  table.mini { width: 100%; font-size: 13px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.mini td { padding: 6px 0; border-bottom: 1px solid var(--border); }
  table.mini td:last-child { text-align: right; font-weight: 600; }
  .loading { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 13px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--teal); color: #fff; padding: 13px 22px; border-radius: 14px;
    font-size: 13px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,0.22);
    z-index: 100; opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 88%; text-align: center; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--green); }
  .toast.error { background: var(--red); }
</style>
</head>
<body>
<div id="app"></div>
<div style="position:fixed; bottom:4px; left:8px; font-size:10px; color:#bbb; z-index:1000; font-family:monospace; pointer-events:none;">index v2026-08-06-16</div>

<script>
// =================================================================
// CONFIG — set this to your Apps Script Web App URL
// =================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbwqUUo-avmoBoj9ZqmdGUTMQtswX4Rj6aYoHc21oDLD6LfUsEluTLA2ccn4g3pUYaXLUw/exec";

// =================================================================
// API helpers
// =================================================================
async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, ...params }).toString();
  try {
    const res = await fetch(`${API_URL}?${qs}`);
    return await res.json();
  } catch (err) {
    console.error("apiGet failed:", action, err);
    return { error: "Gagal terhubung ke server (cek koneksi / setting deployment Apps Script)." };
  }
}
async function apiPost(action, payload) {
  // NOTE: no explicit Content-Type header — keeps this a "simple request"
  // so the browser skips the CORS preflight, which Apps Script can't answer.
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, payload }) });
    return await res.json();
  } catch (err) {
    console.error("apiPost failed:", action, err);
    return { error: "Gagal terhubung ke server (cek koneksi / setting deployment Apps Script)." };
  }
}
function currentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function statusLabelID(status) {
  const map = { "Submitted": "Sudah Diisi", "Not started": "Belum Diisi", "Approved": "Disetujui", "Pending": "Menunggu" };
  return map[status] || status;
}

function findLabel(options, value) {
  const match = (options || []).find(o => o.value === value);
  return match ? match.label : (value || "-");
}

function friendlyError(code) {
  const map = {
    decision_required: "Decision belum dipilih.",
    one_on_one_status_required: "1-on-1 Status belum dipilih.",
    notes_required: "Catatan belum diisi.",
    outside_approval_window: "Belum waktunya approval (tanggal 22-28 tiap bulan).",
    not_authorized: "Anda tidak punya akses untuk appraisal ini.",
    evaluator_or_target_not_found: "Data tidak ditemukan, coba refresh halaman.",
    appraisal_not_found: "Appraisal untuk staff ini belum lengkap.",
    access_denied: "Akses ditolak.",
    max_attempts_reached: "Sudah pernah diisi, tidak bisa diisi ulang.",
  };
  return map[code] || code || "Terjadi kendala tidak dikenal";
}

function showToast(message, type = "success") {
  const existing = document.getElementById("toast");
  if (existing) existing.remove();
  const el = document.createElement("div");
  el.id = "toast";
  el.className = `toast ${type}`;
  el.textContent = message;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 300);
  }, 2400);
}

// =================================================================
// App state
// =================================================================
let state = {
  screen: "login",       // login | roleMenu | self | myEvaluations | form | gm
  user: null,            // {staffId, name, department, tier, oversees, reportsTo, isLeader, isManagement, isExecutive, isHR}
  month: currentMonth(),
  targetStaff: null,     // person being appraised (for non-self forms)
  kpiConfig: null,
  scores: {},            // criterion -> score
  submissionCount: 0,    // how many times this target/slot has already been submitted
  unreadCount: 0,
  prevScreen: null,
  _preserveScores: false,
  _pendingBonusEntries: null,
};

const app = document.getElementById("app");

function render() {
  if (state.screen === "login") return renderLogin();
  if (state.screen === "roleMenu") return renderRoleMenu();
  if (state.screen === "self") return renderAppraisalForm({ evaluatorType: "self", target: state.user });
  if (state.screen === "myEvaluations") return renderMyEvaluations();
  if (state.screen === "review") return renderReview();
  if (state.screen === "form") return renderAppraisalForm({ evaluatorType: state.evaluatorType, target: state.targetStaff });
  if (state.screen === "gm") return renderGm();
  if (state.screen === "sc") return renderScInput();
  if (state.screen === "notifications") return renderNotifications();
}

function topbar(title) {
  const unread = state.unreadCount || 0;
  return `
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="logo-mark"></div>
        <div>
          <h1>${title}</h1>
          <div class="sub">${state.user ? state.user.name + " · " + state.month : ""}</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        ${state.user ? `<button onclick="openNotifications()" style="position:relative;">🔔${unread > 0 ? `<span style="position:absolute; top:-6px; right:-6px; background:var(--coral); color:#fff; border-radius:10px; font-size:10px; padding:1px 5px; font-weight:800;">${unread}</span>` : ""}</button>` : ""}
        ${state.user ? '<button onclick="logout()">Keluar</button>' : ""}
      </div>
    </div>`;
}

async function refreshUnreadCount() {
  if (!state.user) return;
  const res = await apiGet("getNotifications", { staffId: state.user.staffId });
  const list = res.notifications || [];
  state.unreadCount = list.filter(n => !n.read).length;
}

function openNotifications() {
  state.prevScreen = state.screen;
  state.screen = "notifications";
  render();
}

async function renderNotifications() {
  app.innerHTML = topbar("Notifikasi") + `<div class="loading">Memuat...</div>`;
  const res = await apiGet("getNotifications", { staffId: state.user.staffId });
  if (res.error) {
    app.innerHTML = topbar("Notifikasi") + `<div class="card"><div class="error">${friendlyError(res.error)}</div></div>`;
    return;
  }
  const list = res.notifications || [];
  state.unreadCount = list.filter(n => !n.read).length;

  app.innerHTML = topbar("Notifikasi") + `
    <button class="ghost" onclick="goBackFromNotifications()">&larr; Kembali</button>
    <div class="hint" style="margin-top:8px;">${list.length} notifikasi</div>
    ${list.map(n => `
      <div class="staff-row" style="cursor:default; ${n.read ? "" : "border-color:var(--coral);"}" ${n.read ? "" : `onclick="markRead('${n.id}')"`}>
        <div>
          <div class="name" style="font-weight:${n.read ? "500" : "700"};">${n.message}</div>
          <div class="dept">${new Date(n.timestamp).toLocaleDateString("id-ID")} · ${n.month}</div>
        </div>
        ${n.read ? "" : `<span class="badge pending">Baru</span>`}
      </div>`).join("")}
    ${!list.length ? '<div class="hint">Belum ada notifikasi.</div>' : ""}
  `;
}

async function markRead(id) {
  await apiPost("markNotificationRead", { notificationId: id });
  renderNotifications();
}

function goBackFromNotifications() {
  state.screen = state.prevScreen || "login";
  render();
}

// =================================================================
// Login
// =================================================================
function renderLogin() {
  app.innerHTML = `
    <div class="topbar"><div style="display:flex; align-items:center; gap:10px;"><div class="logo-mark"></div><h1>Reload F&amp;B Appraisal</h1></div></div>
    <div class="card">
      <h2>Masuk dengan NIK</h2>
      <label>NIK (Nomor Induk Karyawan)</label>
      <input type="text" id="pin-input" inputmode="numeric" placeholder="Contoh: 1096" maxlength="10" />
      <div class="error" id="login-error"></div>
      <button class="primary" onclick="doLogin()">Masuk</button>
    </div>`;
  document.getElementById("pin-input").focus();
  document.getElementById("pin-input").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
}

async function doLogin() {
  const nik = document.getElementById("pin-input").value.trim();
  if (!nik) return;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "Menghubungkan...";
  try {
    const res = await apiGet("login", { nik });
    if (res.error) {
      errEl.textContent = friendlyError(res.error);
      return;
    }
    if (!res.found) {
      errEl.textContent = "NIK tidak ditemukan.";
      return;
    }
    state.user = res;
    await refreshUnreadCount();
    goToRoleMenu();
  } catch (err) {
    console.error(err);
    errEl.textContent = "Gagal terhubung ke server. Cek koneksi, atau setting deployment Apps Script (Who has access = Anyone).";
  }
}

// A person can have several capabilities at once (e.g. a Floor Supervisor is
// both a Staff who gets self-appraised AND a Leader who appraises their team).
// If only one screen applies, skip straight to it; otherwise show a picker.
function availableScreens(user) {
  const options = [];
  if (["Staff", "Leader", "Management"].indexOf(user.tier) !== -1) options.push({ key: "self", label: "Isi Appraisal — Diri Sendiri" });
  if (user.isLeader) options.push({ key: "myEvaluations", label: "Isi Appraisal — Staff Tim Saya" });
  if (user.isManagement) options.push({ key: "myEvaluations", label: "Isi Appraisal — Staff & Leader Area Saya" });
  if (user.isExecutive) options.push({ key: "myEvaluations", label: "Isi Appraisal — Management" });
  if (user.isHR) options.push({ key: "myEvaluations", label: "Isi Appraisal — Semua Tier (HR)" });
  if (user.isManagement) options.push({ key: "review", label: "Lihat Appraisal — Area Saya" });
  if (user.isHR) options.push({ key: "review", label: "Lihat Appraisal — Semua Staff" });
  if (user.isExecutive) options.push({ key: "gm", label: "Approve Appraisal — Semua Staff" });
  if (user.isHR) options.push({ key: "sc", label: "Input Service Charge — Bulanan" });
  // De-dupe (someone could have more than one flag pointing at the same key).
  const seen = new Set();
  return options.filter(o => {
    if (seen.has(o.key)) return false;
    seen.add(o.key);
    return true;
  });
}

function goToRoleMenu() {
  const options = availableScreens(state.user);
  if (options.length === 0) {
    app.innerHTML = topbar("Akses belum diatur") + `
      <div class="card">
        <div class="hint" style="font-size:14px;">
          NIK <strong>${state.user.staffId}</strong> (${state.user.name}) berhasil login, tapi belum ada akses
          apapun yang diaktifkan. Cek Job Title untuk NIK ini di HR Sheet — pastikan ada di Config_PositionMap
          dengan Tier yang sesuai.
        </div>
        <button class="secondary" onclick="logout()" style="margin-top:12px;">Kembali ke login</button>
      </div>`;
    return;
  }
  if (options.length === 1) {
    state.screen = options[0].key;
    render();
    return;
  }
  state.screen = "roleMenu";
  render();
}

function renderRoleMenu() {
  const options = availableScreens(state.user);
  app.innerHTML = topbar("Pilih menu") + `
    <div class="card">
      <div class="hint">${state.user.name} punya lebih dari satu akses:</div>
      ${options.map(o => `<div class="staff-row" onclick="goToScreen('${o.key}')"><div class="name">${o.label}</div></div>`).join("")}
    </div>`;
}

function goToScreen(key) {
  state.screen = key;
  render();
}

function logout() {
  state = { screen: "login", user: null, month: currentMonth(), targetStaff: null, kpiConfig: null, scores: {}, submissionCount: 0 };
  render();
}

// =================================================================
// My Evaluations — unified todo list for Leader / Management / Executive / HR.
// Each target already comes back from the backend with the correct `slot`
// (leader/hr) for THIS viewer, so the frontend doesn't need to know the
// tier rules itself.
// =================================================================
async function renderMyEvaluations() {
  app.innerHTML = topbar("Isi Appraisal") + `<div class="loading">Memuat daftar...</div>`;
  const res = await apiGet("getEvaluationTargets", { evaluatorId: state.user.staffId });
  if (res.error) {
    app.innerHTML = topbar("Isi Appraisal") + `<div class="card"><div class="error">${friendlyError(res.error)}</div></div>`;
    return;
  }
  const list = res.targets || [];
  list.sort((a, b) => {
    if (a.status === b.status) return a.name.localeCompare(b.name);
    return a.status === "Not started" ? -1 : 1;
  });
  const showMenuLink = availableScreens(state.user).length > 1;
  app.innerHTML = topbar("Isi Appraisal") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToScreen(\'roleMenu\')">&larr; Kembali ke menu</button>' : ""}
    ${list.length > 5 ? '<input type="text" placeholder="Cari nama..." oninput="filterList(this.value)" style="margin-bottom:10px;" />' : ""}
    <div class="hint">${list.length} orang — klik untuk isi appraisal</div>
    ${list.map(s => `
      <div class="staff-row" data-search="${escapeAttr(s.name.toLowerCase())}" onclick="openForm('${s.slot}', '${s.staffId}', '${escapeAttr(s.name)}', '${s.department}', '${s.tier}')">
        <div>
          <div class="name">${s.name} <span style="font-weight:700; font-size:11px; color:var(--coral); text-transform:uppercase;">· ${s.slot === "hr" ? "HR" : "Leader/Mgmt"}</span></div>
          <div class="dept">${s.department !== "-" ? s.department : s.tier} · ${s.tier}</div>
          <div class="dept" style="margin-top:4px; display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
            <span>${s.selfDone ? "✅" : "❌"} Self</span>
            <span style="color:var(--border);">|</span>
            <span>${s.leaderDone ? "✅" : "❌"} Leader/Mgmt</span>
            <span style="color:var(--border);">|</span>
            <span>${s.hrDone ? "✅" : "❌"} HR</span>
            <span style="color:var(--border);">|</span>
            <span>${s.executiveDone ? "✅" : "❌"} Executive</span>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="badge ${s.status === 'Submitted' ? 'done' : 'pending'}">${statusLabelID(s.status)}</span>
          ${s.slot === "hr" && s.leaderDone && s.status !== "Submitted" ? `
            <button class="secondary" style="font-size:11px; padding:6px 10px; white-space:nowrap;" onclick="event.stopPropagation(); copyLeaderToHr('${s.staffId}', '${escapeAttr(s.name)}')">Samakan dgn Leader/Mgmt</button>
          ` : ""}
        </div>
      </div>`).join("")}
    ${!list.length ? '<div class="hint">Tidak ada yang perlu di-appraisal saat ini.</div>' : ""}
  `;
}

function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

function filterList(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll("[data-search]").forEach(el => {
    el.style.display = el.dataset.search.includes(q) ? "" : "none";
  });
}

// =================================================================
// Review — read-only, scoped by Tier/Oversees (Management sees their
// area, HR & Executive see everyone). No approve buttons here; approval
// stays on the Executive-only GM dashboard.
// =================================================================
async function renderReview() {
  app.innerHTML = topbar("Lihat Appraisal") + `<div class="loading">Memuat data...</div>`;
  const res = await apiGet("getReviewData", { reviewerId: state.user.staffId });
  if (res.error) {
    app.innerHTML = topbar("Lihat Appraisal") + `<div class="card"><div class="error">${friendlyError(res.error)}</div></div>`;
    return;
  }
  const rows = res.rows || [];
  const showMenuLink = availableScreens(state.user).length > 1;
  const idr = n => "Rp " + Math.round(Number(n || 0)).toLocaleString("id-ID");

  app.innerHTML = topbar("Lihat Appraisal") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToScreen(\'roleMenu\')">&larr; Kembali ke menu</button>' : ""}
    ${rows.length > 5 ? '<input type="text" placeholder="Cari nama..." oninput="filterList(this.value)" style="margin-bottom:10px;" />' : ""}
    <div class="hint">${rows.length} appraisal record — read only</div>
    ${rows.map(r => `
      <div class="staff-row" data-search="${escapeAttr(r.name.toLowerCase())}" style="cursor:default;">
        <div>
          <div class="name">${r.name} <span style="font-weight:400; color:var(--text-muted);">(${r.department !== "-" ? r.department : r.tier})</span></div>
          <div class="dept">${r.month} · Self ${Number(r.selfTotal||0).toFixed(1)} · Leader ${Number(r.leaderTotal||0).toFixed(1)} · HR ${Number(r.hrTotal||0).toFixed(1)} · Final ${Number(r.finalScore||0).toFixed(1)}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
          <span class="badge ${r.status === 'Performer' ? 'performer' : 'underperform'}">${r.status}</span>
          <span class="badge ${r.approvalStatus === 'Approved' ? 'done' : 'pending'}">${statusLabelID(r.approvalStatus || 'Pending')}</span>
        </div>
      </div>`).join("")}
    ${!rows.length ? '<div class="hint">Belum ada data appraisal di scope kamu.</div>' : ""}
  `;
}

function openForm(evaluatorType, staffId, name, department, tier) {
  state.evaluatorType = evaluatorType;
  state.targetStaff = { staffId, name, department, tier };
  state.screen = "form";
  render();
}

async function copyLeaderToHr(staffId, name) {
  const ok = confirm(`Yakin mau samakan appraisal HR untuk ${name} dengan hasil Leader/Management?\n\nIni langsung submit tanpa isi form manual, dan cuma bisa dipakai 1x (sama seperti appraisal biasa).`);
  if (!ok) return;
  showToast("Menyalin...");
  const res = await apiPost("copyLeaderToHr", { staffId, evaluatorId: state.user.staffId });
  if (res.error || res.success === false) { showToast("Gagal: " + friendlyError(res.error || res.reason), "error"); return; }
  if (res.computeError) {
    console.error("computeEvaluatorTotal error:", res.computeError);
    showToast("Tersalin, TAPI ada error hitung skor: " + res.computeError.slice(0, 150), "error");
  } else {
    showToast(`Appraisal HR untuk ${name} disamakan dengan Leader/Management!`);
  }
  renderMyEvaluations();
}

// =================================================================
// Appraisal form (shared by Self / Leader / Management / Executive / HR)
// =================================================================
async function renderAppraisalForm({ evaluatorType, target }) {
  state.targetStaff = target; // always keep this in sync so submitForm can read it reliably
  const subtitle = `${target.department && target.department !== "-" ? target.department : ""}${target.tier ? (target.department && target.department !== "-" ? " · " : "") + target.tier + " tier" : ""}`;
  app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div><div class="loading">Memeriksa akses...</div>`;

  const access = await apiGet("checkAccess", { staffId: target.staffId, evaluatorType });
  if (access.error) {
    app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div>
      <div class="card"><div class="error">${friendlyError(access.error)}</div>
      <button class="secondary" onclick="goBack()">Kembali</button></div>`;
    return;
  }
  if (!access.allowed) {
    let msg;
    if (access.reason === "too_early") {
      msg = `Belum waktunya. Coba lagi mulai <strong>${access.retryDateLabel}</strong>.`;
    } else if (access.reason === "too_late") {
      msg = "Waktu untuk mengisi appraisal ini sudah lewat.";
    } else if (access.reason === "max_attempts_reached") {
      msg = `Appraisal ini sudah diisi ${access.submissionCount}× (maksimal ${access.submissionCount}×). Tidak bisa diisi ulang lagi. Hubungi HR kalau butuh koreksi.`;
    } else if (access.reason === "deferred_to_previous_cycle") {
      msg = "Kontrak staff ini berakhir terlalu awal bulan ini untuk siklus appraisal baru — keputusan appraisal bulan lalu yang berlaku untuk periode ini.";
    } else {
      msg = "Data kontrak untuk staff ini tidak ditemukan. Hubungi HR.";
    }
    app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div>
      <div class="card">
        <div class="hint" style="font-size:14px;">${msg}</div>
        <button class="secondary" onclick="goBack()" style="margin-top:12px;">Kembali</button>
      </div>`;
    return;
  }
  state.submissionCount = access.submissionCount || 0;

  app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div><div class="loading">Memuat form...</div>`;
  const cfg = await apiGet("getKpiConfigForTarget", { targetStaffId: target.staffId });
  if (cfg.error) {
    app.innerHTML = topbar("Appraisal — " + target.name) + `<div class="hint" style="margin:-10px 0 12px;">${subtitle}</div>
      <div class="card"><div class="error">${friendlyError(cfg.error)}</div>
      <button class="secondary" onclick="goBack()">Kembali</button></div>`;
    return;
  }
  state.kpiConfig = cfg;
  if (!state._preserveScores) state.scores = {};
  state._preserveScores = false;
  renderFormBody(evaluatorType, target, cfg);
}

function renderFormBody(evaluatorType, target, cfg) {
  state._totalCriteria = cfg.attitude.length + cfg.discipline.length + (cfg.placeholder ? 0 : cfg.kpi.length);

  const scoreRow = (criterion, desc) => `
    <div class="criterion-row" data-criterion="${escapeAttr(criterion)}">
      <div class="name">${criterion}</div>
      ${desc ? `<div class="desc">${desc}</div>` : ""}
      <div class="score-select">
        ${[1,2,3,4,5].map(v => `<div class="score-opt" onclick="selectScore(this, '${escapeAttr(criterion)}', ${v})">${v}</div>`).join("")}
      </div>
    </div>`;

  const bonusRow = (item, points, idx) => `
    <div class="criterion-row">
      <div class="name">${item} <span style="font-weight:600; color:${points > 0 ? "var(--green)" : "var(--red)"};">${points > 0 ? "+" : ""}${points} pts</span></div>
      <div class="row-flex" style="align-items:center;">
        <input type="number" min="0" class="bonus-count" data-idx="${idx}" value="0" style="margin-bottom:0; flex:0 0 80px;" />
        <input type="text" class="bonus-notes" data-idx="${idx}" placeholder="Evidence / notes (opsional)" style="margin-bottom:0;" />
      </div>
    </div>`;

  const isSelf = evaluatorType === "self";

  app.innerHTML = topbar("Appraisal — " + target.name) + `
    <div class="card">
      <div class="mode-banner mode-${evaluatorType}">
        <span class="mode-label">${evaluatorType === "self" ? "Self Appraisal" : evaluatorType === "hr" ? "HR Appraisal" : "Leader / Management Appraisal"}</span>
        <span class="mode-meta">${target.department !== "-" ? target.department : target.tier} · ${state.month}</span>
      </div>

      <div class="hint" style="background:var(--sand); padding:9px 12px; border-radius:10px; margin-bottom:8px;">
        Skor: <strong>1</strong> Sangat Kurang · <strong>2</strong> Kurang · <strong>3</strong> Cukup · <strong>4</strong> Baik · <strong>5</strong> Sangat Baik
      </div>
      <div class="hint" id="progress-counter" style="text-align:right; font-weight:700; color:var(--teal); margin-bottom:14px;"></div>

      <div class="section-title">Section A — Attitude</div>
      ${cfg.attitude.map(c => scoreRow(c.name, c.description)).join("")}

      <div class="section-title">Section B — Discipline</div>
      ${cfg.discipline.map(c => scoreRow(c.name, `Target: ${c.target}`)).join("")}

      <div class="section-title">Section C — Performance KPI</div>
      ${cfg.placeholder
        ? `<div class="hint" style="background:var(--sand); padding:12px; border-radius:8px;">${cfg.placeholderNote}</div>`
        : cfg.kpi.map(c => scoreRow(c.name, `Target: ${c.target}`)).join("")}

      ${isSelf ? "" : `
        <div class="section-title">Section D — Bonus &amp; Deduction</div>
        <div class="hint">Isi jumlah kejadian bulan ini. Biarkan 0 kalau tidak ada.</div>
        ${cfg.bonus.map((b, i) => bonusRow(b.item, b.points, i)).join("")}
      `}

      <div class="error" id="form-error"></div>
      <button class="primary" onclick="reviewBeforeSubmit('${evaluatorType}')" style="margin-top: 14px;">Submit Appraisal</button>
      <div class="center" style="margin-top: 10px;">
        <button class="ghost" onclick="cancelForm()">Batal</button>
      </div>
    </div>`;

  // Re-apply previously selected pills + bonus values (used when returning from the review screen).
  Object.keys(state.scores).forEach(criterion => {
    const row = app.querySelector(`.criterion-row[data-criterion="${CSS.escape(criterion)}"]`);
    if (!row) return;
    const val = state.scores[criterion];
    row.querySelectorAll(".score-opt").forEach(opt => {
      if (Number(opt.textContent) === val) opt.classList.add("selected");
    });
  });
  if (state._pendingBonusEntries) {
    state._pendingBonusEntries.forEach((b, i) => {
      const idx = cfg.bonus.findIndex(bc => bc.item === b.item);
      if (idx === -1) return;
      const countEl = document.querySelector(`.bonus-count[data-idx="${idx}"]`);
      const notesEl = document.querySelector(`.bonus-notes[data-idx="${idx}"]`);
      if (countEl) countEl.value = b.count;
      if (notesEl) notesEl.value = b.notes || "";
    });
  }
  updateProgressCounter();
}

function updateProgressCounter() {
  const el = document.getElementById("progress-counter");
  if (el) el.textContent = `${Object.keys(state.scores).length} dari ${state._totalCriteria} kriteria terisi`;
}

function selectScore(el, criterion, value) {
  const row = el.closest(".criterion-row");
  row.querySelectorAll(".score-opt").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  state.scores[criterion] = value;
  updateProgressCounter();
}

function renderDoneScreen() {
  app.innerHTML = topbar("Selesai") + `
    <div class="card" style="text-align:center;">
      <div style="font-size:40px; margin-bottom:8px;">✅</div>
      <h2>Appraisal tersimpan!</h2>
      <div class="hint" style="font-size:14px;">Jawaban Anda sudah tercatat dan akan diproses ke tahap berikutnya secara otomatis. Anda akan dapat notifikasi (🔔) kalau ada keputusan appraisal yang keluar. Tidak ada lagi yang perlu diisi bulan ini — terima kasih!</div>
      <button class="secondary" onclick="logout()" style="margin-top:16px;">Keluar</button>
    </div>`;
}

function goBack() {
  // Reuse the exact same routing logic as right after login — it already handles
  // 0 / 1 / multi available screens correctly for every role combination.
  goToRoleMenu();
}

function cancelForm() {
  if (Object.keys(state.scores).length > 0) {
    const ok = confirm("Jawaban yang sudah diisi akan hilang kalau keluar sekarang. Yakin mau keluar?");
    if (!ok) return;
  }
  state.scores = {};
  state._pendingBonusEntries = null;
  goBack();
}

function reviewBeforeSubmit(evaluatorType) {
  const cfg = state.kpiConfig;
  const kpiCriteria = cfg.placeholder ? [] : cfg.kpi.map(c => c.name);
  const allCriteria = [...cfg.attitude.map(c => c.name), ...cfg.discipline.map(c => c.name), ...kpiCriteria];
  const missing = allCriteria.filter(c => !(c in state.scores));
  if (missing.length) {
    document.getElementById("form-error").textContent = `Masih ada ${missing.length} kriteria yang belum diisi.`;
    return;
  }

  const bonusEntries = [];
  if (evaluatorType !== "self") {
    cfg.bonus.forEach((b, i) => {
      const countInput = document.querySelector(`.bonus-count[data-idx="${i}"]`);
      const count = Number(countInput ? countInput.value : 0) || 0;
      if (count > 0) {
        const notesInput = document.querySelector(`.bonus-notes[data-idx="${i}"]`);
        bonusEntries.push({ item: b.item, count, notes: notesInput ? notesInput.value : "" });
      }
    });
  }
  state._pendingBonusEntries = bonusEntries;

  const target = state.targetStaff;
  const sectionTable = (rows) => `<table class="mini">${rows.map(r => `<tr><td>${r.label}</td><td>${r.score}</td></tr>`).join("")}</table>`;

  app.innerHTML = topbar("Cek Jawaban — " + target.name) + `
    <div class="card">
      <div class="hint" style="font-size:14px; margin-bottom:14px;">Cek lagi jawaban di bawah sebelum kirim final. Appraisal ini <strong>cuma bisa dikirim 1 kali</strong> dan tidak bisa diubah lagi setelah terkirim.</div>

      <div class="section-title" style="margin-top:8px;">Section A — Attitude</div>
      ${sectionTable(cfg.attitude.map(c => ({ label: c.name, score: state.scores[c.name] })))}

      <div class="section-title">Section B — Discipline</div>
      ${sectionTable(cfg.discipline.map(c => ({ label: c.name, score: state.scores[c.name] })))}

      <div class="section-title">Section C — Performance KPI</div>
      ${cfg.placeholder
        ? `<div class="hint" style="background:var(--sand); padding:12px; border-radius:8px;">${cfg.placeholderNote}</div>`
        : sectionTable(kpiCriteria.map(c => ({ label: c, score: state.scores[c] })))}

      ${bonusEntries.length ? `
        <div class="section-title">Section D — Bonus &amp; Deduction</div>
        <table class="mini">${bonusEntries.map(b => `<tr><td>${b.item}</td><td>${b.count}×</td></tr>`).join("")}</table>
      ` : ""}

      <div class="row-flex" style="margin-top:16px;">
        <button class="secondary" onclick="backToEditForm('${evaluatorType}')">&larr; Kembali, Cek Lagi</button>
        <button class="primary" onclick="confirmAndSubmit('${evaluatorType}')">Ya, Kirim Sekarang</button>
      </div>
    </div>`;
}

function backToEditForm(evaluatorType) {
  state._preserveScores = true;
  renderFormBody(evaluatorType, state.targetStaff, state.kpiConfig);
}

async function confirmAndSubmit(evaluatorType) {
  try {
    const cfg = state.kpiConfig;
    const kpiCriteria = cfg.placeholder ? [] : cfg.kpi.map(c => c.name);
    const target = state.targetStaff;
    if (!target || !target.staffId) {
      showToast("Error internal: target appraisal tidak ditemukan. Coba kembali dan buka ulang form ini.", "error");
      return;
    }
    const payload = {
      staffId: target.staffId,
      evaluatorId: state.user.staffId,
      slot: evaluatorType,
      attitudeScores: cfg.attitude.map(c => ({ criterion: c.name, score: state.scores[c.name] })),
      disciplineScores: cfg.discipline.map(c => ({ criterion: c.name, score: state.scores[c.name] })),
      kpiScores: kpiCriteria.map(c => ({ criterion: c, score: state.scores[c] })),
      bonusEntries: state._pendingBonusEntries || [],
    };
    showToast("Menyimpan...");
    const res = await apiPost("submitAppraisal", payload);
    if (res.success) {
      if (res.computeError) {
        console.error("computeEvaluatorTotal error:", res.computeError);
        showToast("Tersimpan, TAPI ada error hitung skor: " + res.computeError.slice(0, 150), "error");
      } else {
        showToast(res.wasResubmission ? "Tersimpan! (menimpa submission sebelumnya)" : "Appraisal tersimpan!");
      }
      state.scores = {};
      state._pendingBonusEntries = null;
      if (evaluatorType !== "self") {
        // Came from "Tugas Appraisal Saya" — land back there directly so the person
        // can keep appraising the next staff quickly, instead of bouncing to the menu.
        renderMyEvaluations();
      } else {
        const options = availableScreens(state.user);
        if (options.length <= 1) {
          renderDoneScreen();
        } else {
          goBack();
        }
      }
    } else {
      showToast("Gagal menyimpan: " + friendlyError(res.error || res.reason), "error");
    }
  } catch (err) {
    console.error("confirmAndSubmit crashed:", err);
    showToast("Terjadi error tak terduga: " + err.message, "error");
  }
}

// =================================================================
// Executive Approval dashboard (approve only — no Service Charge here)
// =================================================================
async function renderGm() {
  app.innerHTML = topbar("Approve Appraisal") + `<div class="loading">Memuat data...</div>`;
  const final = await apiGet("getFinalAppraisal", { month: state.month });
  if (final.error) {
    app.innerHTML = topbar("Approve Appraisal") + `<div class="card"><div class="error">${friendlyError(final.error)}</div></div>`;
    return;
  }
  const list = final.staff || [];
  const idr = n => "Rp " + Math.round(Number(n || 0)).toLocaleString("id-ID");
  const showMenuLink = availableScreens(state.user).length > 1;

  // Decision options depend on the target's tier — fetch once per distinct tier present.
  const tiers = [...new Set(list.map(s => s.tier).filter(Boolean))];
  state.decisionOptionsByTier = state.decisionOptionsByTier || {};
  for (const t of tiers) {
    if (!state.decisionOptionsByTier[t]) {
      const res = await apiGet("getDecisionOptions", { tier: t });
      state.decisionOptionsByTier[t] = res.options || [];
    }
  }
  if (!state.oneOnOneOptions) {
    const oneOnOneRes = await apiGet("getOneOnOneOptions", {});
    state.oneOnOneOptions = oneOnOneRes.options || [];
  }

  if (!state.allPositionTitles) {
    const posRes = await apiGet("getAllPositionTitles", {});
    state.allPositionTitles = posRes.titles || [];
  }

  const decisionForm = (s) => {
    const opts = state.decisionOptionsByTier[s.tier] || [];
    return `
      <div id="decision-form-${s.staffId}" style="display:none; padding:12px; margin-top:8px; background:var(--sand); border-radius:12px;">
        <label>Decision (wajib)</label>
        <select id="decision-select-${s.staffId}" onchange="toggleDecisionExtras('${s.staffId}')">
          <option value="">— pilih —</option>
          ${opts.map(o => `<option value="${o.value}">${o.label}</option>`).join("")}
        </select>

        <div id="extend-fields-${s.staffId}" style="display:none;">
          <label>Berapa lama extend probation/kontrak-nya? (wajib)</label>
          <input type="text" id="extension-duration-${s.staffId}" placeholder="Contoh: 3 bulan" />
        </div>

        <div id="mutation-fields-${s.staffId}" style="display:none;">
          <label>Dari Posisi</label>
          <input type="text" value="${s.jobTitle || s.department || s.tier}" disabled style="background:var(--border); opacity:0.7;" />
          <label>Ke Posisi (wajib)</label>
          <select id="mutation-to-${s.staffId}">
            <option value="">— pilih —</option>
            ${state.allPositionTitles.map(t => `<option value="${t}">${t}</option>`).join("")}
          </select>
        </div>

        <label>1-on-1 Status (wajib)</label>
        <select id="oneonone-select-${s.staffId}">
          <option value="">— pilih —</option>
          ${state.oneOnOneOptions.map(o => `<option value="${o.value}">${o.label}</option>`).join("")}
        </select>
        <label>Catatan (wajib)</label>
        <textarea id="decision-notes-${s.staffId}" rows="2" style="width:100%; padding:10px; border:1.5px solid var(--border); border-radius:10px; font-family:inherit; font-size:14px;"></textarea>
        <button class="primary" style="margin-top:10px;" onclick="submitDecision('${s.staffId}')">Konfirmasi Approval</button>
      </div>`;
  };

  app.innerHTML = topbar("Approve Appraisal") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToScreen(\'roleMenu\')">&larr; Kembali ke menu</button>' : ""}
    <div class="card">
      <label>Bulan appraisal</label>
      <input type="month" id="month-picker" value="${state.month}" onchange="changeGmMonth(this.value)" />
      <div class="hint">Approval cuma bisa dilakukan tanggal 22–28 tiap bulan.</div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
        <h2 style="margin:0;">Appraisal — ${list.length} staff</h2>
        <button class="secondary" onclick="approveAll()">Approve Semua (kecuali yang di bawah standar) — default "Approved, Lanjut"</button>
      </div>
      ${list.length > 5 ? '<input type="text" placeholder="Cari nama..." oninput="filterList(this.value)" style="margin-bottom:10px;" />' : ""}
      ${list.map(s => `
        <div data-search="${escapeAttr(s.name.toLowerCase())}" style="border: 1.5px solid ${s.status === 'Underperform' ? 'var(--amber)' : 'var(--border)'}; border-radius:14px; padding:13px 14px; margin-bottom:8px;">
          <div class="staff-row" style="border:none; padding:0; margin:0; cursor:default;">
            <div style="display:flex; align-items:flex-start; gap:10px;">
              <img id="photo-${s.staffId}" alt="" style="width:44px; height:44px; border-radius:10px; object-fit:cover; background:var(--sand); flex-shrink:0; display:none; cursor:pointer;" onerror="this.style.display='none';" onclick="event.stopPropagation(); showPhotoModal(this.src, '${escapeAttr(s.name)}')" />
              <div id="photo-fallback-${s.staffId}" style="width:44px; height:44px; border-radius:10px; background:var(--sand); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--teal); font-size:16px;">${s.name.charAt(0)}</div>
              <div>
                <div class="name">${s.name} <span style="font-weight:400; color:var(--text-muted);">(${s.department !== "-" ? s.department : s.tier})</span></div>
                <div class="dept">Score ${Number(s.finalScore || 0).toFixed(1)}</div>
                <div class="dept" style="margin-top:2px;">Self ${Number(s.selfTotal || 0).toFixed(1)} · Leader/Mgmt ${Number(s.leaderTotal || 0).toFixed(1)} · HR ${Number(s.hrTotal || 0).toFixed(1)}</div>
                <div class="dept" style="margin-top:2px;">Dinilai Leader/Mgmt: <strong>${s.leaderEvaluatorName || "-"}</strong> · HR: <strong>${s.hrEvaluatorName || "-"}</strong></div>
                ${s.approvalStatus === 'Approved' && s.decision ? `<div class="dept" style="margin-top:4px;">Decision: <strong>${findLabel(state.decisionOptionsByTier[s.tier], s.decision)}</strong>${s.mutationToPosition ? ` (${s.mutationFromPosition} → ${s.mutationToPosition})` : ""}${s.extensionDuration ? ` (perpanjangan: ${s.extensionDuration})` : ""} · ${findLabel(state.oneOnOneOptions, s.oneOnOneStatus)}${s.decisionNotes ? " — " + s.decisionNotes : ""}</div>` : ""}
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="badge ${s.status === 'Performer' ? 'performer' : 'underperform'}">${s.status}</span>
              ${s.approvalStatus === 'Approved'
                ? `<span class="badge done">Disetujui</span>`
                : `<button class="secondary" onclick="toggleDecisionForm('${s.staffId}')">Approve</button>`}
            </div>
          </div>
          ${s.approvalStatus !== 'Approved' ? decisionForm(s) : ""}
        </div>`).join("")}
      ${!list.length ? '<div class="hint">Belum ada appraisal masuk untuk bulan ini — coba geser bulan di atas.</div>' : ""}
    </div>`;

  loadStaffPhotos(list.map(s => s.staffId));
}

async function loadStaffPhotos(staffIds) {
  for (const id of staffIds) {
    apiGet("getStaffPhoto", { staffId: id }).then(res => {
      const img = document.getElementById(`photo-${id}`);
      if (!img || !res.found) return;
      img.src = res.dataUri || res.url;
      img.style.display = "block";
      const fallback = document.getElementById(`photo-fallback-${id}`);
      if (fallback) fallback.style.display = "none";
    }).catch(() => {});
  }
}

function showPhotoModal(src, name) {
  const existing = document.getElementById("photo-modal");
  if (existing) existing.remove();
  const overlay = document.createElement("div");
  overlay.id = "photo-modal";
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px;";
  overlay.onclick = () => overlay.remove();
  overlay.innerHTML = `
    <div style="max-width:90%; max-height:90%; text-align:center;">
      <img src="${src}" alt="${name}" style="max-width:100%; max-height:80vh; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.5);" />
      <div style="color:#fff; margin-top:12px; font-weight:700;">${name}</div>
    </div>`;
  document.body.appendChild(overlay);
}

function toggleDecisionForm(staffId) {
  const el = document.getElementById(`decision-form-${staffId}`);
  if (el) el.style.display = el.style.display === "none" ? "block" : "none";
}

function toggleDecisionExtras(staffId) {
  const decision = document.getElementById(`decision-select-${staffId}`).value;
  const extendEl = document.getElementById(`extend-fields-${staffId}`);
  const mutationEl = document.getElementById(`mutation-fields-${staffId}`);
  if (extendEl) extendEl.style.display = decision === "extend_probation" ? "block" : "none";
  if (mutationEl) mutationEl.style.display = decision === "demotion_mutation" ? "block" : "none";
}

async function submitDecision(staffId) {
  const decision = document.getElementById(`decision-select-${staffId}`).value;
  const oneOnOneStatus = document.getElementById(`oneonone-select-${staffId}`).value;
  const notes = document.getElementById(`decision-notes-${staffId}`).value;
  if (!decision) { showToast("Decision wajib dipilih dulu.", "error"); return; }
  if (!oneOnOneStatus) { showToast("1-on-1 Status wajib dipilih dulu.", "error"); return; }
  if (!notes || !notes.trim()) { showToast("Catatan wajib diisi.", "error"); return; }

  const payload = { month: state.month, staffId, approvedBy: state.user.name, decision, oneOnOneStatus, notes };

  if (decision === "extend_probation") {
    const extensionDuration = document.getElementById(`extension-duration-${staffId}`).value;
    if (!extensionDuration || !extensionDuration.trim()) { showToast("Durasi extend wajib diisi.", "error"); return; }
    payload.extensionDuration = extensionDuration;
  }
  if (decision === "demotion_mutation") {
    const mutationToPosition = document.getElementById(`mutation-to-${staffId}`).value;
    if (!mutationToPosition) { showToast("Posisi tujuan mutasi wajib dipilih.", "error"); return; }
    payload.mutationToPosition = mutationToPosition;
  }

  const res = await apiPost("approveStaff", payload);
  if (res.error || res.success === false) { showToast("Gagal approve: " + friendlyError(res.error), "error"); return; }
  showToast("Approved! Notifikasi terkirim ke staff, leader, management, dan HR terkait.");
  renderGm();
}

// =================================================================
// Total Service Charge input — HR only
// =================================================================
async function renderScInput() {
  app.innerHTML = topbar("Input Service Charge") + `<div class="loading">Memuat data...</div>`;
  const pool = await apiGet("getScPool", { month: state.month });
  if (pool.error) {
    app.innerHTML = topbar("Input Service Charge") + `<div class="card"><div class="error">${friendlyError(pool.error)}</div></div>`;
    return;
  }
  const idr = n => "Rp " + Math.round(Number(n || 0)).toLocaleString("id-ID");
  const showMenuLink = availableScreens(state.user).length > 1;

  app.innerHTML = topbar("Input Service Charge") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToScreen(\'roleMenu\')">&larr; Kembali ke menu</button>' : ""}
    <div class="card">
      <label>Bulan</label>
      <input type="month" id="month-picker" value="${state.month}" onchange="changeGmMonth(this.value)" />
    </div>
    <div class="card">
      <h2>Total Service Charge — ${state.month}</h2>
      <label>Total SC bulan ini (Rp)</label>
      <input type="number" id="sc-input" value="${pool.found ? pool.totalSC : ""}" placeholder="150000000" />
      <button class="secondary" onclick="saveTotalSC()">Simpan Total SC</button>
      ${pool.found ? `
        <table class="mini" style="margin-top:12px;">
          <tr><td>Base share / staff</td><td>${idr(pool.baseShare)}</td></tr>
          <tr><td>Pool total</td><td>${idr(pool.poolTotal)}</td></tr>
          <tr><td># Performer</td><td>${pool.performerCount}</td></tr>
          <tr><td>Pool share / performer</td><td>${idr(pool.poolShare)}</td></tr>
        </table>` : ""}
    </div>`;
}

function changeGmMonth(value) {
  if (!value) return;
  state.month = value;
  renderGm();
}

async function saveTotalSC() {
  const val = document.getElementById("sc-input").value;
  if (!val) return;
  const res = await apiPost("setTotalSC", { month: state.month, totalSC: Number(val), inputBy: state.user.name });
  if (res.error) { showToast("Gagal simpan Total SC: " + friendlyError(res.error), "error"); return; }
  showToast("Total SC tersimpan!");
  renderScInput();
}
async function approveAll() {
  const res = await apiPost("approveAll", { month: state.month, approvedBy: state.user.name });
  if (res.error) { showToast("Gagal approve semua: " + friendlyError(res.error), "error"); return; }
  showToast(`${res.approvedCount || 0} appraisal ter-approve! Notifikasi terkirim.`);
  renderGm();
}

// =================================================================
render();
</script>
</body>
</html>
