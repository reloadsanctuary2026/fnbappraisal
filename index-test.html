<style>
  :root {
    --teal: #0E4749;
    --teal-dark: #082F31;
    --coral: #FF6B4A;
    --coral-dark: #E85535;
    --gold: #F2A65A;
    --bg: #FFF9F1;
    --card: #FFFFFF;
    --sand: #F5EBDC;
    --border: #EDE1D1;
    --text: #20302F;
    --text-muted: #6B5D4F;
    --green: #1A6B49;
    --green-bg: #E4F5EC;
    --red: #B8352B;
    --red-bg: #FDECEA;
    --amber: #946017;
    --amber-bg: #FBF0DE;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .topbar, .card { animation: fadeSlideIn 0.28s ease-out; }
  body {
    margin: 0;
    font-family: "Poppins", ui-rounded, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  #app { max-width: 720px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(120deg, var(--teal) 0%, var(--teal) 65%, var(--coral-dark) 130%);
    color: #fff; padding: 16px 18px; margin: -16px -16px 16px;
    border-radius: 0 0 20px 20px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 6px 16px rgba(14, 71, 73, 0.18);
  }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lang-toggle-pre-login { display: flex; gap: 2px; background: rgba(255,255,255,0.15); border-radius: 20px; padding: 3px; flex-shrink: 0; }
  .lang-toggle-pre-login button { border: none; background: transparent; color: rgba(255,255,255,0.8); font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 16px; cursor: pointer; }
  .lang-toggle-pre-login button.active { background: #fff; color: var(--teal-dark); }

  .topbar button {
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer;
    transition: background 0.15s ease; white-space: nowrap;
  }
  .topbar button:hover { background: rgba(255,255,255,0.24); }
  @media (max-width: 420px) {
    .topbar button { padding: 6px 9px; font-size: 11px; }
  }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px; margin-bottom: 14px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(32, 48, 47, 0.04);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 700; }
  .mode-banner {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;
    padding: 10px 14px; border-radius: 12px; margin-bottom: 16px;
  }
  .mode-banner .mode-label { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; }
  .mode-banner .mode-meta { font-size: 12px; opacity: 0.85; }
  .mode-banner.mode-self { background: var(--green-bg); color: var(--green); }
  .mode-banner.mode-leader { background: var(--amber-bg); color: var(--amber); }
  .mode-banner.mode-hr { background: #E8E3F5; color: #6C4FB6; }
  label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 11px 14px; font-size: 16px; border: 1.5px solid var(--border);
    border-radius: 12px; background: #fff; color: var(--text); margin-bottom: 14px;
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus { outline: none; border-color: var(--coral); }
  button.primary {
    width: 100%; padding: 13px; font-size: 14px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--coral), var(--gold)); border: none; border-radius: 14px;
    cursor: pointer; transition: transform 0.1s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 12px rgba(255, 107, 74, 0.28);
  }
  button.primary:hover { box-shadow: 0 6px 16px rgba(255, 107, 74, 0.36); }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.5; box-shadow: none; }
  button.secondary {
    padding: 9px 16px; font-size: 13px; border: 1.5px solid var(--border); font-weight: 600;
    background: #fff; border-radius: 12px; cursor: pointer; color: var(--text);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  button.secondary:hover { border-color: var(--coral); }
  button.secondary:active { transform: scale(0.97); }
  button.ghost { background: transparent; border: none; color: var(--teal); font-weight: 600; font-size: 13px; cursor: pointer; }

  .staff-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 14px; margin-bottom: 8px; cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
    background: #fff;
  }
  .staff-row:hover { border-color: var(--coral); background: #FFFCF8; }
  .clickable-card { transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease; }
  .clickable-card:hover { background: #FFFCF8; box-shadow: 0 3px 12px rgba(32,48,47,0.10); }
  .clickable-card:active { transform: scale(0.99); }
  .staff-row:active { transform: scale(0.99); }
  .staff-row .name { font-size: 14px; font-weight: 600; }
  .staff-row .dept { font-size: 12px; color: var(--text-muted); }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
  .badge.done { background: var(--green-bg); color: var(--green); }
  .badge.pending { background: var(--sand); color: var(--text-muted); }
  .badge.performer { background: var(--green-bg); color: var(--green); }
  .badge.underperform { background: var(--red-bg); color: var(--red); }

  .criterion-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .criterion-row:last-child { border-bottom: none; }
  .criterion-row .name { font-size: 13px; margin-bottom: 6px; font-weight: 600; }

async function apiGet(action, params = {}) {
  // Every doGet action now requires a valid session (except the pre-login handful:
  // checkNikExists/login/resumeSession/version) — see doGet() in the backend for why.
  // Attaching these here, in one place, means every existing apiGet(...) call across the
  // whole app automatically starts sending proof of identity without needing to touch each
  // call site individually.
  const fullParams = { ...params };
  if (state.user) {
    fullParams.sessionToken = state.user.sessionToken;
    fullParams.sessionStaffId = state.user.staffId;
  }
  const qs = new URLSearchParams({ action, ...fullParams }).toString();
  try {
    const res = await fetch(`${API_URL}?${qs}`);
    const json = await res.json();
    if (json.error === "session_expired") {
      showToast("Sesi kamu udah habis, login ulang ya.", "error");
      setTimeout(() => { state.user = null; renderLogin(); }, 1500);
    }
    return json;
  } catch (err) {
    console.error("apiGet failed:", action, err);
    return { error: "Gagal terhubung ke server (cek koneksi / setting deployment Apps Script)." };
  }
}

/** Wraps apiGet with automatic retries for the login flow specifically — Apps Script /
 *  Google Sheets can occasionally hiccup transiently (cold start, brief API blip), which
 *  looks like "NIK tidak ditemukan" even for a NIK that definitely exists. Instead of
 *  making the person notice and manually retry, this quietly retries a couple times first. */
async function apiGetWithRetry(action, params = {}, maxRetries = 2, shouldRetry) {
  shouldRetry = shouldRetry || ((res) => !!res.error || res.found === false);
  let lastRes = null;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    lastRes = await apiGet(action, params);
    if (!shouldRetry(lastRes)) return lastRes;
    if (attempt < maxRetries) {
      const errEl = document.getElementById("login-error");
      if (errEl) errEl.textContent = `Menghubungkan... (coba lagi ${attempt + 1}/${maxRetries})`;
      await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
    }
  }
  return lastRes;
}
async function apiPost(action, payload) {
  // NOTE: no explicit Content-Type header — keeps this a "simple request"
  // so the browser skips the CORS preflight, which Apps Script can't answer.
  const fullPayload = {
    ...payload,
    sessionToken: state.user ? state.user.sessionToken : null,
    sessionStaffId: state.user ? state.user.staffId : null,
  };
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, payload: fullPayload }) });
    const json = await res.json();
    if (json.error === "session_expired") {
      showToast("Sesi kamu udah habis, login ulang ya.", "error");
      setTimeout(() => { state.user = null; renderLogin(); }, 1500);
    }
    return json;
  } catch (err) {
    console.error("apiPost failed:", action, err);
    return { error: "Gagal terhubung ke server (cek koneksi / setting deployment Apps Script)." };
  }
}
function currentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;

function monthLabelID(monthKey) {
  const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  const [y, m] = String(monthKey).split("-");
  const idx = Number(m) - 1;
  return months[idx] ? `${months[idx]} ${y}` : monthKey;
}

function fullDateLabelID(dateInput) {
  const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
  if (isNaN(d.getTime())) return "-";
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function statusLabelID(status) {
  const map = { "Submitted": "Sudah Diisi", "Not started": "Belum Diisi", "Approved": "Disetujui", "Pending": "Menunggu" };
  return map[status] || status;
}

function findLabel(options, value) {
  const match = (options || []).find(o => o.value === value);
  return match ? match.label : (value || "-");

    notes_required: "Catatan belum diisi.",

    access_denied: "Akses ditolak.",
    max_attempts_reached: "Sudah pernah diisi, tidak bisa diisi ulang.",
    session_expired: "Sesi kamu udah habis, login ulang ya.",
    identity_mismatch: "Permintaan gak valid — coba refresh halaman dan login ulang.",
    pin_not_set: "PIN belum di-set. Hubungi HR.",
  };
  if (map[code]) return map[code];
  if (code && /lock/i.test(code)) return "Server lagi sibuk (banyak orang submit bersamaan) — tunggu beberapa detik lalu coba lagi.";
  return code || "Terjadi kendala tidak dikenal";
}

function showToast(message, type = "success") {
  const existing = document.getElementById("toast");
  if (existing) existing.remove();
  const el = document.createElement("div");
  el.id = "toast";
  el.className = `toast ${type}`;
  el.textContent = message;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 300);
  }, 2400);
}

function t(key) {
  const dict = translations[state.lang] || translations.id;
  return dict[key] !== undefined ? dict[key] : (translations.id[key] !== undefined ? translations.id[key] : key);
}

function setLanguage(lang) {
  state.lang = (lang === "en") ? "en" : "id";
  try { localStorage.setItem("appLang", state.lang); } catch (e) { /* localStorage unavailable — language just won't persist across reloads */ }
  // None of the PIN entry step, the business-unit picker, or the "TEST is closed" notice
  // are their own state.screen value — they're drawn directly, not routed through
  // render() — so toggling language while sitting on any of them needs to redraw THAT
  // screen specifically. Missing this for the closed-notice screen would have kicked
  // anyone who touched the language toggle there straight into the old TEST login flow,
  // defeating the entire point of shutting it down.
  if (TEST_ENV_CLOSED) {
    renderTestEnvClosedScreen();
  } else if (document.getElementById("business-unit-picker")) {
    renderBusinessUnitPicker();
  } else if (!state.user && document.getElementById("pin-code-input")) {
    showPinPrompt();
  } else {
    render();
  }
}

  _pendingBonusEntries: null,

let _isLoadingNotifications = false;
async function renderNotifications() {
  if (_isLoadingNotifications) return; // ignore rapid repeat clicks while a fetch is already in flight
  _isLoadingNotifications = true;
  try {
    app.innerHTML = topbar("Notifikasi") + `<div class="loading">Memuat...</div>`;
    const res = await apiGet("getNotifications", { staffId: state.user.staffId });
    if (res.error) {
      app.innerHTML = topbar("Notifikasi") + `<div class="card"><div class="error">${friendlyError(res.error)}</div></div>`;
      return;
    }
    const list = res.notifications || [];
    state.unreadCount = list.filter(n => !n.read).length;

  app.innerHTML = topbar("Notifikasi") + `
    <button class="ghost" onclick="goBackFromNotifications()">&larr; Kembali</button>
    <div class="hint" style="margin-top:8px;">${list.length} notifikasi</div>
    ${list.map(n => {
      // "Lupa PIN?" requests used to mean: HR opens the HR Sheet, clears the cell by hand,
      // switches to the Apps Script editor, runs generateRandomPins() for the WHOLE
      // roster, goes back to the Sheet to find the row again, copies the new PIN out to
      // message the person. This button collapses all of that into one click, right here.
      const isPinResetRequest = n.message.indexOf("minta reset PIN") !== -1;
      // Older notifications (created before this button existed) have the OLD manual
      // instructions baked right into the stored text ("...— hapus cell PIN mereka di HR
      // Sheet lalu jalankan generateRandomPins()."). Showing that verbatim next to a
      // "✅ Sudah direset." status is actively confusing — looks like there's still a
      // manual step outstanding. Cut the display off at the em dash for ANY pin-reset
      // notification (old or new wording alike) — the button/status below already says
      // everything that's actually needed, the instructional tail never needs to be seen.
      const displayMessage = isPinResetRequest ? n.message.split(" — ")[0] : n.message;
      return `
      <div class="staff-row" style="cursor:${n.read && !n.actionScreen ? "default" : "pointer"}; ${n.read ? "" : "border-color:var(--coral);"} ${isPinResetRequest ? "flex-direction:column; align-items:stretch; gap:8px;" : ""}" ${!isPinResetRequest && !n.read ? `onclick="markRead('${n.id}', '${n.actionScreen || ""}')"` : (!isPinResetRequest && n.actionScreen ? `onclick="navigateToScreen('${n.actionScreen}')"` : "")}>
        <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
          <div>
            <div class="name" style="font-weight:${n.read ? "500" : "700"};">${displayMessage}${n.actionScreen ? ' <span style="color:var(--teal); font-size:11px;">→ buka</span>' : ""}</div>
            <div class="dept">${fullDateLabelID(n.timestamp)} · ${monthLabelID(n.month)}</div>
          </div>
          ${n.read ? "" : `<span class="badge pending">Baru</span>`}
        </div>
        ${isPinResetRequest && !n.read ? `
          <button class="secondary" style="width:100%;" onclick="event.stopPropagation(); doResetStaffPin('${n.aboutStaffId}', '${n.id}', this)">🔑 Reset PIN Sekarang</button>
          <div id="pin-reset-result-${n.id}" style="font-size:13px;"></div>
        ` : ""}
        ${isPinResetRequest && n.read ? `<div class="hint" style="color:var(--green); font-weight:600;">✅ Sudah direset.</div>` : ""}
      </div>`;
    }).join("")}
    ${!list.length ? '<div class="hint">Belum ada notifikasi.</div>' : ""}
  `;
  } finally {
    _isLoadingNotifications = false;
  }
}

async function doResetStaffPin(staffId, notificationId, btnEl) {
  const resultEl = document.getElementById(`pin-reset-result-${notificationId}`);
  if (btnEl) btnEl.disabled = true;
  if (resultEl) { resultEl.textContent = "Memproses..."; resultEl.style.color = "var(--text-muted)"; }
  const res = await apiPost("resetStaffPin", { requesterId: state.user.staffId, staffId });
  if (res.error || res.success === false) {
    if (resultEl) { resultEl.textContent = "Gagal reset: " + friendlyError(res.error); resultEl.style.color = "var(--red)"; }
    if (btnEl) btnEl.disabled = false;
    return;
  }
  if (resultEl) {
    resultEl.innerHTML = `✅ PIN baru buat <strong>${res.staffName}</strong>: <strong style="font-size:17px; letter-spacing:3px;">${res.newPin}</strong><br><span style="font-size:11px; color:var(--text-muted);">Sampaikan PIN ini ke orangnya lewat WA/telpon ya — dia gak bisa lihat ini sendiri.</span>`;
    resultEl.style.color = "var(--green)";
  }
  if (btnEl) btnEl.remove();
  await apiPost("markNotificationRead", { notificationId });
}

async function markRead(id, actionScreen) {
  await apiPost("markNotificationRead", { notificationId: id });
  if (actionScreen) {

function chooseBusinessUnit(unitKey) {
  state.businessUnit = unitKey;
  try { localStorage.setItem("businessUnit", unitKey); } catch (e) { /* just won't be remembered next visit */ }
  renderLogin();
}

function changeBusinessUnit() {
  try { localStorage.removeItem("businessUnit"); } catch (e) { /* no-op */ }
  state.businessUnit = null;
  renderBusinessUnitPicker();
}

function renderBusinessUnitPicker() {
  const units = [
    { key: "fnb", label: "F&B", emoji: "🍽️" },
    { key: "gym", label: "Gym", emoji: "🏋️" },
    { key: "backoffice", label: "Back Office", emoji: "🏢" },
  ];
  app.innerHTML = `
    <div class="topbar"><div style="display:flex; align-items:center; gap:10px;"><div class="logo-mark"></div><h1>Reload Appraisal</h1></div>${langTogglePreLoginHtml()}</div>
    <div class="card" id="business-unit-picker">
      <h2>Pilih Unit Bisnis Kamu</h2>
      <div class="hint" style="margin-bottom:14px;">Ini cuma buat nampilin tampilan yang sesuai — proses login tetap sama, pakai NIK & PIN kamu seperti biasa.</div>
      ${units.map(u => `
        <button class="secondary" style="width:100%; margin-bottom:10px; padding:16px; font-size:15px; text-align:left; display:flex; align-items:center; gap:12px;" onclick="chooseBusinessUnit('${u.key}')">
          <span style="font-size:22px;">${u.emoji}</span> <span style="font-weight:700;">${u.label}</span>
        </button>`).join("")}
    </div>`;
}

function renderLogin() {
  app.innerHTML = `
    <div class="topbar"><div style="display:flex; align-items:center; gap:10px;"><div class="logo-mark"></div><h1>Reload ${businessUnitLabel()} Appraisal</h1></div>${langTogglePreLoginHtml()}</div>
    <div class="card">
      <h2>${t("login_title")}</h2>
      <label>${t("login_nik_label")}</label>
      <input type="text" id="nik-input" inputmode="numeric" placeholder="${t("login_nik_placeholder")}" maxlength="10" />
      <div class="error" id="login-error"></div>
      <button class="primary" id="login-step1-btn" onclick="doLoginStep1()">${t("login_continue")}</button>
      <button class="ghost" style="margin-top:8px; width:100%;" onclick="changeBusinessUnit()">Ganti Unit Bisnis (sekarang: ${businessUnitLabel()})</button>
    </div>`;
  document.getElementById("nik-input").focus();
  document.getElementById("nik-input").addEventListener("keydown", e => { if (e.key === "Enter") doLoginStep1(); });
}

async function doLoginStep1() {
  const nik = document.getElementById("nik-input").value.trim();
  if (!nik) return;
  const errEl = document.getElementById("login-error");
  const btn = document.getElementById("login-step1-btn");
  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = t("login_connecting");
  btn.style.opacity = "0.7";
  try {
    const res = await apiGetWithRetry("checkNikExists", { nik, businessUnit: state.businessUnit }, 2, (r) => r.error !== "wrong_business_unit" && (!!r.error || r.found === false));
    if (!res.found) {
      errEl.innerHTML = res.error === "wrong_business_unit"
        ? `NIK ini terdaftar di unit <strong>${res.actualUnitLabel}</strong>, bukan ${businessUnitLabel()}. <button class="ghost" style="display:inline-block; padding:4px 10px; font-size:12px; margin-left:4px;" onclick="changeBusinessUnit()">Ganti Unit</button>`
        : t("login_nik_not_found");
      return;
    }
    if (!res.hasPin) {
      // Used to skip straight into completeLogin(nik, "") here — meant anyone who knew a
      // NIK without a PIN yet set could get in with zero verification. Now blocked: no PIN
      // on file means no login, full stop, until HR sets one (same message + one-tap
      // request as the "Lupa PIN?" flow, so nothing new to remember).
      state._pendingNik = nik;
      errEl.innerHTML = `${t("login_pin_not_set")} <button class="ghost" style="display:inline-block; padding:4px 10px; font-size:12px; margin-left:4px;" onclick="doRequestPinReset()">${t("login_request_pin_btn")}</button>`;
      return;
    }
    state._pendingNik = nik;
    showPinPrompt();
  } catch (err) {
    console.error(err);
    errEl.textContent = t("login_server_error");
  } finally {
    btn.disabled = false;
    btn.textContent = t("login_continue");
    btn.style.opacity = "1";
  }
}

function showPinPrompt() {
  app.innerHTML = `
    <div class="topbar"><div style="display:flex; align-items:center; gap:10px;"><div class="logo-mark"></div><h1>Reload ${businessUnitLabel()} Appraisal</h1></div>${langTogglePreLoginHtml()}</div>
    <div class="card">
      <h2>${t("pin_title")}</h2>
      <label>${t("pin_label")}</label>
      <input type="password" id="pin-code-input" inputmode="numeric" maxlength="4" placeholder="••••" style="font-size:22px; letter-spacing:8px; text-align:center;" />
      <div class="error" id="login-error"></div>
      <button class="primary" id="login-step2-btn" onclick="doLoginStep2()">${t("pin_submit")}</button>
      <button class="ghost" style="margin-top:8px;" onclick="renderLogin()">${t("pin_change_nik")}</button>
      <button class="ghost" style="margin-top:4px;" onclick="doRequestPinReset()">${t("pin_forgot")}</button>
    </div>`;
  document.getElementById("pin-code-input").focus();
  document.getElementById("pin-code-input").addEventListener("keydown", e => { if (e.key === "Enter") doLoginStep2(); });
}

async function doRequestPinReset() {
  const errEl = document.getElementById("login-error");
  errEl.textContent = t("pin_sending_reset");
  const res = await apiPost("requestPinReset", { nik: state._pendingNik });
  if (res.error || res.success === false) {
    errEl.textContent = t("pin_reset_failed");
    return;
  }
  errEl.style.color = "var(--green)";
  errEl.textContent = t("pin_reset_sent");
}

async function doLoginStep2() {
  const pin = document.getElementById("pin-code-input").value.trim();
  const errEl = document.getElementById("login-error");
  if (!pin) { errEl.textContent = t("pin_required"); return; }
  await completeLogin(state._pendingNik, pin);
}

async function completeLogin(nik, pin) {
  const errEl = document.getElementById("login-error");
  const btn = document.getElementById("login-step2-btn");
  if (errEl) errEl.textContent = "";
  if (btn) { btn.disabled = true; btn.textContent = t("login_connecting"); btn.style.opacity = "0.7"; }
  try {
    const res = await apiGetWithRetry("login", { nik, pin, businessUnit: state.businessUnit }, 2, (r) => r.error !== "invalid_pin" && r.error !== "wrong_business_unit" && (!!r.error || r.found === false));
    if (!res.found) {
      if (errEl) {
        if (res.error === "wrong_business_unit") {
          errEl.innerHTML = `NIK ini terdaftar di unit <strong>${res.actualUnitLabel}</strong>, bukan ${businessUnitLabel()}. <button class="ghost" style="display:inline-block; padding:4px 10px; font-size:12px; margin-left:4px;" onclick="changeBusinessUnit()">Ganti Unit</button>`;
        } else {
          errEl.textContent = res.error === "invalid_pin" ? t("pin_wrong")
            : res.error === "pin_not_set" ? t("pin_not_set_short")
            : t("login_nik_not_found");
        }
      }
      return;
    }
    state.user = res;
    localStorage.setItem("appraisalSession", JSON.stringify({ token: res.sessionToken, staffId: res.staffId }));
    await refreshUnreadCount();
    goToRoleMenu();
  } catch (err) {
    console.error(err);
    if (errEl) errEl.textContent = t("login_server_error");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = t("pin_submit"); btn.style.opacity = "1"; }
  }
}

// A person can have several capabilities at once (e.g. a Floor Supervisor is
// both a Staff who gets self-appraised AND a Leader who appraises their team).
// If only one screen applies, skip straight to it; otherwise show a picker.
function availableScreensGrouped(user) {
  const groups = [];

  if (["Staff", "Leader", "Management"].indexOf(user.tier) !== -1) {
    groups.push({ name: "MyAppraisal", items: [
      { key: "self", label: t("menu_self") },
      { key: "history", label: t("menu_history") },
      { key: "myDevelopmentPlan", label: t("menu_dev_plan") },
    ]});
  }

  const teamItems = [];
  if (user.isLeader || user.isManagement || user.isExecutive) {
    teamItems.push({ key: "myEvaluations", label: user.appraiseLabel || t("menu_team_appraisal") });
  }
  if (user.isLeader || user.isManagement) {
    teamItems.push({ key: "review", label: t("menu_review_team") });
  }
  if (user.isExecutive) {
    teamItems.push({ key: "gm", label: t("menu_approve_final") });
  }
  if (user.isLeader || user.isManagement) {
    teamItems.push({ key: "trainingNeeds", label: t("menu_training_needs") });
  }
  if (teamItems.length) groups.push({ name: "MyTeams", items: teamItems });

  if (user.isExecutive) {
    groups.push({ name: "MyReport", items: [
      { key: "review", label: t("menu_review_all") },
      { key: "feedback", label: t("menu_read_feedback") },
      { key: "trainingNeeds", label: t("menu_training_needs") },
    ]});
  }

  if (user.isHR) {
    groups.push({ name: "MyHR", items: [
      { key: "myEvaluations", label: user.appraiseLabel || t("menu_appraise_all") },
      { key: "review", label: t("menu_review_all") },
      { key: "sc", label: t("menu_calc_sc") },
      { key: "feedback", label: t("menu_read_feedback") },
      { key: "trainingNeeds", label: t("menu_training_needs") },
    ]});
  }

  if (user.isAdminOperational) {
    groups.push({ name: "MyOperational", items: [
      { key: "historical", label: t("menu_input_historical") },
      { key: "review", label: t("menu_review_all") },
      { key: "feedback", label: t("menu_read_feedback") },
      { key: "trainingNeeds", label: t("menu_training_needs") },
    ]});
  }

  // "Pengaturan Akun" moved to a persistent topbar icon (⚙️), not a menu item — it's
  // universal and always-accessible, doesn't need to live inside role-specific menus.
  const settingsItems = [];
  if (user.hasStaffMappingAccess) {
    settingsItems.push({ key: "staffMapping", label: t("menu_staff_mapping") });
  }
  if (user.isHR || user.isExecutive || user.isAdminOperational) {
    settingsItems.push({ key: "kpiManagement", label: t("menu_manage_kpi") });
  }
  if (settingsItems.length) groups.push({ name: "MySettings", items: settingsItems });

  return groups;
}

function availableScreens(user) {
  const groups = availableScreensGrouped(user);
  const flat = [];
  const seen = new Set();
  groups.forEach(g => g.items.forEach(item => {
    if (!seen.has(item.key)) { seen.add(item.key); flat.push(item); }
  }));
  return flat;
}

function goToRoleMenu() {
  const options = availableScreens(state.user);
  if (options.length === 0) {
    app.innerHTML = topbar(t("menu_no_access_title")) + `
      <div class="card">
        <div class="hint" style="font-size:14px;">
          NIK <strong>${state.user.staffId}</strong> (${state.user.name}) ${t("menu_no_access_body")}
        </div>
        <button class="secondary" onclick="logout()" style="margin-top:12px;">${t("menu_back_to_login")}</button>
      </div>`;
    return;
  }
  // Always land on the hub (chart if self-eligible, plus grouped menu) — never auto-skip
  // straight into a single screen, so people can always see everything they have access to.
  state.screen = "dashboard";
  render();
}

function menuItemHtml(o) {
  const ACTION_KEYS = ["self", "myEvaluations", "gm", "sc", "historical", "trainingNeeds"];
  const isAction = ACTION_KEYS.indexOf(o.key) !== -1;
  const color = isAction ? "var(--coral)" : "var(--teal)";
  const tag = isAction ? t("menu_tag_action") : t("menu_tag_view");
  const bg = isAction ? "var(--red-bg)" : "var(--green-bg)";
  return `
    <div class="staff-row" style="border-left: 4px solid ${color};" onclick="goToScreen('${o.key}')">
      <div class="name">${o.label}</div>
      <span class="badge" style="background:${bg}; color:${color};">${tag}</span>
    </div>`;
}

function renderRoleMenu() {
  const options = availableScreens(state.user);
  app.innerHTML = topbar(t("menu_pick_title")) + `
    <div class="card">
      <div class="hint">${state.user.name} punya lebih dari satu akses:</div>
      ${options.map(menuItemHtml).join("")}
    </div>`;
}

async function renderDashboard() {
  app.innerHTML = topbar("Dashboard Saya") + `<div class="loading">Memuat...</div>`;

            <div style="color:rgba(255,255,255,0.75); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Skor Appraisal Saya</div>

    } else if (history.length === 1) {
      chartBlock = `
        <div class="card" style="background:linear-gradient(135deg, var(--teal), var(--teal-dark)); border:none; text-align:center;">
          <div style="color:rgba(255,255,255,0.75); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Skor Bulan ${history[0].month}</div>
          <div style="color:#fff; font-size:36px; font-weight:800; margin-top:4px;">${Number(history[0].finalScore || 0).toFixed(1)}</div>
          <div style="color:rgba(255,255,255,0.7); font-size:12px; margin-top:6px;">Grafik akan muncul begitu ada 2 bulan data atau lebih.</div>
        </div>`;
    } else {
      chartBlock = `<div class="card"><div class="hint">Belum ada riwayat skor — grafik akan muncul begitu appraisal pertamamu selesai diproses.</div></div>`;
    }
  }

  const groupColors = {
    MyAppraisal: { accent: "var(--teal)", light: "#E4F0EF" },
    MyTeams: { accent: "var(--coral)", light: "#FFE9E3" },
    MyReport: { accent: "#B36B00", light: "#FBF0DE" },
    MyHR: { accent: "#6C4FB6", light: "#EEE8F7" },
  };

  app.innerHTML = topbar("Dashboard Saya") + chartBlock +
    groups.map((g, gi) => {
      const color = groupColors[g.name] || groupColors.MyAppraisal;
      const groupId = `group-${gi}`;
      const soleGroup = groups.length === 1;

          return `

              <div class="name">${item.label}</div>

      if (soleGroup) {

        return `

}

function toggleGroup(id) {
  const el = document.getElementById(id);
  const chevron = document.getElementById(id + "-chevron");
  if (!el) return;
  const isOpen = el.style.display === "block";
  el.style.display = isOpen ? "none" : "block";
  if (chevron) chevron.style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
}

function goToScreen(key) {
  state.screen = key;
  render();
}

function logout() {
  // Best-effort — invalidate the session server-side too, not just this device's local
  // copy, so the token can't be replayed elsewhere for the rest of its 8-hour window. Not
  // awaited: logging out should feel instant, and if this fails (e.g. offline), the token
  // just expires naturally on its own later — nothing breaks either way. Must fire BEFORE
  // state.user is cleared below, since apiPost reads the session token from state.user.
  apiPost("logout", {}).catch(() => {});
  localStorage.removeItem("appraisalSession");
  state = { screen: "login", user: null, month: currentMonth(), targetStaff: null, kpiConfig: null, scores: {} };
  render();
}

// =================================================================
// My Evaluations — unified todo list for Leader / Management / Executive / HR.
// Each target already comes back from the backend with the correct `slot`
// (leader/hr) for THIS viewer, so the frontend doesn't need to know the
// tier rules itself.
// =================================================================
async function renderMyEvaluations() {
  app.innerHTML = topbar(state.user.appraiseLabel || "Team Appraisal") + `<div class="loading">Memuat daftar...</div>`;
  const res = await apiGet("getEvaluationTargets", { evaluatorId: state.user.staffId });
  if (res.error) {
    app.innerHTML = topbar(state.user.appraiseLabel || "Team Appraisal") + `<div class="card"><div class="error">${friendlyError(res.error)}</div></div>`;
    return;
  }
  const list = res.targets || [];
  list.sort((a, b) => {
    if (a.status === b.status) return a.name.localeCompare(b.name);
    return a.status === "Not started" ? -1 : 1;
  });
  const showMenuLink = availableScreens(state.user).length > 1;
  app.innerHTML = topbar(state.user.appraiseLabel || "Team Appraisal") + `
    ${showMenuLink ? '<button class="ghost" onclick="goToRoleMenu()">&larr; Kembali ke menu</button>' : ""}
    <input type="text" placeholder="Cari nama..." oninput="updateMyEvalFilter('search', this.value)" style="margin-bottom:10px;" />
    <div class="row-flex" style="margin-bottom:10px;">
      <select onchange="sortMyEvalList(this.value)">
        <option value="">Urutkan...</option>
        <option value="name-asc">Nama (A-Z)</option>
        <option value="name-desc">Nama (Z-A)</option>
      </select>
      <select onchange="updateMyEvalFilter('department', this.value)">
        <option value="">Semua Department</option>
        ${[...new Set(list.map(s => s.department !== "-" ? s.department : s.tier))].sort().map(d => `<option value="${escapeAttr(d)}">${d}</option>`).join("")}
      </select>
    </div>
    <button class="secondary" id="myeval-notdone-btn" onclick="toggleMyEvalFilterBtn('notDoneOnly', 'myeval-notdone-btn')" style="margin-bottom:10px;">Belum Diisi Saja</button>
    <div class="hint">${list.length} orang — klik untuk isi appraisal</div>
    <div id="myeval-list-container">
    ${list.map(s => `
      <div class="staff-row" data-search="${escapeAttr(s.name.toLowerCase())}" data-department="${escapeAttr(s.department !== "-" ? s.department : s.tier)}" data-mystatus="${s.status}" data-name="${escapeAttr(s.name)}" onclick="openForm('${s.slot}', '${s.staffId}', '${escapeAttr(s.name)}', '${s.department}', '${s.tier}')">
        <div>
          <div class="name">${s.name} <span style="font-weight:700; font-size:11px; color:var(--coral); text-transform:uppercase;">· ${s.slot === "hr" ? "HR" : "Leader/Mgmt"}</span></div>
          <div class="dept">${s.department !== "-" ? s.department : s.tier} · ${s.tier}</div>
          <div class="dept" style="margin-top:4px; display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
            <span>${s.selfDone ? "✅" : "❌"} Self</span>
            <span style="color:var(--border);">|</span>
            <span>${s.leaderDone ? "✅" : "❌"} Leader/Mgmt</span>
            <span style="color:var(--border);">|</span>
            <span>${s.hrDone ? "✅" : "❌"} HR</span>
            <span style="color:var(--border);">|</span>
            <span>${s.executiveDone ? "✅" : "❌"} Executive</span>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="badge ${s.status === 'Submitted' ? 'done' : 'pending'}">${statusLabelID(s.status)}</span>
          ${s.slot === "hr" && s.leaderDone && s.status !== "Submitted" ? `
            <button class="secondary" style="font-size:11px; padding:6px 10px; white-space:nowrap;" onclick="event.stopPropagation(); copyLeaderToHr('${s.staffId}', '${escapeAttr(s.name)}')">Samakan dgn Leader/Mgmt</button>
          ` : ""}
        </div>
      </div>`).join("")}
    </div>
    ${!list.length ? '<div class="hint">Tidak ada yang perlu di-appraisal saat ini.</div>' : ""}
  `;
  state._myEvalFilters = { search: "", department: "", notDoneOnly: false };
}

function toggleMyEvalFilterBtn(filterKey, btnId) {
  const btn = document.getElementById(btnId);
  const isActive = btn.dataset.active === "true";
  btn.dataset.active = isActive ? "false" : "true";
  btn.style.background = isActive ? "" : "var(--coral)";
  btn.style.color = isActive ? "" : "#fff";
  btn.style.borderColor = isActive ? "" : "var(--coral)";
  updateMyEvalFilter(filterKey, !isActive);
}

function updateMyEvalFilter(key, value) {
  state._myEvalFilters = state._myEvalFilters || {};
  state._myEvalFilters[key] = value;
  const f = state._myEvalFilters;
  document.querySelectorAll("#myeval-list-container [data-search]").forEach(el => {
    let show = true;
    if (f.search && !el.dataset.search.includes(f.search.toLowerCase())) show = false;
    if (f.department && el.dataset.department !== f.department) show = false;
    if (f.notDoneOnly && el.dataset.mystatus === "Submitted") show = false;
    el.style.display = show ? "" : "none";
  });
}

function sortMyEvalList(criteria) {
  if (!criteria) return;
  const container = document.getElementById("myeval-list-container");
  if (!container) return;
  const cards = Array.from(container.children);
  cards.sort((a, b) => {
    if (criteria === "name-asc") return a.dataset.name.localeCompare(b.dataset.name);
    if (criteria === "name-desc") return b.dataset.name.localeCompare(a.dataset.name);
    return 0;
  });
  cards.forEach(c => container.appendChild(c));
}


// Escapes text for safe embedding inside a single-quoted JS string literal within an
// onclick="..." HTML attribute. Previously only escaped ' — but rubric text stored with
// real line breaks between "Skor 1 = ...", "Skor 3 = ...", "Skor 5 = ..." would leave a
// RAW newline sitting inside that JS string literal, which is a syntax error (only
// backtick template literals allow literal newlines). The browser silently swallows that
// parse error, so clicking the button just... does nothing — exactly what looked like a
// broken "Edit" button on any criterion with a real multi-line rubric filled in.
function escapeAttr(s) {
  return String(s)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");
}

/** Shared performer/underperform badge — was being hand-written with the same ternary in
 *  5+ different screens (Review, Approval, Compliance, etc.). isPerformer decides the
 *  color, label is whatever text should actually show (the word "Performer", or a raw
 *  score number, or anything else — kept separate so this works for both cases). */
function statusBadge(isPerformer, label) {
  return `<span class="badge ${isPerformer ? "performer" : "underperform"}">${label}</span>`;
}

/** Shared "row of toggle buttons" — was being hand-built separately in Review's 3-way
 *  view switcher and Manage KPI Criteria's section switcher, same pattern (active tab =
 *  primary button, rest = secondary) just written out twice. tabs = [{key, label}], the
 *  caller decides which tabs to include (e.g. hiding "Compliance" for roles without
 *  access) before passing the array in — this function just renders whatever it's given. */
function tabSwitcher(tabs, activeKey, onClickFnName) {
  return `
    <div class="row-flex" style="margin-bottom:4px;">
      ${tabs.map(t => `<button class="${activeKey === t.key ? "primary" : "secondary"}" style="flex:1;" onclick="${onClickFnName}('${t.key}')">${t.label}</button>`).join("")}
    </div>`;
}

async function doUploadPhoto() {
  const fileInput = document.getElementById("photo-file-input");
  const file = fileInput.files[0];
  if (!file) return;
  const noteEl = document.getElementById("photo-upload-note");

  if (!file.type.startsWith("image/")) {
    noteEl.textContent = "File harus berupa gambar (JPG/PNG).";
    noteEl.style.color = "var(--red)";
    return;
  }

  noteEl.textContent = "Memproses foto...";
  noteEl.style.color = "var(--text-muted)";

  try {
    // Resize client-side before upload — keeps the payload small/fast regardless of how
    // big the original photo from a phone camera is (often several MB).
    const resizedBase64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 600;
          let { width, height } = img;
          if (width > height && width > maxDim) { height *= maxDim / width; width = maxDim; }
          else if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", 0.85).split(",")[1]);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    noteEl.textContent = "Mengupload...";
    const res = await apiPost("uploadOwnPhoto", { staffId: state.user.staffId, base64Data: resizedBase64, mimeType: "image/jpeg" });
    if (res.error || res.success === false) {
      noteEl.textContent = "Gagal upload: " + friendlyError(res.error);
      noteEl.style.color = "var(--red)";
      return;
    }
    noteEl.textContent = "✅ Foto berhasil diganti!";
    noteEl.style.color = "var(--green)";
    renderSettings();
  } catch (err) {
    noteEl.textContent = "Gagal memproses foto — coba file lain.";
    noteEl.style.color = "var(--red)";
  }
}

async function doChangeOwnPin() {
  const currentPin = document.getElementById("current-pin-input").value;
  const newPin = document.getElementById("new-pin-input").value;
  const confirmPin = document.getElementById("confirm-pin-input").value;
  const noteEl = document.getElementById("change-pin-note");

  if (!currentPin) { noteEl.textContent = "PIN Sekarang wajib diisi."; noteEl.style.color = "var(--red)"; return; }
  if (!newPin) { noteEl.textContent = "PIN Baru wajib diisi."; noteEl.style.color = "var(--red)"; return; }
  if (!confirmPin) { noteEl.textContent = "Ulangi PIN Baru wajib diisi."; noteEl.style.color = "var(--red)"; return; }
  if (!/^\d{4}$/.test(newPin)) { noteEl.textContent = "PIN baru harus 4 digit angka."; noteEl.style.color = "var(--red)"; return; }
  if (newPin !== confirmPin) { noteEl.textContent = "PIN baru dan ulangannya gak sama."; noteEl.style.color = "var(--red)"; return; }

  const confirmed = confirm(`Yakin ganti PIN jadi ${newPin}?\n\nCatat/hafalin dulu sebelum lanjut — PIN ini yang bakal dipakai buat login berikutnya.`);
  if (!confirmed) { noteEl.textContent = ""; return; }

  noteEl.textContent = "Menyimpan...";
  noteEl.style.color = "var(--text-muted)";
  const res = await apiPost("changeOwnPin", { staffId: state.user.staffId, currentPin, newPin });
  if (res.error || res.success === false) {
    noteEl.textContent = res.error === "invalid_pin" ? "PIN sekarang salah." : "Gagal ganti PIN: " + friendlyError(res.error);
    noteEl.style.color = "var(--red)";
    return;
  }
  noteEl.textContent = "✅ PIN berhasil diganti! Dipakai mulai login berikutnya.";
  noteEl.style.color = "var(--green)";
  document.getElementById("current-pin-input").value = "";
  document.getElementById("new-pin-input").value = "";
  document.getElementById("confirm-pin-input").value = "";
}

let _isLoadingKpiManagement = false;
function kpiCoverageSummary(res) {
  const withOwnCriteria = [];
  const coveredByFallback = [];
  const realGaps = [];

  res.allPositionKeys.forEach(k => {
    const isDept = (res.departmentKeys || []).indexOf(k) !== -1;
    const hasOwn = res.kpiByPosition[k] && res.kpiByPosition[k].length;
    const label = k + (isDept ? " (Department)" : "");

    if (hasOwn) {
      withOwnCriteria.push(`${label} — ${res.kpiByPosition[k].length} criteria`);
    } else if (isDept) {
      realGaps.push(`${label} — no one in this department has any KPI coverage`);
    } else {
      const fallbackDept = (res.staffTitleToDepartment || {})[k];
      const deptHasCriteria = fallbackDept && res.kpiByPosition[fallbackDept] && res.kpiByPosition[fallbackDept].length;
      if (deptHasCriteria) {
        coveredByFallback.push(`${label} — automatically uses ${fallbackDept} criteria (${res.kpiByPosition[fallbackDept].length})`);
      } else {
        realGaps.push(`${label}${fallbackDept ? ` — ${fallbackDept} department also has no criteria` : ""}`);
      }
    }
  });

  const detailsBlock = (title, color, items, emptyText) => `
    <details style="margin-bottom:8px;">
      <summary style="cursor:pointer; padding:10px 14px; border-radius:10px; background:${color}; color:#fff; font-weight:700; font-size:13px; list-style:none;">${title}</summary>
      <div style="padding:10px 4px;">
        ${items.length ? `<ul style="margin:0; padding-left:20px; font-size:13px; line-height:1.8;">${items.map(x => `<li>${x}</li>`).join("")}</ul>` : `<div class="hint">${emptyText}</div>`}
      </div>
    </details>`;

  return `
    <div class="card">
      <h2>📋 KPI Coverage Summary</h2>
      ${detailsBlock(`✅ Has Dedicated Criteria (${withOwnCriteria.length})`, "linear-gradient(90deg, var(--green), #0f7a4f)", withOwnCriteria, "None yet.")}
      ${detailsBlock(`🔄 Covered via Department Fallback (${coveredByFallback.length})`, "linear-gradient(90deg, var(--teal), var(--teal-dark))", coveredByFallback, "None.")}
      ${detailsBlock(`🚨 Needs Attention (${realGaps.length})`, "linear-gradient(90deg, var(--red), #8a2318)", realGaps, "No gaps — every position that needs KPI already has coverage (dedicated or fallback).")}
    </div>`;
}

          if (isDept) {
            tag = " — semua Job Title di department ini";
            countLabel = hasOwn ? `${res.kpiByPosition[k].length} kriteria` : "belum ada kriteria — GAP BENERAN";
          } else {

            if (hasOwn) {
              tag = "";
              countLabel = `${res.kpiByPosition[k].length} kriteria khusus`;
            } else if (fallbackDept) {
              tag = ` — otomatis pakai kriteria ${fallbackDept}`;
              countLabel = "gak ada kriteria khusus, TAPI AMAN (fallback)";
            } else {
              tag = "";
              countLabel = "belum ada kriteria — GAP BENERAN";
            }
          }
          return `<option value="${escapeAttr(k)}" ${k === position ? "selected" : ""}>${k}${tag} (${countLabel})</option>`;

      </select>
      ${items.map(c => kpiCriterionRow("kpi", c.rowIndex, c.name, c.howToMeasure, c.target, position, c.rubric)).join("")}

  app.innerHTML = topbar("Manage KPI Criteria") + `

    <div class="card">
      <h2>Kriteria yang Ada</h2>
      ${listHtml}

    ${state._kpiFormOpen ? `
    <div class="card">
      <h2>${state._kpiFormEditing ? "✏️ Edit Kriteria" : "+ Tambah Kriteria Baru"}</h2>
      ${addFormHtml}

  `;

/** Soft nudge, not a hard block — rubrik is optional, so this never prevents saving. Just
 *  flags the most common low-effort patterns (too short, or clearly no real content) so
 *  whoever's filling it in notices before they move on, without being forced into a rigid
 *  format that might not fit every criterion. */
function checkRubricQuality() {
  const warningEl = document.getElementById("kpi-form-rubric-warning");
  if (!warningEl) return;
  const s1 = (document.getElementById("kpi-form-rubric-1") || {}).value || "";
  const s3 = (document.getElementById("kpi-form-rubric-3") || {}).value || "";
  const s5 = (document.getElementById("kpi-form-rubric-5") || {}).value || "";
  const filledCount = [s1, s3, s5].filter(v => v.trim()).length;

  if (filledCount === 0) { warningEl.textContent = ""; return; }
  if (filledCount === 1) {
    warningEl.textContent = "⚠️ Baru 1 level yang keisi — idealnya minimal Skor 1 & Skor 5 (2 titik ekstrem) biar ada pembanding jelas.";
    warningEl.style.color = "var(--coral)";
  } else {
    warningEl.textContent = "✅ Kelihatan cukup jelas.";
    warningEl.style.color = "var(--green)";
  }
}

/** Combines the 3 structured score fields into the single text blob the Sheet actually
 *  stores — keeps the storage format unchanged (one rubric string) while the editing
 *  experience itself is now guided/structured, not free-text. */
function buildRubricText() {
  const s1 = (document.getElementById("kpi-form-rubric-1") || {}).value.trim();
  const s3 = (document.getElementById("kpi-form-rubric-3") || {}).value.trim();
  const s5 = (document.getElementById("kpi-form-rubric-5") || {}).value.trim();
  const parts = [];
  if (s1) parts.push(`Skor 1 = ${s1}`);
  if (s3) parts.push(`Skor 3 = ${s3}`);
  if (s5) parts.push(`Skor 5 = ${s5}`);
  return parts.join("\n");
}

/** Reverse of buildRubricText — splits an existing rubric string back into the 3 fields
 *  when opening it for editing. Falls back gracefully (puts the whole thing in the Skor 1
 *  field) if the text doesn't match the expected "Skor N = ..." pattern, e.g. rubrik
 *  written before this structured form existed. */
function parseRubricText(text) {
  const result = { 1: "", 3: "", 5: "" };
  if (!text) return result;
  const regex = /Skor\s*(\d)\s*=\s*(.+?)(?=\n?Skor\s*\d\s*=|$)/gis;
  let match, matchedAny = false;
  while ((match = regex.exec(text)) !== null) {
    const level = match[1];
    if (result[level] !== undefined) { result[level] = match[2].trim(); matchedAny = true; }
  }
  if (!matchedAny) result[1] = text; // old free-text rubric — preserve it, don't lose data
  return result;
}

  state._kpiFormOpen = true;

async function doSaveKpiCriterion() {
  const section = document.getElementById("kpi-form-section").value;
  const rowIndex = document.getElementById("kpi-form-row-index").value;
  const name = document.getElementById("kpi-form-name").value.trim();
  const field2El = document.getElementById("kpi-form-field2");
  const field3El = document.getElementById("kpi-form-field3");
  const positionEl = document.getElementById("kpi-form-position");
  const noteEl = document.getElementById("kpi-mgmt-note");

  if (!name) { noteEl.textContent = "Nama kriteria wajib diisi."; noteEl.style.color = "var(--red)"; return; }

  noteEl.textContent = "Menyimpan...";
  noteEl.style.color = "var(--text-muted)";
  const payload = {
    requesterId: state.user.staffId, section, name,
    field2: field2El ? field2El.value.trim() : "",
    field3: field3El ? field3El.value.trim() : "",
    rubric: buildRubricText(),
  };
  if (rowIndex) payload.rowIndex = Number(rowIndex);
  if (positionEl) payload.positionKey = positionEl.value;

  const res = await apiPost("saveKpiCriterion", payload);
  if (res.error || res.success === false) {
    noteEl.textContent = "Gagal simpan: " + friendlyError(res.error);
    noteEl.style.color = "var(--red)";
    return;
  }
  showToast(rowIndex ? "Kriteria berhasil diperbarui!" : "Kriteria baru berhasil ditambahkan!");
  state._kpiFormOpen = false;
  state._kpiFormEditing = false;
  renderKpiManagement();
}

function staffMappingOutsideClickHandler(e) {
  if (e.target.closest(".superior-ms")) return;
  document.querySelectorAll(".superior-ms-panel").forEach(p => p.classList.add("hidden"));
}
/** Panels used to be position:absolute relative to their trigger, which looked fine until
 *  a row near the bottom of a .card opened one — .card has overflow:hidden (for its
 *  rounded corners), which silently clipped the panel instead of letting it show fully.
 *  Fixed positioning computed from the trigger's actual on-screen rect escapes that
 *  clipping entirely (fixed elements aren't contained by an ancestor's overflow), and lets
 *  the panel flip to open UPWARD instead of down when there isn't enough room below. */

function toggleSuperiorPanel(domId) {
  const panel = document.getElementById(`panel-${domId}`);
  const trigger = document.getElementById(`trigger-${domId}`);
  if (!panel || !trigger) return;
  const willOpen = panel.classList.contains("hidden");
  document.querySelectorAll(".superior-ms-panel").forEach(p => p.classList.add("hidden"));
  if (!willOpen) return;

  const rect = trigger.getBoundingClientRect();
  const panelWidth = Math.min(Math.max(rect.width, 220), 320);
  let left = rect.left;
  const maxLeft = window.innerWidth - panelWidth - 8;
  if (left > maxLeft) left = Math.max(8, maxLeft);

  const assumedPanelHeight = 260; // matches the CSS max-height cap
  const spaceBelow = window.innerHeight - rect.bottom;
  const openUpward = spaceBelow < assumedPanelHeight + 12 && rect.top > assumedPanelHeight;

  panel.style.left = `${left}px`;
  panel.style.width = `${panelWidth}px`;
  panel.style.top = openUpward ? "" : `${rect.bottom + 4}px`;
  panel.style.bottom = openUpward ? `${window.innerHeight - rect.top + 4}px` : "";
  panel.classList.remove("hidden");
}

/** Fires on ANY checkbox change within one of a row's (up to 2) applicable checklist
 *  columns — reads every currently-checked box across all of that row's columns (they're
 *  grouped by data-row-staffid) and saves the union as that person's full override set in
 *  one call, so ticking a Leader box and a Management box for the same person both persist
 *  together instead of overwriting each other. */
async function onSuperiorCheckboxChange(scope, rowStaffId) {
  if (scope === "bulk") return; // bulk saves explicitly via the "Terapkan" button instead
  const checked = Array.from(document.querySelectorAll(`.superior-ms[data-row-staffid="${rowStaffId}"] input[type=checkbox]:checked`)).map(cb => cb.value);
  const noteEl = document.getElementById(`superior-save-note-${rowStaffId}`);
  if (noteEl) { noteEl.textContent = "Menyimpan..."; noteEl.style.color = "var(--text-muted)"; }
  const res = await apiPost("setStaffSuperior", { requesterId: state.user.staffId, staffId: rowStaffId, evaluatorStaffIds: checked });
  if (res.error || res.success === false) {
    if (noteEl) { noteEl.textContent = "Gagal simpan: " + friendlyError(res.error); noteEl.style.color = "var(--red)"; }
    return;
  }
  document.querySelectorAll(`.superior-ms[data-row-staffid="${rowStaffId}"]`).forEach(msEl => {
    const panel = msEl.querySelector(".superior-ms-panel");
    const trigger = msEl.querySelector(".superior-ms-trigger");
    const label = trigger.querySelector(".ms-label");
    const checkedNames = Array.from(panel.querySelectorAll("input[type=checkbox]:checked")).map(cb => cb.dataset.name);
    if (checkedNames.length) {
      label.textContent = checkedNames.join(", ");

/** Click-to-sort on the table headers, STACKING criteria instead of replacing them —
 *  clicking Tier then Job Title sorts by Tier first, and within each Tier group by Job
 *  Title, both active together. Cycles per column on repeat clicks: unsorted -> ascending
 *  -> descending -> back to unsorted (removed from the stack entirely), so there's always
 *  a way to cancel out of a sort instead of being stuck flipping between asc/desc forever.
 *  A brand-new column starts at ascending and is appended as the next (lower-priority)
 *  tiebreaker. */
function sortStaffMappingList(column) {
  const container = document.getElementById("staff-mapping-list-container");
  if (!container) return;
  state._staffMappingSortCriteria = state._staffMappingSortCriteria || [];
  const criteria = state._staffMappingSortCriteria;
  const existingIdx = criteria.findIndex(c => c.column === column);
  if (existingIdx === -1) {
    criteria.push({ column, dir: "asc" });
  } else if (criteria[existingIdx].dir === "asc") {
    criteria[existingIdx].dir = "desc";
  } else {
    criteria.splice(existingIdx, 1); // 3rd click on the same column — cancel it entirely
  }

  const keyMap = { name: "name", tier: "tier", jobTitle: "jobtitle" };
  const rows = Array.from(container.querySelectorAll(":scope > .mapping-row"));
  if (criteria.length) {
    rows.sort((a, b) => {
      for (const c of criteria) {
        const key = keyMap[c.column];
        const cmp = (a.dataset[key] || "").localeCompare(b.dataset[key] || "");
        if (cmp !== 0) return c.dir === "asc" ? cmp : -cmp;
      }
      return 0;
    });
    rows.forEach(r => container.appendChild(r));
  }

  ["name", "tier", "jobTitle"].forEach(c => {
    const arrowEl = document.getElementById(`sort-arrow-${c}`);
    const thEl = document.getElementById(`sort-th-${c}`);
    if (!arrowEl || !thEl) return;
    const idx = criteria.findIndex(x => x.column === c);
    if (idx === -1) {
      arrowEl.innerHTML = "";
      thEl.classList.remove("active");
    } else {
      const dirArrow = criteria[idx].dir === "asc" ? "▲" : "▼";
      const priorityBadge = criteria.length > 1 ? `<sup>${idx + 1}</sup>` : "";
      arrowEl.innerHTML = ` ${dirArrow}${priorityBadge}`;
      thEl.classList.add("active");
    }
  });
}

function updateHistoricalPreview() {
  const cfg = state._historicalCfg;
  if (!cfg) return;
  const previewEl = document.getElementById("historical-live-preview");
  const detailEl = document.getElementById("historical-live-preview-detail");
  const sectionBreakdownEl = document.getElementById("historical-section-breakdown");
  if (!previewEl) return;

  const sumSection = (list, prefix) => {
    let sum = 0, filledCount = 0;
    list.forEach((c, i) => {
      const row = document.querySelector(`.score-select[data-crit-id="${prefix}${i}"]`);
      if (row && row.dataset.value) { sum += Number(row.dataset.value); filledCount++; }
    });
    return { sum, filledCount, total: list.length };
  };

  const a = sumSection(cfg.attitude, "A");
  const b = sumSection(cfg.discipline, "B");
  const c = cfg.placeholder ? { sum: 0, filledCount: 0, total: 0 } : sumSection(cfg.kpi, "C");
  const kpiFactor = cfg.placeholder ? 0 : 20 / cfg.kpi.length;

  let bonusTotal = 0;
  cfg.bonus.forEach((bItem, i) => {
    const input = document.getElementById(`historical-bonus-${i}`);
    const count = Number(input && input.value || 0);
    bonusTotal += bItem.points * count;
  });

  // Current formula (25/25/50) — this is what actually gets saved to the system.
  const sectionAWeighted = a.sum * 1.0;
  const sectionBWeighted = b.sum * 1.0;
  const sectionCWeighted = c.sum * 0.5 * kpiFactor;
  const finalScore = sectionAWeighted + sectionBWeighted + sectionCWeighted + bonusTotal;

  // Reference-only: what the OLD paper-template formula (30/30/40) would have produced
  // from the SAME raw scores — purely so Admin Operational can cross-check against a
  // physical paper record using the SAME math the paper used. NOT what gets saved.
  const kpiMaxRaw = cfg.placeholder ? 0 : cfg.kpi.length * 5;
  const oldSectionAWeighted = a.total ? (a.sum / (a.total * 5)) * 30 : 0;
  const oldSectionBWeighted = b.total ? (b.sum / (b.total * 5)) * 30 : 0;
  const oldSectionCWeighted = kpiMaxRaw ? (c.sum / kpiMaxRaw) * 40 : 0;
  const oldFormulaScore = oldSectionAWeighted + oldSectionBWeighted + oldSectionCWeighted + bonusTotal;

  const totalFilled = a.filledCount + b.filledCount + c.filledCount;
  const totalCriteria = a.total + b.total + c.total;

  if (totalFilled === 0) {
    previewEl.textContent = "–";
    detailEl.textContent = "Belum ada kriteria yang diisi.";
    if (sectionBreakdownEl) sectionBreakdownEl.innerHTML = "";
    return;
  }
  previewEl.textContent = finalScore.toFixed(1);
  detailEl.textContent = totalFilled < totalCriteria
    ? `⚠️ Baru ${totalFilled}/${totalCriteria} kriteria diisi — angka ini masih PARSIAL, belum final.`
    : `Ini yang DISIMPAN sistem (formula 25/25/50).`;

  if (sectionBreakdownEl) {
    sectionBreakdownEl.innerHTML = `
      <table class="mini" style="margin-top:8px;">
        <tr><th>Section</th><th>Raw</th><th>Weighted (25/25/50)</th></tr>
        <tr><td>A — Attitude</td><td>${a.sum} / ${a.total * 5}</td><td>${sectionAWeighted.toFixed(1)}</td></tr>
        <tr><td>B — Discipline</td><td>${b.sum} / ${b.total * 5}</td><td>${sectionBWeighted.toFixed(1)}</td></tr>
        <tr><td>C — KPI</td><td>${c.sum} / ${kpiMaxRaw}</td><td>${sectionCWeighted.toFixed(1)}</td></tr>
        <tr><td>D — Bonus</td><td colspan="2">${bonusTotal >= 0 ? "+" : ""}${bonusTotal}</td></tr>
      </table>
      <div class="hint" style="margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);">
        📋 <strong>Cuma buat cocokin ke kertas</strong> (formula LAMA 30/30/40, TIDAK disimpan): <strong>${oldFormulaScore.toFixed(1)}</strong>
      </div>`;
  }
}

async function saveHistoricalAppraisal() {
  const month = state._historicalMonth;
  if (!month) { showToast("Pilih bulan dulu.", "error"); return; }
  const cfg = state._historicalCfg;

  const collectScores = (list, prefix) => {
    const scores = {};
    for (let i = 0; i < list.length; i++) {
      const row = document.querySelector(`.score-select[data-crit-id="${prefix}${i}"]`);
      if (!row || !row.dataset.value) return null;
      scores[list[i].name] = Number(row.dataset.value);
    }
    return scores;
  };

  const attitudeScores = collectScores(cfg.attitude, "A");
  if (!attitudeScores) { showToast("Isi semua kriteria Section A dulu.", "error"); return; }
  const disciplineScores = collectScores(cfg.discipline, "B");
  if (!disciplineScores) { showToast("Isi semua kriteria Section B dulu.", "error"); return; }
  let kpiScores = {};
  if (!cfg.placeholder) {
    kpiScores = collectScores(cfg.kpi, "C");
    if (!kpiScores) { showToast("Isi semua kriteria Section C dulu.", "error"); return; }
  }
  const bonusEntries = cfg.bonus.map((b, i) => ({
    item: b.item, count: Number(document.getElementById(`historical-bonus-${i}`).value || 0),
  })).filter(e => e.count > 0);

  const res = await apiPost("submitHistoricalAppraisal", {
    enteredById: state.user.staffId, staffId: state._historicalStaffId, month,
    attitudeScores, disciplineScores, kpiScores, bonusEntries,
  });
  if (res.error || res.success === false) { showToast("Gagal simpan: " + friendlyError(res.error), "error"); return; }
  showToast(`Data historis ${state._historicalStaffName} bulan ${monthLabelID(month)} tersimpan! Final Score: ${res.finalScore.toFixed(1)}`);
  loadHistoricalStaffList(month); // refresh list so the ✅ indicator updates immediately
}

async function renderReview() {
  const title = state.user.isHR || state.user.isExecutive || state.user.isAdminOperational ? "Review Everyone's Records" : "Review Your Team";
  const canSeeCompliance = state.user.isExecutive || state.user.isAdminOperational;
  const viewMode = state._reviewViewMode || "list";

  app.innerHTML = topbar(title) + `<div class="loading">Memuat data...</div>`;
  const [res, progressRes] = await Promise.all([
    apiGet("getReviewData", { reviewerId: state.user.staffId, month: state.month }),
    canSeeCompliance ? apiGet("getEvaluatorProgress", { requesterId: state.user.staffId }) : Promise.resolve(null),
  ]);
  if (res.error) {
    app.innerHTML = topbar(title) + `<div class="card"><div class="error">${friendlyError(res.error)}</div></div>`;
    return;
  }
  const rows = res.rows || [];
  // Feed the same lookup cache showComparisonModal() reads from — previously only
  // renderGm() populated this, so opening the detail popup from Review Everyone's
  // Records/Review Your Team always found an empty object regardless of who was
  // clicked, showing "undefined" department and "-" contract for EVERY person here.
  state._currentGmList = rows;
  const showMenuLink = availableScreens(state.user).length > 1;

  const toggleHtml = canSeeCompliance ? tabSwitcher([
    { key: "list", label: "Daftar Karyawan" },
    { key: "compliance", label: "Compliance" },
  ], viewMode, "switchReviewViewMode") : "";

  let bodyHtml;
  if (viewMode === "compliance" && progressRes) {
    if (progressRes.error) {
      bodyHtml = `<div class="card"><div class="error">${friendlyError(progressRes.error)}</div></div>`;
    } else {
      const progress = (progressRes.progress || []).sort((a, b) => a.percentage - b.percentage);
      const groupOrder = ["Leader", "Management", "HR"];
      const groupLabel = { Leader: "Leader", Management: "Management", HR: "HR" };
      const rowHtml = (p) => {
        const barColor = p.percentage >= 100 ? "var(--green)" : p.percentage >= 50 ? "var(--amber)" : "var(--red)";
        return `
          <div class="staff-row" style="cursor:default; display:block;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="name">${p.name}</div>
              <span class="badge" style="background:${p.percentage >= 100 ? "var(--green-bg)" : p.percentage >= 50 ? "var(--amber-bg)" : "var(--red-bg)"}; color:${barColor};">${p.doneTargets}/${p.totalTargets} (${p.percentage}%)</span>
            </div>
            <div style="width:100%; height:6px; background:var(--sand); border-radius:4px; margin-top:8px; overflow:hidden;">
              <div style="width:${p.percentage}%; height:100%; background:${barColor};"></div>
            </div>
          </div>`;
      };
      bodyHtml = `
        <div class="card">
          <div class="hint">Progress evaluator bulan ini — belum termasuk skor, cuma status "sudah/belum isi appraisal".</div>
        </div>
        ${groupOrder.map(tier => {
          const group = progress.filter(p => p.tier === tier);
          if (!group.length) return "";
          return `<div class="card"><h2>${groupLabel[tier]} (${group.length} orang)</h2>${group.map(rowHtml).join("")}</div>`;
        }).join("")}
        ${!progress.length ? '<div class="card"><div class="hint">Belum ada evaluator (Leader/Management/HR) yang terdaftar.</div></div>' : ""}`;
    }
  } else {
    // Stats computed client-side straight from `rows` — no separate getCompanySummary call
    // needed, which matters because that endpoint is gated to Management/Executive/HR/
    // AdminOp and doesn't include Leader. Computing here means Leader (reviewing just their
    // own team) gets the exact same grouped view as everyone else, not a stripped-down one.
    const total = rows.length;
    const avgScore = total ? rows.reduce((s, r) => s + Number(r.finalScore || 0), 0) / total : 0;
    const performerCount = rows.filter(r => r.status === "Performer").length;
    const underperformCount = total - performerCount;
    const approvedCount = rows.filter(r => r.approvalStatus === "Approved").length;

    const rowsByDept = {};
    rows.forEach(r => {
      const dept = r.department !== "-" ? r.department : r.tier;
      if (!rowsByDept[dept]) rowsByDept[dept] = [];
      rowsByDept[dept].push(r);
    });
    const deptKeys = Object.keys(rowsByDept).sort();

    const statBox = (label, value, color) => `
      <div style="flex:1; min-width:110px; background:var(--sand); border-radius:12px; padding:12px; text-align:center;">
        <div style="font-size:22px; font-weight:800; color:${color || "var(--teal)"};">${value}</div>
        <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${label}</div>
      </div>`;

    bodyHtml = `
      <div class="card">
        <div class="row-flex" style="flex-wrap:wrap; gap:8px;">
          ${statBox("Total Appraisal", total)}
          ${statBox("Rata-rata Skor", avgScore.toFixed(1))}
          ${statBox("Performer", performerCount, "var(--green)")}
          ${statBox("Underperform", underperformCount, "var(--red)")}
          ${statBox("Sudah Di-approve", `${approvedCount}/${total}`, "var(--gold)")}
        </div>
      </div>
      <div class="card">
        <input type="text" placeholder="Cari nama..." oninput="updateReviewFilter('search', this.value)" style="margin-bottom:10px;" />
        <div class="row-flex" style="margin-bottom:10px;">
          <select onchange="sortReviewList(this.value)">
            <option value="">Urutkan...</option>
            <option value="name-asc">Nama (A-Z)</option>
            <option value="name-desc">Nama (Z-A)</option>
            <option value="score-desc">Skor Tertinggi</option>
            <option value="score-asc">Skor Terendah</option>
          </select>
          ${deptKeys.length > 1 ? `
          <select onchange="updateReviewFilter('department', this.value)">
            <option value="">Semua Department</option>
            ${deptKeys.map(d => `<option value="${escapeAttr(d)}">${d}</option>`).join("")}
          </select>` : ""}
        </div>
        <button class="secondary" id="review-underperform-btn" onclick="toggleReviewFilterBtn('underperformOnly', 'review-underperform-btn')" style="margin-bottom:10px;">Underperform Saja</button>
        <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
          <div class="hint">${total} appraisal record — read only</div>
          <button class="secondary" onclick="doExportReview()">📊 Export ke Excel</button>
        </div>
        <div class="hint" id="review-export-note"></div>
      </div>
      <div id="review-list-container">
        ${deptKeys.map((dept, di) => {
          const deptRows = rowsByDept[dept];
          const deptAvg = deptRows.reduce((s, r) => s + Number(r.finalScore || 0), 0) / deptRows.length;
          const deptUnderperform = deptRows.filter(r => r.status === "Underperform").length;
          const summaryId = `dept-chevron-${di}`;
          return `
          <details class="review-dept-group" data-department="${escapeAttr(dept)}" open style="margin-bottom:10px; border:1px solid var(--border); border-radius:14px; overflow:hidden;" ontoggle="document.getElementById('${summaryId}').style.transform = this.open ? 'rotate(90deg)' : 'rotate(0deg)'">
            <summary style="cursor:pointer; padding:13px 14px; list-style:none; display:flex; justify-content:space-between; align-items:center; background:linear-gradient(90deg, var(--teal), var(--teal-dark)); color:#fff;">
              <div style="display:flex; align-items:center; gap:8px;">
                <span id="${summaryId}" style="display:inline-block; transition:transform 0.15s ease; font-size:14px; transform:rotate(90deg);">▸</span>
                <div>
                  <span style="font-weight:700;">${dept}</span>
                  <span style="font-weight:400; opacity:0.85;"> (${deptRows.length} orang)</span>
                  ${deptUnderperform > 0 ? `<div style="font-size:12px; color:#FFD9CF; margin-top:2px;">${deptUnderperform} underperform</div>` : ""}
                </div>
              </div>
              ${statusBadge(deptAvg >= 60, deptAvg.toFixed(1))}
            </summary>
            <div class="review-dept-body" style="padding:10px 14px 14px;">
              ${deptRows.map(r => `
                <div class="staff-row" data-search="${escapeAttr(r.name.toLowerCase())}" data-status="${r.status}" data-name="${escapeAttr(r.name)}" data-score="${r.finalScore || 0}" style="cursor:pointer; border: 1.5px solid ${r.status === 'Underperform' ? 'var(--amber)' : 'var(--border)'};" onclick="showComparisonModal('${r.staffId}', '${escapeAttr(r.name)}')">
                  <div>
                    <div class="name">${r.name}</div>
                    <div class="dept">Final Score: ${Number(r.finalScore||0).toFixed(1)}</div>
                    ${r.calibrationAdjustment ? `<div class="dept" style="color:var(--gold); font-weight:700;">⚖️ Calibration ${r.calibrationAdjustment > 0 ? "+" : ""}${r.calibrationAdjustment}</div>` : ""}
                  </div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    ${statusBadge(r.status === 'Performer', r.status)}
                    <span style="color:var(--text-muted); font-size:16px;">›</span>
                  </div>
                </div>`).join("")}
            </div>
          </details>`;
        }).join("")}
      </div>
      ${!rows.length ? '<div class="hint">Belum ada data appraisal di scope kamu.</div>' : ""}`;
  }

  app.innerHTML = topbar(title) + `
    ${showMenuLink ? '<button class="ghost" onclick="goToRoleMenu()">&larr; Kembali ke menu</button>' : ""}
    <div class="card">
      <label>Bulan</label>
      <input type="month" id="month-picker" value="${state.month}" onchange="changeReviewMonth(this.value)" />
    </div>
    ${toggleHtml}
    ${bodyHtml}
  `;
  state._reviewFilters = { search: "", department: "", underperformOnly: false };
}

function toggleReviewFilterBtn(filterKey, btnId) {
  const btn = document.getElementById(btnId);
  const isActive = btn.dataset.active === "true";
  btn.dataset.active = isActive ? "false" : "true";
  btn.style.background = isActive ? "" : "var(--coral)";
  btn.style.color = isActive ? "" : "#fff";
  btn.style.borderColor = isActive ? "" : "var(--coral)";
  updateReviewFilter(filterKey, !isActive);
}

function updateReviewFilter(key, value) {
  state._reviewFilters = state._reviewFilters || {};
  state._reviewFilters[key] = value;
  const f = state._reviewFilters;
  const anyFilterActive = !!(f.search || f.department || f.underperformOnly);

  document.querySelectorAll(".review-dept-group").forEach(group => {
    let groupHasVisibleRow = false;
    group.querySelectorAll("[data-search]").forEach(el => {
      let show = true;
      if (f.search && !el.dataset.search.includes(f.search.toLowerCase())) show = false;
      if (f.underperformOnly && el.dataset.status !== "Underperform") show = false;
      el.style.display = show ? "" : "none";
      if (show) groupHasVisibleRow = true;
    });

    const deptMatches = !f.department || group.dataset.department === f.department;
    const showGroup = deptMatches && groupHasVisibleRow;
    group.style.display = showGroup ? "" : "none";
    // Auto-expand matches when a filter is active, so a result never sits hidden inside a
    // collapsed group — searching for someone shouldn't require also manually opening
    // their department first.
    if (showGroup && anyFilterActive) group.open = true;
  });
}

function sortReviewList(criteria) {
  if (!criteria) return;
  // Sorts WITHIN each department group independently, not globally — a global sort would
  // interleave people from different departments, defeating the point of grouping them.
  document.querySelectorAll(".review-dept-body").forEach(container => {
    const cards = Array.from(container.children);
    cards.sort((a, b) => {
      if (criteria === "name-asc") return a.dataset.name.localeCompare(b.dataset.name);
      if (criteria === "name-desc") return b.dataset.name.localeCompare(a.dataset.name);
      if (criteria === "score-desc") return Number(b.dataset.score) - Number(a.dataset.score);
      if (criteria === "score-asc") return Number(a.dataset.score) - Number(b.dataset.score);
      return 0;
    });
    cards.forEach(c => container.appendChild(c));
  });
}

          ${h.selfTotal === "" && h.hrTotal === "" ? "" : `<div class="dept" style="margin-top:2px; font-size:11px;">Section A ${Number(h.sectionABlend||0).toFixed(1)}/30 · B ${Number(h.sectionBBlend||0).toFixed(1)}/30 · C ${Number(h.sectionCBlend||0).toFixed(1)}/40 · D ${Number(h.sectionDBlend||0)>=0?"+":""}${Number(h.sectionDBlend||0).toFixed(1)}</div>`}
          ${h.approvalStatus === "Approved" && h.decision ? `<div class="dept" style="margin-top:2px;">${findLabel(state.decisionOptionsByTier[state.user.tier], h.decision)}</div>` : ""}

function monthShortLabelID(monthKey) {
  const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
  const idx = Number(String(monthKey).split("-")[1]) - 1;
  return months[idx] || monthKey;
}

function buildScoreChartSvg(history, peerAvg) {
  const width = 600, height = 220, padTop = 24, padBottom = 30, padSide = 30;
  const innerH = height - padTop - padBottom;
  const stepX = history.length > 1 ? (width - padSide * 2) / (history.length - 1) : 0;

  // Dynamic Y-axis — zooms into the actual score range instead of always showing the full
  // 0-100 scale, so small-but-real differences (e.g. 60 -> 69) don't look flat and invisible.
  // Threshold 60 is always included in the range so the dashed line stays meaningful.
  const scores = history.map(h => Number(h.finalScore) || 0);
  const allValues = scores.concat([60]).concat(peerAvg ? [peerAvg.average] : []);
  const rawMin = Math.min.apply(null, allValues);
  const rawMax = Math.max.apply(null, allValues);
  const span = Math.max(rawMax - rawMin, 10); // avoid a degenerate near-zero range
  const padding = span * 0.2;
  const yMin = Math.max(0, rawMin - padding);
  const yMax = Math.min(100, rawMax + padding);
  const yRange = (yMax - yMin) || 1;

  const yFor = (score) => padTop + innerH - ((Math.max(0, Math.min(100, Number(score) || 0)) - yMin) / yRange) * innerH;
  const points = history.map((h, i) => ({ x: padSide + i * stepX, y: yFor(h.finalScore), month: h.month, score: Number(h.finalScore || 0) }));
  const pathD = points.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const thresholdY = yFor(60);
  const peerY = peerAvg ? yFor(peerAvg.average) : null;

  return `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">
      <line x1="${padSide}" y1="${padTop}" x2="${width - padSide}" y2="${padTop}" stroke="#D8D0C4" stroke-width="1" />
      <line x1="${padSide}" y1="${padTop + innerH}" x2="${width - padSide}" y2="${padTop + innerH}" stroke="#D8D0C4" stroke-width="1" />
      <text x="${padSide - 6}" y="${padTop + 4}" text-anchor="end" font-size="9" fill="#6B5D4F">${yMax.toFixed(0)}</text>
      <text x="${padSide - 6}" y="${padTop + innerH}" text-anchor="end" font-size="9" fill="#6B5D4F">${yMin.toFixed(0)}</text>
      <line x1="${padSide}" y1="${thresholdY.toFixed(1)}" x2="${width - padSide}" y2="${thresholdY.toFixed(1)}" stroke="#946017" stroke-dasharray="4 4" stroke-width="1.2" />
      <text x="${width - padSide}" y="${(thresholdY - 6).toFixed(1)}" text-anchor="end" font-size="10" fill="#946017">Threshold 60</text>
      ${peerY !== null ? `
        <line x1="${padSide}" y1="${peerY.toFixed(1)}" x2="${width - padSide}" y2="${peerY.toFixed(1)}" stroke="#6C4FB6" stroke-dasharray="2 3" stroke-width="1.2" />
        <text x="${padSide}" y="${(peerY - 6).toFixed(1)}" text-anchor="start" font-size="10" fill="#6C4FB6">${peerAvg.peerLabel} Average Score: ${peerAvg.average.toFixed(1)}</text>
      ` : ""}
      <path d="${pathD}" fill="none" stroke="#0E4749" stroke-width="2.5" />
      ${points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="${p.score >= 60 ? "#1A6B49" : "#B8352B"}" />`).join("")}
      ${points.map(p => `<text x="${p.x.toFixed(1)}" y="${(p.y - 12).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#20302F">${p.score.toFixed(1)}</text>`).join("")}
      ${points.map(p => `<text x="${p.x.toFixed(1)}" y="${height - 8}" text-anchor="middle" font-size="10" fill="#6B5D4F">${monthShortLabelID(p.month)}</text>`).join("")}
    </svg>
    <div class="hint" style="text-align:center; margin-top:2px;">Skala grafik: ${yMin.toFixed(0)}–${yMax.toFixed(0)} (rentang otomatis, disesuaikan agar tren lebih mudah dibaca).</div>`;
}
